<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8351B3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Точка дня">
<title>Точка дня</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v2.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v2.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --ground:#F4F7FA;
  --card:#FFFFFF;
  --ink:#22303F;
  --mut:#6B7F92;
  --line:#DCE6EE;
  --navy:#28425C;
  --head:#4E7A9E;
  --accent:#2F6091;
  --ok:#4B7F62;
  --ochre:#B08347;
  --stop:#A85147;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,sans-serif;line-height:1.45;
  display:flex;flex-direction:column;align-items:center;padding:26px 14px 56px;
}
.intro{max-width:600px;width:100%;text-align:center;margin-bottom:20px}
.intro .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.intro h1{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(22px,5vw,30px);margin:0 0 8px}
.intro p{margin:0;color:var(--mut);font-size:14px}
.num{font-family:'IBM Plex Mono',monospace;font-weight:500}

/* телефон */
.phone{
  width:390px;max-width:100%;height:800px;background:var(--ground);
  border-radius:34px;border:1px solid var(--line);overflow:hidden;
  box-shadow:0 26px 60px -26px rgba(40,66,92,.5);position:relative;display:flex;flex-direction:column
}
.status{height:24px;flex:0 0 24px;background:var(--head);color:rgba(255,255,255,.75);font-size:10px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.appbar{background:var(--head);color:#fff;padding:6px 18px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.appbar h2{font-family:'Spectral',serif;font-size:18px;margin:0;font-weight:600}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:0 0 26px;display:block}
.appbar .sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.appbar .saved{font-size:10px;color:rgba(255,255,255,.75)}
.screen{flex:1;overflow-y:auto;padding:14px 16px 150px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen[hidden]{display:none}

.tip{background:#E8F0F7;border:1px solid #CBDDEB;border-radius:12px;padding:9px 12px;font-size:12px;color:var(--accent);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.now{border-color:var(--accent);border-width:2px}
.card.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.card.navy .lab,.card.navy .mut{color:rgba(255,255,255,.65)}
.lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:8px}
.mut{color:var(--mut);font-size:12px}
.big{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:500;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin:0}

/* линия дня */
.dayline{position:relative;padding-left:22px}
.spine{position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl-dot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl.next .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut)}
.tl-what{font-size:14px;font-weight:500}
.tl-sum{font-family:'IBM Plex Mono',monospace;font-size:13px}
.now-mark{display:inline-block;background:var(--ochre);color:#fff;font-size:9px;letter-spacing:.14em;padding:2px 8px;border-radius:99px;font-weight:600;margin-bottom:6px}

.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-family:'IBM Plex Mono',monospace;font-weight:500}

.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#EDF3F8;display:flex;align-items:center;justify-content:center;font-size:15px}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:500;font-size:14px}
.item .txt small{color:var(--mut);font-size:11px}
.sum{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;white-space:nowrap}
.sum.in{color:var(--ok)}

.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.seg{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:10px 0}
.seg>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-radius:99px;background:#EDF3F8;
  font-family:inherit;font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
.chip:active{background:#DCE8F3}
.card.tap{cursor:pointer}
.card.tap:active{background:#F7FAFC}
.chip.ok{background:#E7F1EA;color:var(--ok)}
.chip.warn{background:#F6EEE1;color:var(--ochre)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-family:'Golos Text',sans-serif;font-size:14px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}

.switch{display:flex;background:#E6EDF3;border-radius:12px;padding:3px;margin-bottom:12px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;cursor:pointer;font-family:'Golos Text',sans-serif;font-size:13px;font-weight:500;color:var(--mut)}
.switch button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(40,66,92,.12)}

/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:10px;color:var(--mut);padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;background:#fff;border:1px solid var(--line);position:relative}
.cal button.d{cursor:pointer;color:var(--ink);padding:0}
.cal button.d:hover{border-color:var(--accent)}
.cal .d.out{color:#C4D1DC;background:transparent;border-color:transparent}
.cal .d.today{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal .d .mk{position:absolute;bottom:5px;display:flex;gap:2px}
.cal .d .mk i{width:4px;height:4px;border-radius:50%}
.plan-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px;border-radius:14px;font:inherit;cursor:pointer;margin-bottom:10px}
.plan-toggle span:last-child{color:var(--accent);font-size:12px}
.plan-calendar[hidden]{display:none}
.plan-count{position:absolute;right:2px;top:2px;min-width:15px;height:15px;padding:0 3px;border-radius:8px;background:var(--rose);color:#fff;font:9px/15px 'IBM Plex Mono',monospace}
.calendar-stream{display:flex;flex-direction:column;gap:12px}
.month-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px}
.month-title{font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:600;margin:0 4px 12px;color:var(--ink)}
.continuous-cal{gap:3px;align-items:stretch}
.continuous-cal .d{aspect-ratio:auto;min-height:66px;border-radius:9px;align-items:stretch;justify-content:flex-start;padding:6px 4px;text-align:left;overflow:hidden}
.continuous-cal .d.out{min-height:66px}
.continuous-cal .day-num{font:500 12px/1.2 'IBM Plex Mono',monospace;text-align:right;padding-right:2px}
.continuous-cal .day-preview{display:block;margin-top:6px;font:500 9px/1.25 'Golos Text',sans-serif;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.continuous-cal .d.has-plan{background:linear-gradient(145deg,#F4E8FA,#FCEAF1);border-color:#B98BD4;box-shadow:inset 0 0 0 1px rgba(128,81,179,.12)}
.continuous-cal .d.has-plan .day-preview{color:#704395}
.continuous-cal .d.today{background:linear-gradient(145deg,#8051B3,#C7688A);border-color:transparent;color:#fff}
.continuous-cal .d.today .day-preview{color:rgba(255,255,255,.9)}
.day-sheet-date{font-family:'Spectral',Georgia,serif;font-size:20px;font-weight:600;margin-bottom:4px}
.day-sheet-empty{padding:18px 0;color:var(--mut);font-size:13px;text-align:center}
.plan-group{position:relative;padding-left:22px;margin:14px 0 18px}
.plan-group:before{content:'';position:absolute;left:5px;top:5px;bottom:-18px;width:2px;background:var(--line)}
.plan-group:last-child:before{bottom:8px}
.plan-group-title{position:relative;color:var(--mut);font-size:12px;margin-bottom:7px}
.plan-group-title:before{content:'';position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.plan-event{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.plan-event:last-child{border-bottom:0}.plan-event.done .plan-name{text-decoration:line-through;color:var(--mut)}
.plan-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)}
.plan-name{font-size:14px;font-weight:500;cursor:pointer}.plan-meta{display:block;color:var(--mut);font-size:11px;font-weight:400;margin-top:2px}
.plan-actions{display:flex;gap:4px;align-items:center}.plan-empty{padding:14px 0;color:var(--mut);font-size:13px;text-align:center}

.daycard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.cmp{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.cmp:last-of-type{border-bottom:0}
.cmp span{flex:1}
.cmp b{font-family:'IBM Plex Mono',monospace;font-weight:500}
.cmp em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);min-width:82px;text-align:right}
.cmp em.down{color:var(--ok)}
.cmp em.up{color:var(--ochre)}
.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:'Golos Text',sans-serif;font-size:16px;resize:none;background:#FBFDFE}

/* строка ввода */
.fab{position:absolute;right:16px;bottom:76px;min-height:52px;padding:0 18px;border:0;border-radius:99px;
  background:var(--ochre);color:#fff;font-family:'Golos Text',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 20px -6px rgba(176,131,71,.6);z-index:5}
.fab i{font-style:normal;font-size:19px;line-height:1}
.fab:active{transform:scale(.95)}
.fab[hidden]{display:none}
.mini{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:8px;
  padding:5px 9px;font-size:11px;font-family:inherit;cursor:pointer;margin-left:6px;white-space:nowrap}
.mini:active{background:#EAF1F7}
.item.tapline{cursor:pointer}
.item.tapline:active{background:#F5F9FC}

.tabs{position:absolute;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 4px}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:5px 0;font-family:'Golos Text',sans-serif;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button i{font-style:normal;font-size:16px;opacity:.5}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabs button[aria-selected="true"] i{opacity:1}

.sheet{position:absolute;inset:0;background:rgba(34,48,63,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet-in{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .26s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet h3{font-family:'Spectral',serif;font-size:16px;margin:0 0 4px;font-weight:600}
.parse{background:#F4F8FB;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.parse .to{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.parse .to em{font-style:normal;color:var(--mut);font-size:11px;margin-left:auto}
.note{max-width:600px;width:100%;margin-top:22px;font-size:13px;color:var(--mut);text-align:center}

/* ---- рабочая версия: формы, поля, всплывающие сообщения ---- */
html{overflow-x:hidden}
body{padding:0;background:#7052A5;display:block;overflow-x:hidden;width:100%}
.screen{overflow-x:hidden}
.card,.item,.parse,.daycard{max-width:100%}
.item .txt b,.item .txt small,.mut,.empty{overflow-wrap:anywhere}
.phone{width:100%;max-width:520px;height:auto;min-height:100vh;margin:0 auto;border:0;border-radius:0;box-shadow:none;background:var(--ground)}
.status{display:none}
.appbar{position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top))}
.screen{padding-bottom:150px}
.fab{position:fixed;right:max(16px,calc(50% - 230px));bottom:calc(80px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.sheet{position:fixed}
.sheet-in{max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:500}
.fld .hint{display:block;margin-top:5px;color:var(--mut);font-size:11px;line-height:1.35}
.fld input,.fld select,.fld textarea,input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;
  font-family:'Golos Text',sans-serif;font-size:16px;background:#FBFDFE;color:var(--ink)
}
.fld textarea{resize:vertical;min-height:78px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{
  border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;cursor:pointer;
  font-family:'Golos Text',sans-serif;font-size:13px;color:var(--ink)
}
.tick{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--line);background:#fff;border-radius:50%;
  cursor:pointer;color:#fff;font-size:14px;line-height:1;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:60;display:flex;flex-direction:column;gap:6px;width:min(480px,92%)}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;box-shadow:0 10px 24px -12px rgba(40,66,92,.8)}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
.del{border:0;background:transparent;color:var(--stop);font-size:12px;cursor:pointer;font-family:'Golos Text',sans-serif}
.withmic{display:flex;gap:7px;align-items:stretch}
.withmic input,.withmic textarea{flex:1}
.mic{flex:0 0 46px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:17px;cursor:pointer;color:var(--accent)}
.mic[data-on="1"]{background:var(--ochre);border-color:var(--ochre);color:#fff}
.camwrap{position:relative;margin:12px 0;border-radius:14px;overflow:hidden;background:var(--navy);aspect-ratio:4/3}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camline{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--ochre);box-shadow:0 0 10px var(--ochre)}
.warnbar{background:#F6E7E4;border:1px solid #E4C3BD;color:var(--stop);border-radius:12px;padding:9px 12px;font-size:12px;margin-bottom:12px}

/* Праздничная визуальная система — светлая, взрослая, без потери читабельности */
:root{
  --ground:#FBF7FC;
  --card:rgba(255,255,255,.9);
  --ink:#352D42;
  --mut:#7A6D86;
  --line:#E9DDEC;
  --navy:#503B68;
  --head:#8164B5;
  --accent:#7652A8;
  --ok:#4E8C78;
  --ochre:#D47794;
  --stop:#B34D67;
  --lilac:#B894DC;
  --peach:#F3B89F;
  --pink:#E89CB7;
}
body{
  background:
    radial-gradient(circle at 10% 8%,rgba(236,183,211,.28),transparent 29%),
    radial-gradient(circle at 88% 24%,rgba(180,151,222,.25),transparent 31%),
    linear-gradient(145deg,#fffafd 0%,#f7f4ff 52%,#fff7f2 100%);
}
.phone{background:linear-gradient(180deg,#F9F4FD 0%,#FFF9FC 48%,#F8F5FF 100%)}
.appbar{
  background:
    radial-gradient(circle at 86% -40%,rgba(255,255,255,.36),transparent 42%),
    linear-gradient(120deg,#7052A5 0%,#A66EB0 53%,#D77F9D 100%);
  padding-bottom:16px;box-shadow:0 10px 30px rgba(92,62,126,.18)
}
.appbar:after{content:'✦';position:absolute;right:21%;top:14px;color:rgba(255,255,255,.55);font-size:11px}
.brand svg{filter:drop-shadow(0 3px 7px rgba(60,32,85,.22))}
.appbar h2{font-size:20px;letter-spacing:.01em}
.appbar .sub,.appbar .saved{color:rgba(255,255,255,.84)}
.screen{padding-top:18px}
.greeting{
  position:relative;overflow:hidden;margin:0 0 14px;padding:18px 18px 17px;border-radius:22px;color:#fff;
  background:linear-gradient(125deg,#6E50A2 0%,#A965AD 52%,#DC839E 100%);
  box-shadow:0 14px 32px rgba(99,63,132,.22)
}
.greeting:before{content:'✦';position:absolute;right:19px;top:12px;font-size:28px;color:rgba(255,255,255,.2);transform:rotate(12deg)}
.greeting:after{content:'✧';position:absolute;right:58px;bottom:12px;font-size:17px;color:rgba(255,255,255,.26)}
.greeting .hello{font-family:'Spectral',Georgia,serif;font-size:23px;font-weight:600;line-height:1.2;padding-right:48px}
.greeting .moment{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:12px;color:rgba(255,255,255,.84)}
.greeting .moment i{display:block;width:6px;height:6px;border-radius:50%;background:#FFD8C8;box-shadow:0 0 0 4px rgba(255,216,200,.13)}
.greeting.morning{background:linear-gradient(125deg,#D7839E 0%,#EDAA9D 53%,#F2C38F 100%);box-shadow:0 14px 32px rgba(191,111,122,.22)}
.greeting.morning:before{content:'☀';color:rgba(255,248,210,.34)}
.greeting.day{background:linear-gradient(125deg,#7A62B5 0%,#A978C3 50%,#E58FAE 100%)}
.greeting.day:before{content:'✦'}
.greeting.evening{background:linear-gradient(125deg,#68488D 0%,#9B5E9F 50%,#CE718F 100%);box-shadow:0 14px 34px rgba(81,46,103,.27)}
.greeting.evening:before{content:'◐';color:rgba(255,224,210,.3)}
.greeting.night{background:radial-gradient(circle at 82% 20%,rgba(213,179,245,.22),transparent 18%),linear-gradient(130deg,#302A5A 0%,#533C78 55%,#765083 100%);box-shadow:0 14px 34px rgba(42,34,81,.32)}
.greeting.night:before{content:'☾';color:rgba(236,219,255,.32)}

<script>
/* ================= Точка дня — рабочая версия =================
   Один файл. Данные хранятся в браузере телефона, никуда не отправляются.
   Семья приложений: Точка решения / Точка речи / Точка ответа / Точка красоты.
   ============================================================== */

const KEY = 'tochka-dnya-v3';
const APP_VERSION = '4.0';
const APP_UPDATED = '4 сентября 2026';
const SUPABASE_URL = 'https://dcpthwmuiodrjepifzsd.supabase.co';
const SUPABASE_KEY = 'sb_publishable_OL_S1GutrvcvpaRaLzKpsQ_ExxamvKt';
const CATS = ['Продукты','Кафе','Доставка','Дом','Красота','Транспорт','Здоровье','Одежда','Дети','Прочее'];
const REPEATS = [['none','Не повторять'],['year','Каждый год'],['month','Каждый месяц'],['week','Каждую неделю']];
const KINDS = [['plain','Событие'],['bd','День рождения'],['doc','Важная дата']];

const CURR = [['RUB','₽','Рубль'],['AZN','₼','Манат'],['KZT','₸','Тенге']];
function cur(){ return (CURR.find(c => c[0] === (S && S.settings && S.settings.cur)) || CURR[0]); }
function sign(){ return cur()[1]; }

let S = null, storageOk = true;

function blank(){
  return {
    settings:{income:0, save:0, budget:0, art:'web', cur:'RUB', notesTab:'note', name:'', showDone:1, onboarded:0, hi:1},
    exp:[], inc:[], ev:[], notes:[], day:{}, savedAt:null, backupAt:null, firstDataAt:null
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    S = raw ? JSON.parse(raw) : blank();
  }catch(e){ S = blank(); storageOk = false; }
  const b = blank();
  for (const k in b) if (S[k] === undefined) S[k] = b[k];
  for (const k in b.settings) if (S.settings[k] === undefined) S.settings[k] = b.settings[k];
}
function saveQuiet(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  const hasData = S.exp.length || S.inc.length || S.ev.length || S.notes.length || Object.keys(S.day || {}).length;
  if (hasData && !S.firstDataAt) S.firstDataAt = new Date().toISOString();
  S.savedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOk = false; }
  renderAll(); scheduleCloudSync();
}

/* ---------- автоматическое облачное сохранение ---------- */
let cloudClient=null,cloudUser=null,cloudTimer=null,cloudState='local',cloudError='';
function hasUserData(data){
  return !!(data&&(data.exp.length||data.inc.length||data.ev.length||data.notes.length||Object.keys(data.day||{}).length));
}
function cloudLabel(){
  if(!storageOk)return 'НЕ СОХРАНЯЕТСЯ';
  if(cloudState==='syncing')return '⟳ сохраняю в облако';
  if(cloudState==='synced')return '✓ сохранено в облаке';
  if(cloudState==='offline')return '○ без сети · сохранено на телефоне';
  if(cloudState==='error')return '! облако временно недоступно';
  return S&&S.savedAt?'✓ на телефоне '+new Date(S.savedAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):'автосохранение включено';
}
function setCloudState(state,error){cloudState=state;cloudError=error||'';const el=document.getElementById('saved');if(el)el.textContent=cloudLabel();}
function scheduleCloudSync(){
  if(!cloudUser)return;
  clearTimeout(cloudTimer);
  if(!navigator.onLine){setCloudState('offline');return;}
  setCloudState('syncing');
  cloudTimer=setTimeout(pushCloud,900);
}
async function pushCloud(){
  if(!cloudClient||!cloudUser)return;
  if(!navigator.onLine){setCloudState('offline');return;}
  try{
    const payload=JSON.parse(JSON.stringify(S));
    const result=await cloudClient.from('user_app_data').upsert({user_id:cloudUser.id,payload:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(result.error)throw result.error;
    setCloudState('synced');
  }catch(e){setCloudState('error',e&&e.message);}
}
async function connectCloudUser(user){
  cloudUser=user;setCloudState('syncing');
  try{
    const result=await cloudClient.from('user_app_data').select('payload,updated_at').eq('user_id',user.id).maybeSingle();
    if(result.error)throw result.error;
    const remote=result.data&&result.data.payload;
    if(remote&&hasUserData(remote)){
      const localTime=S.savedAt?new Date(S.savedAt).getTime():0,remoteTime=remote.savedAt?new Date(remote.savedAt).getTime():0;
      if(!hasUserData(S)||remoteTime>localTime){S=remote;saveQuiet();renderAll();}
      else await pushCloud();
    }else await pushCloud();
    setCloudState('synced');
  }catch(e){setCloudState(navigator.onLine?'error':'offline',e&&e.message);}
  renderAll();
}
async function initCloud(){
  if(!window.supabase||!window.supabase.createClient){setCloudState('local');return;}
  cloudClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const sessionResult=await cloudClient.auth.getSession();
  if(sessionResult.data&&sessionResult.data.session)await connectCloudUser(sessionResult.data.session.user);
  cloudClient.auth.onAuthStateChange((event,session)=>{
    if(session&&(!cloudUser||cloudUser.id!==session.user.id))setTimeout(()=>connectCloudUser(session.user),0);
    if(!session){cloudUser=null;setCloudState('local');renderAll();}
  });
}
async function cloudLogin(){
  const email=val('cloud-email').toLowerCase(),password=val('cloud-password');
  if(!email||password.length<8){toast('Введите почту и пароль не короче 8 символов');return;}
  setCloudState('syncing');
  const result=await cloudClient.auth.signInWithPassword({email,password});
  if(result.error){setCloudState('error',result.error.message);toast('Не удалось войти. Проверьте почту и пароль');return;}
  closeSheet();toast('Вход выполнен. Данные сохраняются в облаке');
}
async function cloudRegister(){
  const email=val('cloud-email').toLowerCase(),password=val('cloud-password');
  if(!email||password.length<8){toast('Введите почту и пароль не короче 8 символов');return;}
  setCloudState('syncing');
  const result=await cloudClient.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});
  if(result.error){setCloudState('error',result.error.message);toast('Не удалось создать аккаунт: '+result.error.message);return;}
  if(result.data&&result.data.session){closeSheet();toast('Аккаунт создан. Данные отправляются в облако');}
  else toast('Откройте письмо подтверждения, затем вернитесь и войдите');
}
async function cloudSignOut(){
  if(!window.confirm('Выйти из облачного аккаунта? Данные на этом телефоне останутся.'))return;
  await cloudClient.auth.signOut();cloudUser=null;setCloudState('local');renderAll();toast('Вы вышли. Автосохранение на телефоне продолжает работать');
}
window.addEventListener('online',()=>scheduleCloudSync());
window.addEventListener('offline',()=>{if(cloudUser)setCloudState('offline')});

/* ---------- вспомогательное ---------- */
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function iso(d){ const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function money(n, c){
  const s = c ? (CURR.find(x => x[0] === c) || CURR[0])[1] : sign();
  return (Math.round(n) || 0).toLocaleString('ru-RU') + ' ' + s;
}
/* у каждой записи своя валюта. Рубли и манаты не складываются:
   курса приложение не знает и придумывать его не станет */
function curOf(r){ return r.cur || S.settings.cur; }
function inCur(list){ return list.filter(r => curOf(r) === S.settings.cur); }
function num(n){ return (Math.round(n) || 0).toLocaleString('ru-RU'); }
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function humanDate(s){ const d = new Date(s + 'T12:00'); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function monthOf(s){ return s.slice(0,7); }
function prevMonth(m){
  const [y,mm] = m.split('-').map(Number);
  return mm === 1 ? (y-1) + '-12' : y + '-' + String(mm-1).padStart(2,'0');
}
function daysInMonth(m){ const [y,mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); }
function plural(n,a,b,c){ n = Math.abs(n)%100; const d = n%10;
  if (n>10 && n<20) return c; if (d>1 && d<5) return b; if (d===1) return a; return c; }

function toast(t){
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t;
  host.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* ---------- расчёты ---------- */
function expOf(m){ return inCur(S.exp.filter(e => monthOf(e.date) === m)); }
function incOf(m){ return inCur(S.inc.filter(e => monthOf(e.date) === m)); }
/* сколько записано в других валютах — чтобы не молчать об этом */
function otherCurs(m){
  const r = {};
  S.exp.concat(S.inc).forEach(e => {
    if (monthOf(e.date) !== m || curOf(e) === S.settings.cur) return;
    r[curOf(e)] = (r[curOf(e)] || 0) + (+e.sum || 0);
  });
  return Object.entries(r);
}
/* месяц ещё не кончился: сравнивать с прошлым можно только равные отрезки */
function dayNow(){ return new Date().getDate(); }
function expUpTo(m, day){ return expOf(m).filter(e => +e.date.slice(8) <= day); }
function spentUpTo(m, day){ return sum(expUpTo(m, day)); }
function byCatUpTo(m, day){
  const r = {};
  expUpTo(m, day).forEach(e => { r[e.cat] = (r[e.cat] || 0) + (+e.sum || 0); });
  return Object.entries(r).sort((a,b) => b[1] - a[1]);
}
function sum(a){ return a.reduce((s,x) => s + (+x.sum || 0), 0); }
function spentMonth(m){ return sum(expOf(m)); }
function byCat(m){
  const r = {};
  expOf(m).forEach(e => { r[e.cat] = (r[e.cat] || 0) + (+e.sum || 0); });
  return Object.entries(r).sort((a,b) => b[1] - a[1]);
}
function budgetOf(){
  const s = S.settings;
  return s.income ? Math.max(0, s.income - (s.save || 0)) : 0;
}
function freeLeft(){ return budgetOf() - spentMonth(monthOf(today())); }
function daysLeft(){
  const t = new Date(), n = daysInMonth(monthOf(today()));
  return Math.max(1, n - t.getDate() + 1);
}
function occursOn(e, d){
  if (e.date === d) return true;
  if (!e.repeat || e.repeat === 'none' || d < e.date) return false;
  if (e.repeat === 'year')  return e.date.slice(5) === d.slice(5);
  if (e.repeat === 'month') return e.date.slice(8) === d.slice(8);
  if (e.repeat === 'week')  return (new Date(d + 'T12:00') - new Date(e.date + 'T12:00')) % (7*86400000) === 0;
  return false;
}
function repeatLabel(e){
  return e.repeat === 'week' ? 'каждую неделю' : e.repeat === 'month' ? 'каждый месяц' : e.repeat === 'year' ? 'каждый год' : '';
}
function evOf(d){ return S.ev.filter(x => occursOn(x, d)).sort((a,b) => (a.time||'').localeCompare(b.time||'')); }
/* ближайшие даты повторяющихся и разовых событий на N дней вперёд */
function upcoming(days){
  const out = [];
  for (let i = 0; i <= days; i++){
    const d = iso(new Date(Date.now() + i*86400000));
    evOf(d).forEach(e => out.push({e, date:d, in:i}));
  }
  return out;
}
function dayRec(d){ if (!S.day[d]) S.day[d] = {}; return S.day[d]; }
/* на первом экране показываем только то, что в ближайшую неделю:
   событие через месяц утром не нужно, оно живёт в календаре */
function nextEvent(){
  const now = new Date().toTimeString().slice(0,5);
  const t = evOf(today()).find(e => (e.time || '99:99') >= now);
  if (t) return {e:t, when:'сегодня'};
  const up = upcoming(7).find(x => x.date > today());
  if (up) return {e:up.e, when:humanDate(up.date)};
  const far = upcoming(400).find(x => x.date > today());
  return far ? {far:true, e:far.e, when:humanDate(far.date), days:far.in} : null;
}
function todo(){
  const out = [];
  const d = today();
  upcoming(14).filter(x => x.in > 0).slice(0,4).forEach(x => {
    const e = x.e;
    if (e.kind === 'bd' && x.in <= 10)
      out.push(['🎂', e.title,
        'Через ' + x.in + ' ' + plural(x.in,'день','дня','дней') + ' — успеть с подарком', null]);
    else if (e.kind === 'pay' && x.in <= 3)
      out.push(['💳', e.title + (e.plan ? ' — ' + money(e.plan) : ''),
        'Платёж через ' + x.in + ' ' + plural(x.in,'день','дня','дней'), null]);
    else if (e.kind === 'doc' && x.in <= 14)
      out.push(['📄', e.title, 'Срок подходит через ' + x.in + ' ' + plural(x.in,'день','дня','дней'), null]);
  });
  const last = S.backupAt ? (Date.now() - new Date(S.backupAt).getTime()) / 86400000 : 99;
  return out;
}

/* ---------- добавление записей ---------- */
function addExp(o){ S.exp.push(Object.assign({id:uid(), date:today(), src:'вручную', cur:S.settings.cur}, o)); save(); }
function addInc(o){ S.inc.push(Object.assign({id:uid(), date:today(), src:'вручную', cur:S.settings.cur}, o)); save(); }
function addEv(o){ S.ev.push(Object.assign({id:uid(), date:today()}, o)); save(); }
function drop(list, id){
  S[list] = S[list].filter(x => x.id !== id);
  save(); toast('Запись удалена');
}

/* ---------- разбор надиктованного ---------- */
const WORDNUM = {'ноль':0,'один':1,'одну':1,'два':2,'две':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,'девять':9,'десять':10,
 'одиннадцать':11,'двенадцать':12,'тринадцать':13,'четырнадцать':14,'пятнадцать':15,'шестнадцать':16,'семнадцать':17,'восемнадцать':18,'девятнадцать':19,

};
const WDAY_WORDS = {'понедельник':1,'вторник':2,'сред':3,'четверг':4,'пятниц':5,'суббот':6,'воскресен':0};

function parseSum(raw){
  // выражения времени вырезаем, иначе «в шесть» превращается в шесть рублей
  const text = String(raw)
    .replace(/\sв\s+\d{1,2}([:.]\d{2})?(\s+часов|\s+утра|\s+вечера|\s+дня)?/gi,' ')
    .replace(/\sв\s+(час|два|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать)(\s+часов|\s+утра|\s+вечера|\s+дня)?/gi,' ');
  const digits = text.match(/(\d[\d\s]{0,8})\s*(?:р|₽|руб|тыс)?/i);
  if (digits){
    let v = +digits[1].replace(/\s/g,'');
    if (/тыс/i.test(text) && v < 100) v *= 1000;
    if (v > 0) return v;
  }
  const keys = Object.keys(WORDNUM).sort((a,b) => b.length - a.length);
  let total = 0, part = 0, seen = false;
  text.toLowerCase().split(/[\s,]+/).forEach(w => {
    for (const k of keys){
      if (!w.startsWith(k)) continue;
      const v = WORDNUM[k];
      seen = true;
      if (v === 1000){ total += (part >= 1000 ? part / 1000 : (part || 1)) * 1000; part = 0; }
      else part += v;
      break;
    }
  });
  return seen ? total + part : null;
}
const HOURWORD = {'час':13,'один':1,'два':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,
 'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12,'тринадцать':13,'четырнадцать':14,'пятнадцать':15,
 'шестнадцать':16,'семнадцать':17,'восемнадцать':18,'девятнадцать':19,'двадцать':20,'двадцать один':21,
 'двадцать два':22,'двадцать три':23};
const MINWORD = {'ноль ноль':0,'ровно':0,'пятнадцать':15,'тридцать':30,'полтора':30,'сорок пять':45,'десять':10,'двадцать':20,'сорок':40,'пятьдесят':50};
function parseTime(text){
  const low = ' ' + String(text).toLowerCase() + ' ';
  const t = low.match(/(\d{1,2})[:.](\d{2})/);
  if (t && +t[1] <= 23 && +t[2] <= 59) return String(+t[1]).padStart(2,'0') + ':' + t[2];
  if (/полдень/.test(low)) return '12:00';
  if (/полноч/.test(low)) return '00:00';
  const d = low.match(/\sв\s+(\d{1,2})\s*(?:час\w*|ч)?(?:\s+(утра|дня|вечера|ночи))?/);
  if (d && +d[1] <= 23){
    let h = +d[1];
    if (d[2] === 'вечера' && h < 12) h += 12;
    if (d[2] === 'дня' && h < 12 && h > 4) h += 12;
    return String(h).padStart(2,'0') + ':00';
  }
  // числительными: «в пятнадцать ноль ноль», «в десять тридцать», «в шесть вечера»
  const keys = Object.keys(HOURWORD).sort((a,b) => b.length - a.length);
  for (const k of keys){
    const re = new RegExp('\\s(?:в|на|к)\\s+' + k + '(?:\\s+(ноль ноль|тридцать|пятнадцать|сорок пять|десять|двадцать|сорок|пятьдесят|ровно))?(?:\\s+(утра|дня|вечера|ночи))?', 'i');
    const m = low.match(re);
    if (m){
      let h = HOURWORD[k];
      const mins = m[1] ? (MINWORD[m[1]] || 0) : 0;
      const part = m[2];
      if (part === 'вечера' && h < 12) h += 12;
      else if (part === 'ночи' && h < 6) h = h;
      else if (part === 'дня' && h < 12 && h > 4) h += 12;
      else if (!part && h >= 1 && h <= 8 && k !== 'час') h += 12;  // «в шесть» вечером привычнее
      return String(Math.min(23,h)).padStart(2,'0') + ':' + String(mins).padStart(2,'0');
    }
  }
  return null;
}
const ORD = {'первого':1,'второго':2,'третьего':3,'четвёртого':4,'четвертого':4,'пятого':5,'шестого':6,
 'седьмого':7,'восьмого':8,'девятого':9,'десятого':10,'одиннадцатого':11,'двенадцатого':12,'тринадцатого':13,
 'четырнадцатого':14,'пятнадцатого':15,'шестнадцатого':16,'семнадцатого':17,'восемнадцатого':18,'девятнадцатого':19,
 'двадцатого':20,'тридцатого':30,'тридцать первого':31};
const MONTH_GEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function parseDate(text){
  const low = ' ' + String(text).toLowerCase() + ' ';
  const rel = low.match(/через +([0-9]+|две|три|четыре|пять|неделю|месяц|полторы недели)? *(дн[еяй]\w*|недел\w*|месяц\w*)?/);
  if (rel && (rel[1] || rel[2])){
    const w = {'две':2,'три':3,'четыре':4,'пять':5}[rel[1]] || +rel[1] || 1;
    const unit = rel[2] || rel[1] || '';
    let days = 0;
    if (/недел/.test(unit)) days = w * 7;
    else if (/месяц/.test(unit)) days = w * 30;
    else if (/дн/.test(unit)) days = w;
    else if (rel[1] === 'неделю') days = 7;
    else if (rel[1] === 'месяц') days = 30;
    if (days) return iso(new Date(Date.now() + days*86400000));
  }
  if (/позавчера/.test(low)) return iso(new Date(Date.now() - 2*86400000));
  if (/вчера/.test(low)) return iso(new Date(Date.now() - 86400000));
  if (/послезавтра/.test(low)) return iso(new Date(Date.now() + 2*86400000));
  if (/завтра/.test(low)) return iso(new Date(Date.now() + 86400000));
  // «24 сентября» или «двадцать четвёртого сентября»
  for (let mi = 0; mi < 12; mi++){
    if (!low.includes(MONTH_GEN[mi])) continue;
    let day = null;
    const dig = low.match(new RegExp('([0-9]{1,2}) +' + MONTH_GEN[mi]));
    if (dig) day = +dig[1];
    if (!day){
      // сначала составные: «двадцать четвёртого», «тридцать первого»
      const comp = low.match(new RegExp('(двадцать|тридцать) +(перв|втор|треть|четв[её]рт|пят|шест|седьм|восьм|девят)[а-яё]* +' + MONTH_GEN[mi]));
      if (comp){
        const base = comp[1] === 'двадцать' ? 20 : 30;
        const units = {'перв':1,'втор':2,'треть':3,'четв':4,'пят':5,'шест':6,'седьм':7,'восьм':8,'девят':9};
        for (const u in units) if (comp[2].startsWith(u)){ day = base + units[u]; break; }
      }
      if (!day){
        const keys = Object.keys(ORD).sort((a,b) => b.length - a.length);
        for (const k of keys)
          if (new RegExp('(?<!двадцать )(?<!тридцать )' + k + ' +' + MONTH_GEN[mi]).test(low)){ day = ORD[k]; break; }
      }
    }
    if (day){
      const now = new Date();
      let y = now.getFullYear();
      const cand = y + '-' + String(mi+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      return cand < today() ? (y+1) + cand.slice(4) : cand;
    }
  }
  for (const w in WDAY_WORDS){
    if (low.includes(w)){
      const want = WDAY_WORDS[w], d = new Date();
      let add = (want - d.getDay() + 7) % 7;
      if (add === 0) add = 7;
      return iso(new Date(Date.now() + add*86400000));
    }
  }
  return today();
}
function pickCat(text){
  const low = text.toLowerCase();
  for (const c in CAT_WORDS) if (CAT_WORDS[c].some(w => low.includes(w))) return c;
  return 'Прочее';
}
/* Диктовка на телефоне не ставит знаки препинания, поэтому фразу делим
   не по запятым, а по словам-переключателям: «потом», «съела», «купила»,
   «завтра» и подобным. Запятые и точки, если они есть, тоже учитываются. */
const SPLITTERS = ['потом','затем','после этого','ещё','еще','также','а также','плюс',
 'потратила','потратил','купила','купил','заплатила','заплатил','отдала','отдал','перевела',
 'получила','получил','пришла зарплата','пришли деньги','заработала',
 'записалась','записался','встреча','созвон','надо','нужно','заехать','зайти',
 'завтра','послезавтра'];
function segments(text){
  let t = ' ' + String(text).replace(/[,;.!?]/g, ' | ').replace(/\s+/g,' ') + ' ';
  SPLITTERS.forEach(w => {
    t = t.replace(new RegExp('(?<=[\\s|])' + w + '(?=[\\s|])', 'gi'), m => '| ' + m);
  });
  return t.split('|').map(x => x.trim()).filter(x => x.length > 2);
}
/* «купила на 1800, творог 200, молоко 90» — общая сумма и позиции внутри неё */
function splitItems(part){
  const m = part.match(/([а-яё]{3,}[а-яё\s]{0,20}?)\s+(\d{2,6})(?=\s|$)/gi);
  return (m && m.length > 1) ? m.map(x => x.trim()) : null;
}
/* служебные слова, которые женщина говорит между делом */
function stripFiller(t){
  return String(t)
    .replace(/^\s*(так|ну|вот|значит|короче|слушай)\s+/i,' ')
    .replace(/(^| )(запиши|запишите|пожалуйста|напиши|напомни|напомните|отметь|мне нужно|мне надо|нужно напоминание|напоминание за день|чтобы я не забыла|чтобы я не забыл|чтобы я|я хочу|это самое|короче|теперь дальше|теперь|где-то|о том|когда я приду на работу|во сколько|за день|будет)( |$|,)/gi,' ')
    .replace(/ {2,}/g,' ').trim();
}
/* список покупок — одно предложение целиком, а не куски через запятую */
function isShoppingList(t){
  const low = t.toLowerCase();
  return /куп|не забыть|зайти|заехать|заказать|список покупок|взять в магазин/.test(low) && !/[0-9]{2,}/.test(low);
}

/* ---------- список покупок: разбираем фразу на пункты ----------
   Диктовка не ставит запятых, поэтому «яйца творог хлеб» приходит одной
   строкой. Режем по пробелам, но прилагательное приклеиваем к следующему
   слову: «туалетная бумага» и «подсолнечное масло» должны остаться целыми. */
const BUY_RE = /(?:купить|купи|куплю|покупать|взять|возьми|заказать|захватить|прихватить|приобрести)\s+/i;
const SHOPS = {'пятёр':'Пятёрочка','пятер':'Пятёрочка','перекрёст':'Перекрёсток','перекрест':'Перекрёсток',
 'магнит':'Магнит','ашан':'Ашан','лент':'Лента','дикси':'Дикси','вкусвилл':'ВкусВилл',
 'аптек':'Аптека','рынк':'Рынок','рынок':'Рынок','озон':'Озон','вайлдберр':'Вайлдберриз',
 'metro':'Метро','метро ':'Метро'};
function shopOf(t){
  const low = String(t).toLowerCase();
  for (const k in SHOPS) if (low.includes(k)) return SHOPS[k];
  return null;
}
function looksAdj(w){ return w.length > 4 && /(ая|яя|ый|ий|ое|ее|ые|ие|ой|ую|юю|ым|им|ную|ной|ных|ного)$/.test(w); }
function glueWords(chunk){
  const w = chunk.split(/\s+/).filter(Boolean), out = [];
  for (let i = 0; i < w.length; i++){
    if (looksAdj(w[i]) && i + 1 < w.length){ out.push(w[i] + ' ' + w[i+1]); i++; }
    else out.push(w[i]);
  }
  return out;
}
/* «купить» требует винительного падежа, поэтому диктовка даёт «туалетную бумагу».
   В списке пункт должен стоять в именительном: «туалетная бумага». */
function toNom(w){
  if (w.length < 4) return w;
  if (/ую$/.test(w)) return w.slice(0,-2) + 'ая';
  if (/юю$/.test(w)) return w.slice(0,-2) + 'яя';
  if (/[бвгдджзклмнпрстфхцчшщ]у$/.test(w)) return w.slice(0,-1) + 'а';
  if (/[бвгдзлмнпрстфхч]ю$/.test(w)) return w.slice(0,-1) + 'я';
  return w;
}
function listItems(raw){
  let s = ' ' + String(raw).toLowerCase().replace(/[.!?]+/g,' ') + ' ';
  const pos = s.search(BUY_RE);
  if (pos >= 0) s = ' ' + s.slice(pos + s.match(BUY_RE)[0].length);
  s = s.replace(new RegExp('\\s(в|во|на|из)\\s+(' + Object.keys(SHOPS).join('|') + ')[а-яё]*','gi'),' ');
  s = s.replace(/(^|\s)(не забыть|надо|нужно|зайти|заехать|зайду|заеду|сходить|сходи|магазин[а-яё]*|сегодня|завтра|послезавтра|вечером|утром|днём|днем|по дороге|домой|потом|ещё|еще|там|себе)(?=\s|$)/gi,' ');
  const chunks = s.split(/\s*[,;]\s*|\s+и\s+|\s+да\s+|\s+а также\s+/).map(x => x.trim()).filter(Boolean);
  const seen = {}, out = [];
  chunks.forEach(c => glueWords(c).forEach(x => {
    const t = x.replace(/^[\s,.;-]+|[\s,.;-]+$/g,'');
    if (t.length < 2 || seen[t]) return;
    seen[t] = 1;
    const nice = t.split(/\s+/).map(toNom).join(' ');
    out.push({t: nice.charAt(0).toUpperCase() + nice.slice(1), done:false});
  }));
  return out.slice(0,25);
}
/* заметка с датой: «завтра позвонить в клинику» — напомним в этот день */
const DATEHINT = /завтра|послезавтра|через\s|понедельник|вторник|сред[уа]|четверг|пятниц|суббот|воскресен|январ|феврал|март|апрел|ма[йя]\b|июн|июл|август|сентябр|октябр|ноябр|декабр/i;
function noteDue(text){
  if (!DATEHINT.test(String(text))) return null;
  const d = parseDate(text);
  return (d && d > today()) ? d : null;
}
/* единая сборка заметки: сама решает, список это или мысль */
function makeNote(text){
  const rec = {id:uid(), date:today(), text:tidy(stripFiller(text)), kind:'task', done:false};
  if (isShoppingList(text) && BUY_RE.test(text)){
    const it = listItems(text);
    if (it.length){ rec.items = it; rec.where = shopOf(text); }
  }
  const due = noteDue(text);
  if (due) rec.due = due;
  return rec;
}
function parseSpeech(text){
  const out = {exp:[], inc:[], ev:[], notes:[], rest:[]};
  let receipt = null;   // открытый чек: следующие «товар — сумма» станут его составом
  let lastDate = null;  // дата из предыдущей фразы: «через неделю улетаю… вылет в десять»
  let pending = null;   // «завтра в десять ноль ноль» без дела — ждём следующего куска
  const parts = [];
  String(text).split(/(?<=[.!?])\s+/).forEach(sent => {
    const clean0 = stripFiller(sent);
    if (!clean0) return;
    if (isShoppingList(clean0) && !parseTime(clean0) && !/встреч|прилет|прилёт|приезж|приезд|вылет|улета|врач|запись к|созвон|поезд|рейс|день рожд|годовщин/i.test(clean0)){
      out.notes.push(tidy(clean0.replace(/[.!?]+$/,'')));
      return;
    }
    segments(clean0).forEach(x => parts.push(x));
  });
  parts.forEach(part => {
    const low = part.toLowerCase();
    // кусок только про время и дату, без дела — придержим для следующего
    const bareWhen = (parseTime(part) || parseDate(part) !== today()) && clean(part).length < 3;
    if (bareWhen){
      pending = {date:parseDate(part), time:parseTime(part)};
      return;
    }
    const money = parseSum(part);
    // продолжение чека: «творог 200», «молоко 90»
    if (receipt && money && /^[а-яё][а-яё ]{1,22} +[0-9]{2,6} *(руб[а-яё]*|₽)?$/i.test(part.trim())){
      receipt.items.push(part.trim());
      return;
    }
    if (money && /чек|в магазине|закуп|продукты на|покупк/i.test(low)){
      const c = pickCat(part);
      const rec = {cat:c, title:clean(part) || c, sum:money, src:'голосом'};
      out.exp.push(rec);
      receipt = {sum:money, items:[]};
      out.receipts = out.receipts || [];
      out.receipts.push(receipt);
      return;
    }
    const isIncome = /получил|зарплат|аванс|перевели|пришл[аои] деньги|заработал|кэшбэк|premi|прем/i.test(low);
    const hasDate = parseDate(part) !== today() || /сегодня/i.test(low);
    const actionVerb = /отправ|написа|позвон|заеха|зайти|зайду|забра|сходи|отвез|оплат|сдать|встрет|привез|отдат|занест|получит|подать|подпис|улета|улечу|улетаю|прилета/i.test(low);
    const isEvent = /встреч|созвон|запис|маникюр|педикюр|врач|зал|тренир|поезд|вылет|прилет|прилёт|приезж|приезд|рейс|самол[её]т|билет|отпуск|день рожд|позвонить|отправлен/i.test(low)
                    && (parseTime(part) || hasDate);
    const isTask = actionVerb && (parseTime(part) || hasDate || pending);
    if (isEvent || isTask){
      const realMoney = money && (/руб|₽|тысяч|манат|тенге|стоит|цена/i.test(low) || money >= 100);
      let d = parseDate(part);
      let tm = parseTime(part);
      if (pending){
        if (d === today() && !/сегодня/i.test(low)) d = pending.date;
        if (!tm) tm = pending.time;
        pending = null;
      }
      if (d === today() && !/сегодня/i.test(low) && lastDate) d = lastDate;
      if (d !== today()) lastDate = d;
      out.ev.push({date:d, time:tm, title:clean(part) || 'Событие',
                   plan: realMoney ? money : null});
      return;
    }
    if (!money && isShoppingList(part)){
      out.notes.push(tidy(part.replace(/\bкупила\b/i,'купить').replace(/\bкупил\b/i,'купить')));
      return;
    }
    if (money && isIncome){ out.inc.push({title:clean(part) || 'Доход', sum:money, src:'голосом'}); return; }
    if (money){
      const items = splitItems(part);
      if (items && /чек|магазин|куплен|купила|потратила|в том числе/i.test(low)){
        // первая сумма — общая по чеку, остальные позиции уходят в заметку как состав
        const nums = items.map(x => +(x.match(/\d+/) || [0])[0]);
        const total = Math.max(...nums);
        const rest = items.filter(x => +(x.match(/\d+/) || [0])[0] !== total);
        const c = pickCat(part);
        out.exp.push({cat:c, title:clean(items[0]) || c, sum:total, src:'голосом'});
        if (rest.length) out.notes.push(tidy('В чеке на ' + total + ': ' + rest.join(', ')));
        return;
      }
      const c = pickCat(part);
      out.exp.push({cat:c, title:clean(part) || c, sum:money, src:'голосом'});
      return;
    }
    if (!/^(запиши|запишите|пожалуйста|напиши|напомни|отметь|мне|меня|чтобы я?|ну|вот|и|а|это самое|короче)[.,]?$/i.test(part.trim()))
      out.rest.push(part);
  });
  (out.receipts || []).forEach(r => {
    if (r.items.length) out.notes.push(tidy('В чеке на ' + r.sum + ': ' + r.items.join(', ')));
  });
  delete out.receipts;
  return out;
}

/* ---------- оформление надиктованного текста ----------
   Диктовка на телефоне не ставит знаков препинания. Здесь текст доводится
   до читаемого вида: заглавная буква, запятые в перечислениях и перед
   «потом», «затем», «а», «но», точка в конце длинной фразы. */
const NUMWORDS = 'ноль|один|одна|одну|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать|полтора|полторы';
const PREPS = 'в|во|на|за|с|со|из|от|до|к|по|при|про|для|у|о|об|над|под|около|через';
function tidy(t){
  if (!t) return '';
  let s = String(t).replace(/\s+/g,' ').trim();
  // запятая перед словами-связками
  s = s.replace(new RegExp('\\s(потом|затем|после этого|а также|плюс|а|но|однако|зато)\\s','gi'), ', $1 ');
  // запятая перед «и ещё», «ещё»
  s = s.replace(/\s(и ещё|и еще|ещё|еще)\s/gi, ', $1 ');
  // запятая перед числом, если это новый пункт перечисления
  s = s.replace(new RegExp('(?<!^)(?<!,)\\s(?<!(?:' + PREPS + ')\\s)((?:' + NUMWORDS + '|\\d+)\\s+[а-яё]{3,})','gi'), ', $1');
  // чистим сдвоенные знаки и пробелы перед ними
  s = s.replace(/\s*,\s*,+/g, ', ').replace(/\s+,/g, ',').replace(/,\s*$/,'').replace(/\s{2,}/g,' ').trim();
  if (!s) return '';
  s = s.charAt(0).toUpperCase() + s.slice(1);
  // точка в конце — только у длинных фраз, чтобы короткие названия не выглядели странно
  const words = s.split(' ').length;
  if ((words >= 5 || s.includes(',')) && !/[.!?…]$/.test(s)) s += '.';
  return s;
}

function clean(t){
  let s = ' ' + String(t).trim() + ' ';
  const cut = (re) => { s = s.replace(re, ' '); };
  cut(/ (ко мне|у меня|мне|меня|нам|нас|мы|я|мо[йяею]|мои|наш[аи]?) /gi);
  cut(new RegExp(' (перв|втор|треть|четв[ёе]рт|пят|шест|седьм|восьм|девят|десят|одиннадцат|двенадцат|двадцат|тридцат)[а-яё]*о?го ', 'gi'));
  cut(/ (двадцать|тридцать) /gi);
  cut(new RegExp(' (' + MONTH_GEN.join('|') + ') ', 'gi'));
  s = s.replace(/[0-9]{1,2}[:.][0-9]{2}/g,' ');
  cut(/ (ноль ноль|ровно) /gi);
  cut(/ (в|во|на|к) +[0-9]{1,2} /gi);
  cut(new RegExp(' (в|во|на|к) +(' + Object.keys(HOURWORD).join('|') + ')( +(утра|дня|вечера|ночи|часов|часа))? ', 'gi'));
  cut(/ (утра|дня|вечера|ночи|часов|часа) /gi);
  cut(/ (во сколько|за день|нужно напоминание|напоминание)[^,.]* /gi);
  cut(/ (потратила|потратил|заплатила|заплатил|купила|купил|съела|съел|поела|поел|позавтракала|пообедала|поужинала|записалась|записался|получила|получил|пришло|перевели|надо|нужно) /gi);
  cut(/ (в|во|на|за|до|к|с) +(понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье|завтра|послезавтра) /gi);
  cut(/ (завтра|послезавтра|вчера|позавчера|сегодня|утром|днём|днем|вечером) /gi);
  cut(/ через +([0-9]+|две|три|четыре|пять)? *(дн[еяй][а-яё]*|недел[а-яё]*|месяц[а-яё]*)? /gi);
  cut(/^ *(и|а|ну|вот) /gi);
  cut(/ [0-9][0-9 ]*(руб[а-яё]*|₽|тысяч[а-яё]*)? /gi);
  cut(/ на [0-9]+ /gi);
  // числительные идут подряд («сорок пять тысяч»), поэтому пробел справа
  // не съедаем — иначе следующее слово остаётся без пробела и уцелеет
  cut(new RegExp(' (' + Object.keys(WORDNUM).join('|') + ')(?= )', 'gi'));
  cut(/ (тысяч[а-яё]*|миллион[а-яё]*|руб[а-яё]*|₽|манат[а-яё]*|тенге)(?= )/gi);
  s = s.replace(/ {2,}/g,' ').trim();
  s = s.replace(/^(в|во|на|за|про|до|к|и|а|с|у)\s+/i,'').trim();
  for (let n = 0; n < 3; n++)
    s = s.replace(/[\s,]+(в|во|на|за|про|до|к|и|а|с|у|вечером|утром|днём|днем|ночью|за день|во сколько)[.,]?$/i,'').trim();
  s = s.replace(/[\s,]+(что|чтобы|когда|где|как|о том)$/i,'').trim();
  s = s.replace(/[\s,.;]+$/,'').replace(/^[\s,.;]+/,'').trim();
  // «получила зарплату» → название «Зарплата», а не «Зарплату»
  const NOM = {'зарплату':'зарплата','премию':'премия','пенсию':'пенсия','стипендию':'стипендия',
    'подработку':'подработка','предоплату':'предоплата','доплату':'доплата','надбавку':'надбавка',
    'квартплату':'квартплата','страховку':'страховка','аренду':'аренда'};
  s = s.replace(/^[а-яё]+/i, w => NOM[w.toLowerCase()] || w);
  if (s.length < 2) return '';
  return tidy(s.charAt(0).toUpperCase() + s.slice(1));
}

function greetingCard(){
  const now = new Date(), hour = now.getHours();
  const hello = hour < 5 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
  const period = hour < 5 ? 'night' : hour < 12 ? 'morning' : hour < 18 ? 'day' : 'evening';
  const time = now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const phrase = hour < 5 ? 'Пусть всё важное подождёт до утра' :
    hour < 12 ? 'Пусть день начнётся легко и красиво' :
    hour < 18 ? 'Самое время свериться с планами' : 'Можно замедлиться и подвести итоги';
  const name = esc(S.settings.name || '');
  const greeting = name ? hello + ', ' + name + '!' : hello + '!';
  return '<div class="greeting ' + period + '" aria-label="' + greeting + ' Сейчас ' + time + '">' +
    '<div class="hello">' + greeting + '</div>' +
    '<div class="moment"><i aria-hidden="true"></i><span>' + time + ' · ' + phrase + '</span></div></div>';
}
function toggleDone(id){
  const r = dayRec(today());
  r.done = r.done || []; r.doneAt = r.doneAt || {};
  const i = r.done.indexOf(id);
  if (i >= 0){ r.done.splice(i,1); delete r.doneAt[id]; }
  else { r.done.push(id); r.doneAt[id] = today(); }
  save();
}

function monthCalendar(key){
  const p=key.split('-').map(Number),y=p[0],mm=p[1];

  let cells='',shift=(new Date(y,mm-1,1).getDay()+6)%7;

/* ---------- Финансы: самостоятельный учёт расходов ---------- */
let financePeriod = 'week', financeFrom = '', financeTo = '';
function financeDates(){
  const end = today();
  if (financePeriod === 'today') return [end,end];
  if (financePeriod === 'month') return [monthOf(end) + '-01',end];
  if (financePeriod === 'custom') return [financeFrom || end,financeTo || end];
  return [iso(new Date(Date.now()-6*86400000)),end];
}
function financeSet(period){ financePeriod = period; renderMoney(); }
function financeCustom(k,v){ if (k === 'from') financeFrom=v; else financeTo=v; financePeriod='custom'; renderMoney(); }
function setCur(c){ S.settings.cur = c; save(); toast('Валюта: ' + cur()[2]); }
function renderMoney(){

  host.innerHTML =

        '<button aria-selected="' + (financePeriod===x[0]) + '" onclick="financeSet(\'' + x[0] + '\')">' + x[1] + '</button>').join('') + '</div>' +
    (financePeriod === 'custom' ? card('<div class="grid2"><div class="fld" style="margin:0"><label>С</label><input type="date" value="' + (financeFrom||today()) + '" onchange="financeCustom(\'from\',this.value)"></div>' +
      '<div class="fld" style="margin:0"><label>По</label><input type="date" value="' + (financeTo||today()) + '" onchange="financeCustom(\'to\',this.value)"></div></div>') : '') +
    card('<div class="row"><div>' + lab('Расходы за период') + '<div class="big">' + money(total) + '</div></div>' +
      '<div style="min-width:120px"><div class="lab">Валюта</div><select onchange="setCur(this.value)">' +
        CURR.map(c=>'<option value="'+c[0]+'"'+(c[0]===cur()[0]?' selected':'')+'>'+c[2]+' '+c[1]+'</option>').join('') + '</select></div></div>' +
      (cats.length ? '<div class="seg">' + cats.map((c,i)=>'<i style="width:'+(c[1]/total*100)+'%;background:'+colors[i%colors.length]+'"></i>').join('') + '</div>' : '') +
      '<div class="mut" style="margin-top:8px">' + humanDate(from) + ' — ' + humanDate(to) + '</div>', 'navy') +
    card(lab('По категориям') + (cats.length ? cats.map((c,i)=>
      '<div class="stat"><span><i class="dot" style="display:inline-block;margin-right:7px;background:'+colors[i%colors.length]+'"></i>'+esc(c[0])+'</span><b>'+money(c[1])+'</b></div>').join('') :
      '<div class="empty">За выбранный период расходов нет.</div>')) +
    card(lab('Операции') + (rows.length ? rows.map(e=>
      '<div class="item"><div class="ic">₽</div><div class="txt"><b>'+esc(e.title)+'</b><small>'+esc(e.cat)+' · '+humanDate(e.date)+'</small></div>' +

      '<button class="btn" style="margin-top:11px" onclick="openSheet(\'exp\')">Добавить расход</button>');

/* ---------- отправка события в календарь телефона ----------
   Приложение в браузере не может присылать уведомления сам — для этого нужен
   сервер. Поэтому событие уходит файлом в родной календарь телефона,
   и напоминает уже он: за сутки и за два часа. */
function icsDate(d, t){
  const [y,m,dd] = d.split('-');
  if (!t) return y+m+dd;
  return y+m+dd+'T'+t.replace(':','')+'00';
}
function eventICS(e){
  const allDay = !e.time;
  const start = icsDate(e.date, e.time);
  const end = e.time ? icsDate(e.date, String(Math.min(23, +e.time.slice(0,2)+1)).padStart(2,'0') + e.time.slice(2)) : start;
  const rule = e.repeat === 'year' ? 'RRULE:FREQ=YEARLY\r\n'
             : e.repeat === 'month' ? 'RRULE:FREQ=MONTHLY\r\n'
             : e.repeat === 'week' ? 'RRULE:FREQ=WEEKLY\r\n' : '';
  const alarm = (mins, txt) =>
    'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:' + txt + '\r\nTRIGGER:-PT' + mins + 'M\r\nEND:VALARM\r\n';
  return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Точка дня//RU\r\nCALSCALE:GREGORIAN\r\n' +
    'BEGIN:VEVENT\r\nUID:' + e.id + '@tochka-dnya\r\n' +
    'DTSTAMP:' + icsDate(today(), '00:00') + 'Z\r\n' +
    (allDay ? 'DTSTART;VALUE=DATE:' + start + '\r\nDTEND;VALUE=DATE:' + start + '\r\n'
            : 'DTSTART:' + start + '\r\nDTEND:' + end + '\r\n') +
    rule +
    'SUMMARY:' + String(e.title).replace(/[,;]/g,' ') + '\r\n' +
    (e.desc ? 'DESCRIPTION:' + String(e.desc).replace(/[,;]/g,' ') + '\r\n'
            : e.plan ? 'DESCRIPTION:Планируемый расход ' + e.plan + '\r\n' : '') +
    alarm(1440, 'Завтра: ' + String(e.title).replace(/[,;]/g,' ')) +
    (e.time ? alarm(120, 'Через два часа') : '') +
    'END:VEVENT\r\nEND:VCALENDAR\r\n';
}
async function toPhoneCalendar(id){
  const e = S.ev.find(x => x.id === id);
  if (e) toPhoneCalendarObj(e);
}
async function toPhoneCalendarObj(e){
  if (!e) return;
  const file = new File([eventICS(e)], 'sobytie.ics', {type:'text/calendar'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:e.title}); toast('Откройте файл — событие добавится в календарь телефона'); return; }
    catch(err){ if (err && err.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = 'sobytie.ics'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Файл сохранён — откройте его, событие добавится в календарь с напоминанием');
}

/* ================= Наблюдения =================
   Приложение считает только по вашим же записям и только тогда, когда данных
   достаточно. Если их мало — оно молчит, а не выдумывает закономерность.
   Показывается вуалью: намёк без цифр, открывать или нет — решаете вы. */
const WDAY_ACC = ['воскресенья','понедельники','вторники','среды','четверги','пятницы','субботы'];
const WDAY_DAT = ['воскресеньям','понедельникам','вторникам','средам','четвергам','пятницам','субботам'];
const OBS_NOTE = 'Это совпадение в ваших записях, а не причина и следствие. Приложение ничего не предсказывает.';
function avgOf(a){ return a.length ? a.reduce((s,x) => s + x, 0) / a.length : 0; }
function obsCfg(){
  if (!S.settings.obs) S.settings.obs = {off:0, lastAt:null, seen:{}, muted:{}};
  const o = S.settings.obs;
  o.seen = o.seen || {}; o.muted = o.muted || {};
  return o;
}
function spentOn(d){ return sum(S.exp.filter(e => e.date === d)); }

/* день недели с заметно большими тратами */
function obsWeekday(){
  const dates = [...new Set(S.exp.map(e => e.date))].sort();
  if (S.exp.length < 15 || dates.length < 10) return null;
  const span = (new Date(dates[dates.length-1] + 'T12:00') - new Date(dates[0] + 'T12:00')) / 86400000;
  if (span < 20) return null;
  const bySum = {}, byCount = {};
  for (let t = new Date(dates[0] + 'T12:00'); t <= new Date(dates[dates.length-1] + 'T12:00'); t.setDate(t.getDate() + 1)){
    const w = t.getDay(), d = iso(t);
    byCount[w] = (byCount[w] || 0) + 1;
    bySum[w] = (bySum[w] || 0) + spentOn(d);
  }
  const avg = Object.keys(byCount).filter(w => byCount[w] >= 3).map(w => [+w, bySum[w] / byCount[w]]);
  if (avg.length < 6) return null;
  avg.sort((a,b) => b[1] - a[1]);
  const top = avg[0], rest = avgOf(avg.slice(1).map(x => x[1]));
  if (!rest || top[1] < rest * 1.5) return null;
  return {id:'wday',
    teaser:'Кое-что заметила про ваши ' + WDAY_ACC[top[0]] + '.',
    title:'Дни недели',
    body:'По ' + WDAY_DAT[top[0]] + ' у вас уходит в среднем ' + money(top[1]) +
         ', в остальные дни — ' + money(rest) + '.'};
}
/* категория, куда уходит много мелкими шагами */
function obsHabit(){
  const m = monthOf(today()), by = {};
  expOf(m).forEach(e => { by[e.cat] = by[e.cat] || {n:0, s:0}; by[e.cat].n++; by[e.cat].s += +e.sum || 0; });
  const c = Object.entries(by).filter(x => x[1].n >= 6).sort((a,b) => b[1].s - a[1].s)[0];
  if (!c) return null;
  return {id:'habit',
    teaser:'Одна привычка набегает по мелочи.',
    title:'Мелкими шагами',
    body:'В этом месяце «' + c[0] + '» — ' + c[1].n + ' ' + plural(c[1].n,'раз','раза','раз') +
         ' на ' + money(c[1].s) + '. В среднем ' + money(c[1].s / c[1].n) + ' за раз.'};
}
/* категория, которая заметно изменилась к прошлому месяцу */
function obsMonthCat(){
  const m = monthOf(today()), pm = prevMonth(m);
  if (expOf(pm).length < 5 || expOf(m).length < 5) return null;
  // сравниваем равные отрезки: неполный месяц против полного дал бы ложное «стало меньше»
  const day = dayNow(), full = day >= daysInMonth(m);
  const now = Object.fromEntries(full ? byCat(m) : byCatUpTo(m, day));
  const was = Object.fromEntries(full ? byCat(pm) : byCatUpTo(pm, day));
  let best = null;
  Object.keys(Object.assign({}, now, was)).forEach(c => {
    const a = now[c] || 0, b = was[c] || 0, d = a - b;
    if (!b || Math.abs(d) < 1000 || Math.abs(d) / b < 0.3) return;
    if (!best || Math.abs(d) > Math.abs(best.d)) best = {c, a, b, d};
  });
  if (!best) return null;
  return {id:'mcat',
    teaser:'Одна категория в этом месяце ведёт себя иначе.',
    title:'Не как в прошлом месяце',
    body:(full ? '' : 'За первые ' + day + ' ' + plural(day,'день','дня','дней') + ' месяца. ') +
         '«' + best.c + '»: было ' + money(best.b) + ', стало ' + money(best.a) + ' — ' +
         (best.d > 0 ? 'больше на ' : 'меньше на ') + money(Math.abs(best.d)) + '.'};
}
function allObs(){
  return [obsWeekday(), obsHabit(), obsMonthCat()]
    .filter(Boolean);
}
/* вуаль: намёк без цифр, не чаще раза в три дня */
function pickObs(){
  const o = obsCfg();
  if (o.off) return null;
  if (o.lastAt && (Date.now() - new Date(o.lastAt).getTime()) / 86400000 < 3) return null;
  const list = allObs().filter(x => !o.muted[x.id]);
  if (!list.length) return null;
  list.sort((a,b) => (o.seen[a.id] || 0) - (o.seen[b.id] || 0) || a.id.localeCompare(b.id));
  return list[0];
}

function backupDue(){
  const records = S.exp.length + S.inc.length + S.ev.length + S.notes.length + Object.keys(S.day || {}).length;
  if (!records) return false;

function timeOptions(selected){
  const chosen = String(selected || '');
  const values = [];
  for (let h=0; h<24; h++) for (let m=0; m<60; m+=30)
    values.push(String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0'));
  if (chosen && !values.includes(chosen)) values.push(chosen);
  values.sort();
  return '<option value="">Без времени</option>' + values.map(t =>
    '<option value="' + t + '"' + (t === chosen ? ' selected' : '') + '>' + t + '</option>').join('');
}

  const stats = {};

    const title = tidy(e.title || ''), key = title.toLowerCase(); if (!key) return;
    if (!stats[key]) stats[key] = {title:title,count:0,last:idx};

  const learned = Object.values(stats).sort((a,b)=>b.count-a.count || b.last-a.last).map(x=>x.title);

/* ---------- разбор фразы, надиктованной в первое поле ----------
   Клавиатура телефона кладёт весь распознанный текст туда, где стоит курсор.
   Поэтому из первого поля вынимаем сумму, дату и время и раскладываем их
   по своим полям, а в названии оставляем только суть. */
function spillTitle(el){
  if (!el) return;
  const raw = (el.value || '').trim();
  if (!raw) return;
  const sumEl = document.getElementById('f-sum');
  const dateEl = document.getElementById('f-date');
  const timeEl = document.getElementById('f-time');
  const moved = [];
  if (sumEl && !sumEl.value.trim()){
    const v = parseSum(' ' + raw + ' ');
    if (v){ sumEl.value = v; moved.push('сумма ' + num(v) + ' ' + sign()); }
  }
  if (dateEl && dateEl.value === today()){
    const d = parseDate(raw);
    if (d && d !== today()){ dateEl.value = d; moved.push('дата ' + humanDate(d)); }
  }
  if (timeEl && !timeEl.value.trim()){
    const tm = parseTime(' ' + raw + ' ');
    if (tm){ setTimeValue(timeEl, tm); moved.push('время ' + tm); }
  }
  if (!moved.length){ el.value = tidy(raw); return; }
  el.value = clean(raw) || tidy(raw);
  toast('Разложила: ' + moved.join(', '));
}
/* если поле не успело потерять фокус, разбираем прямо при нажатии кнопки */
function spillBeforeSave(){
  const t = document.getElementById('f-title');
  const s = document.getElementById('f-sum');
  if (t && s && !s.value.trim()) spillTitle(t);
}

function fixSum(el){
  const raw = (el.value || '').trim();
  if (!raw) return;
  if (/^[0-9]+([.,][0-9]+)?$/.test(raw.replace(/\s/g,''))){ el.value = raw.replace(/\s/g,'').replace(',','.'); return; }
  const n = parseSum(' ' + raw + ' ');
  if (n) el.value = n;
  else { el.value = ''; toast('Не поняла сумму — скажите «восемьсот» или напишите цифрами'); }
}
function fixTime(el){
  const raw = (el.value || '').trim();
  if (!raw) return;
  let t = parseTime(' в ' + raw + ' ') || parseTime(' ' + raw + ' ');
  if (!t){
    const m = raw.match(/^([0-9]{1,2})[^0-9]?([0-9]{2})?$/);
    if (m && +m[1] <= 23 && +(m[2] || 0) <= 59)
      t = String(+m[1]).padStart(2,'0') + ':' + (m[2] || '00');
  }
  if (t) el.value = t;
  else { el.value = ''; toast('Время должно быть от 00:00 до 23:59, например 10:15'); }
}
function validTime(t){ return !t || /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
function saveEv(){
  const raw = val('f-title');
  if (!raw){ toast('Впишите, что за событие'); return; }
  const timeEl = document.getElementById('f-time');
  if (timeEl) fixTime(timeEl);
  if (!validTime(val('f-time'))){ toast('Проверьте время: например 10:15'); return; }
  const kind = picked('p-kind','plain');
  // если дату и время сказали прямо в названии — вынимаем их оттуда
  const saidDate = parseDate(raw), saidTime = parseTime(' ' + raw + ' ');
  const t = clean(raw) || tidy(raw);
  addEv({title: t,
         date: val('f-date') && val('f-date') !== today() ? val('f-date') : (saidDate || today()),
         time: val('f-time') || saidTime || null,
         address: tidy(val('f-address')) || null,
         plan: +val('f-sum') || null, kind: kind,
         repeat: picked('p-rep', kind === 'bd' ? 'year' : 'none')});
  closeSheet(); toast(kind === 'bd' ? 'День рождения запомнен — напомню за 10 дней' : 'Добавлено в календарь');
}
