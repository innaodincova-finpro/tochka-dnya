<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7052A5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Точка дня">
<title>Точка дня</title>
<link rel="apple-touch-icon" sizes="180x180" href="icon-180-v3.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192-v3.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- шрифты не задерживают первую отрисовку: экран появляется сразу
     системным шрифтом, а фирменный подставляется, когда придёт -->
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"></noscript>
<style>

/* Действующая палитра объявлена ниже, в праздничном блоке. Прежний синий
   набор был перекрыт по всем одиннадцати значениям и только сбивал с толку. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,sans-serif;line-height:1.45;
  display:flex;flex-direction:column;align-items:center;padding:26px 14px 56px;
}
.intro{max-width:600px;width:100%;text-align:center;margin-bottom:20px}
.intro .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.intro h1{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(22px,5vw,30px);margin:0 0 8px}
.intro p{margin:0;color:var(--mut);font-size:14px}
.num{font-family:'IBM Plex Mono',monospace;font-weight:500}

/* телефон */
.phone{
  width:390px;max-width:100%;height:800px;background:var(--ground);
  border-radius:34px;border:1px solid var(--line);overflow:hidden;
  box-shadow:0 26px 60px -26px rgba(40,66,92,.5);position:relative;display:flex;flex-direction:column
}
.status{height:24px;flex:0 0 24px;background:var(--head);color:rgba(255,255,255,.75);font-size:10px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.appbar{background:var(--head);color:#fff;padding:6px 18px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.appbar h2{font-family:'Spectral',serif;font-size:18px;margin:0;font-weight:600}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:26px;height:26px;flex:0 0 26px;display:block}
.appbar .sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.appbar .saved{font-size:10px;color:rgba(255,255,255,.75)}
.screen{flex:1;overflow-y:auto;padding:14px 16px 150px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen[hidden]{display:none}

.tip{background:#E8F0F7;border:1px solid #CBDDEB;border-radius:12px;padding:9px 12px;font-size:12px;color:var(--accent);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.now{border-color:var(--accent);border-width:2px}
.card.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.card.navy .lab,.card.navy .mut{color:rgba(255,255,255,.65)}
.lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:8px}
.mut{color:var(--mut);font-size:12px}
.big{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:500;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin:0}

/* линия дня */
.dayline{position:relative;padding-left:22px}
.spine{position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl-dot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl.next .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl.late .tl-dot{background:var(--ochre);border-color:var(--ochre)}
.tl.late .tl-time{color:var(--stop)}
.late-mark{font:500 10px 'Golos Text',sans-serif;color:var(--stop)}
.tl-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut)}
.tl-what{font-size:14px;font-weight:500}
.tl-sum{font-family:'IBM Plex Mono',monospace;font-size:13px}
.now-mark{display:inline-block;background:var(--ochre);color:#fff;font-size:9px;letter-spacing:.14em;padding:2px 8px;border-radius:99px;font-weight:600;margin-bottom:6px}

.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-family:'IBM Plex Mono',monospace;font-weight:500}

.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#EDF3F8;display:flex;align-items:center;justify-content:center;font-size:15px}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:500;font-size:14px}
.item .txt small{display:block;margin-top:2px;color:var(--mut);font-size:11px}
.sum{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;white-space:nowrap}
.sum.in{color:var(--ok)}

.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.seg{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:10px 0}
.seg>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-radius:99px;background:#EDF3F8;
  font-family:inherit;font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
.chip:active{background:#DCE8F3}
.card.tap{cursor:pointer}
.card.tap:active{background:#F7FAFC}
.chip.ok{background:#E7F1EA;color:var(--ok)}
.chip.warn{background:#F6EEE1;color:var(--ochre)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-family:'Golos Text',sans-serif;font-size:14px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}

.switch{display:flex;background:#E6EDF3;border-radius:12px;padding:3px;margin-bottom:12px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;cursor:pointer;font-family:'Golos Text',sans-serif;font-size:13px;font-weight:500;color:var(--mut)}
.switch button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(40,66,92,.12)}

/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:10px;color:var(--mut);padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;background:#fff;border:1px solid var(--line);position:relative}
.cal button.d{cursor:pointer;color:var(--ink);padding:0}
.cal button.d:hover{border-color:var(--accent)}
.cal .d.out{color:#C4D1DC;background:transparent;border-color:transparent}
.cal .d.today{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal .d .mk{position:absolute;bottom:5px;display:flex;gap:2px}
.cal .d .mk i{width:4px;height:4px;border-radius:50%}
.plan-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);background:#fff;color:var(--ink);padding:12px 14px;border-radius:14px;font:inherit;cursor:pointer;margin-bottom:10px}
.plan-toggle span:last-child{color:var(--accent);font-size:12px}
.plan-calendar[hidden]{display:none}
.calendar-stream{display:flex;flex-direction:column;gap:12px}
.month-card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 10px}
.month-title{font-family:'Spectral',Georgia,serif;font-size:19px;font-weight:600;margin:0 4px 12px;color:var(--ink)}
.continuous-cal{gap:3px;align-items:stretch}
.continuous-cal .d{aspect-ratio:auto;min-height:72px;border-radius:9px;align-items:stretch;justify-content:flex-start;padding:6px 4px;text-align:left;overflow:hidden}
.continuous-cal .d.out{min-height:72px}
.continuous-cal .day-num{font:500 12px/1.2 'IBM Plex Mono',monospace;text-align:right;padding-right:2px}
/* Две строки, слова целиком. Перенос по слогам выключен: он давал «Гинеко-лог».
   Длинное слово не рвётся, а набирается мельче — так оно помещается целиком. */
.continuous-cal .day-preview{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  margin-top:5px;font:500 9px/1.25 'Golos Text',sans-serif;color:var(--mut);
  overflow:hidden;word-break:keep-all;overflow-wrap:normal;hyphens:none;letter-spacing:-.01em}
.continuous-cal .day-preview.p-s{font-size:8px;letter-spacing:-.02em}
.continuous-cal .day-preview.p-xs{font-size:7px;letter-spacing:-.03em}
.continuous-cal .d.has-plan{background:linear-gradient(145deg,#F4E8FA,#FCEAF1);border-color:#B98BD4;box-shadow:inset 0 0 0 1px rgba(128,81,179,.12)}
.continuous-cal .d.has-plan .day-preview{color:#704395}
/* впереди — спокойный сиреневый; прошло и не отмечено — тёплый тревожный;
   закрыто — приглушённая зелень. Цвет означает состояние, не вид записи. */
.continuous-cal .d.day-missed{background:linear-gradient(145deg,#FCEFE2,#FBE4E4);border-color:#D9A06A;
  box-shadow:inset 0 0 0 1px rgba(179,77,103,.14)}
.continuous-cal .d.day-missed .day-preview{color:#A85F3C}
.continuous-cal .d.day-missed .day-num{color:#A85F3C}
.continuous-cal .d.day-done{background:linear-gradient(145deg,#EAF3EE,#F3F7F4);border-color:#9BC3AE;box-shadow:none}
.continuous-cal .d.day-done .day-preview{color:#4E8C78;text-decoration:line-through;opacity:.75}
.continuous-cal .d.day-done .day-num{color:#4E8C78}
.continuous-cal .d.today{background:linear-gradient(145deg,#8051B3,#C7688A);border-color:transparent;color:#fff}
.continuous-cal .d.today .day-preview{color:rgba(255,255,255,.9)}
.day-sheet-date{font-family:'Spectral',Georgia,serif;font-size:20px;font-weight:600;margin-bottom:4px}
.day-sheet-empty{padding:18px 0;color:var(--mut);font-size:13px;text-align:center}
.plan-group{position:relative;padding-left:22px;margin:14px 0 18px}
.plan-group:before{content:'';position:absolute;left:5px;top:5px;bottom:-18px;width:2px;background:var(--line)}
.plan-group:last-child:before{bottom:8px}
.plan-group-title{position:relative;color:var(--mut);font-size:12px;margin-bottom:7px}
.plan-group-title:before{content:'';position:absolute;left:-21px;top:3px;width:9px;height:9px;border-radius:50%;background:#fff;border:2px solid var(--accent)}
.plan-event{display:grid;grid-template-columns:52px minmax(0,1fr) auto;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.plan-event:last-child{border-bottom:0}.plan-event.done .plan-name{text-decoration:line-through;color:var(--mut)}
.plan-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent)}
.plan-name{font-size:14px;font-weight:500;cursor:pointer}.plan-meta{display:block;color:var(--mut);font-size:11px;font-weight:400;margin-top:2px}
.plan-actions{display:flex;gap:4px;align-items:center}.plan-empty{padding:14px 0;color:var(--mut);font-size:13px;text-align:center}

.daycard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.cmp{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.cmp:last-of-type{border-bottom:0}
.cmp span{flex:1}
.cmp b{font-family:'IBM Plex Mono',monospace;font-weight:500}
.cmp em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);min-width:82px;text-align:right}
.cmp em.down{color:var(--ok)}
.cmp em.up{color:var(--ochre)}
.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:'Golos Text',sans-serif;font-size:16px;resize:none;background:#FBFDFE}

/* строка ввода */
.fab{position:absolute;right:16px;bottom:76px;min-height:52px;padding:0 18px;border:0;border-radius:99px;
  background:var(--ochre);color:#fff;font-family:'Golos Text',sans-serif;font-size:14px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 20px -6px rgba(176,131,71,.6);z-index:5}
.fab i{font-style:normal;font-size:19px;line-height:1}
.fab:active{transform:scale(.95)}
.fab[hidden]{display:none}
.mini{border:1px solid var(--line);background:#fff;color:var(--accent);border-radius:8px;
  padding:5px 9px;font-size:11px;font-family:inherit;cursor:pointer;margin-left:6px;white-space:nowrap}
.mini:active{background:#EAF1F7}
.item.tapline{cursor:pointer}
.item.tapline:active{background:#F5F9FC}

.tabs{position:absolute;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 4px}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:5px 0;font-family:'Golos Text',sans-serif;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button i{font-style:normal;font-size:16px;opacity:.5}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabs button[aria-selected="true"] i{opacity:1}

.sheet{position:absolute;inset:0;background:rgba(34,48,63,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet-in{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .26s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet h3{font-family:'Spectral',serif;font-size:16px;margin:0 0 4px;font-weight:600}
.parse{background:#F4F8FB;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.parse .to{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.parse .to em{font-style:normal;color:var(--mut);font-size:11px;margin-left:auto}
.note{max-width:600px;width:100%;margin-top:22px;font-size:13px;color:var(--mut);text-align:center}

/* ---- рабочая версия: формы, поля, всплывающие сообщения ---- */
html{overflow-x:hidden}
body{padding:0;background:#7052A5;display:block;overflow-x:hidden;width:100%}
.phone,.screen,.sheet-in{max-width:100%;overflow-x:hidden}
.phone *{min-width:0}
.screen{overflow-x:hidden}
.card,.item,.parse,.daycard{max-width:100%}
.item .txt b,.item .txt small,.mut,.empty{overflow-wrap:anywhere}
.phone{width:100%;max-width:520px;height:auto;min-height:100vh;margin:0 auto;border:0;border-radius:0;box-shadow:none;background:var(--ground)}
.status{display:none}
.appbar{position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top))}
@supports (-webkit-touch-callout:none){
  @media (display-mode:standalone){
    .appbar{padding-top:max(calc(10px + env(safe-area-inset-top)),54px)}
  }
}
.screen{padding-bottom:150px}
.fab{position:fixed;right:max(16px,calc(50% - 230px));bottom:calc(80px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.sheet{position:fixed}
.sheet-in{max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:500}
.fld .hint{display:block;margin-top:5px;color:var(--mut);font-size:11px;line-height:1.35}
.fld input,.fld select,.fld textarea,input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;
  font-family:'Golos Text',sans-serif;font-size:16px;background:#FBFDFE;color:var(--ink)
}
.fld textarea{resize:vertical;min-height:78px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.fld{position:relative}
.hints{display:none;position:absolute;left:0;right:0;top:100%;z-index:30;margin-top:5px;
  max-height:238px;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#fff;
  border:1px solid var(--line);border-radius:14px;box-shadow:0 16px 38px rgba(70,45,90,.16)}
.hints.open{display:block}
.hint-row{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;
  border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer;
  padding:13px 14px;font:400 15px 'Golos Text',sans-serif;color:var(--ink)}
.hint-row:last-child{border-bottom:0}
.hint-row:active{background:#F3ECF8}
.note-search{width:100%;margin-bottom:11px;padding:13px 14px;border:1px solid var(--line);
  border-radius:14px;background:rgba(255,255,255,.85);font:400 15px 'Golos Text',sans-serif;color:var(--ink)}
.quick-note{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:end}
.quick-note textarea{min-height:52px;max-height:150px;padding:14px 15px;line-height:1.4;resize:vertical}
.quick-note textarea:only-child{grid-column:1/-1}
.quick-note .mic{height:52px;flex-basis:44px;font-size:0}
.quick-note .mic:after{content:'🎙';font-size:17px}
.quick-note-actions{display:flex;align-items:center;justify-content:flex-end;margin-top:10px}
.quick-note-actions .btn{width:auto;min-width:132px;margin:0;padding:11px 18px}
/* Кнопки стояли в одной строке с текстом и отнимали у него ширину:
   на телефоне от заметки оставалась колонка в три слова. */
.note-row{width:100%}
.note-tools{display:flex;align-items:center;justify-content:flex-end;gap:7px;
  flex-wrap:nowrap;padding:9px 0 10px;border-top:1px solid rgba(228,215,232,.72);position:relative}
.fold{padding:0;overflow:hidden}
.fold-head{display:flex;width:100%;align-items:center;gap:9px;border:0;background:transparent;
  padding:15px 16px;cursor:pointer;text-align:left;font:inherit}
.fold-title{font:600 14px/1.25 'Golos Text',sans-serif;letter-spacing:0;text-transform:none;color:var(--navy)}
.fold-sum{flex:1;font:400 12.5px 'Golos Text',sans-serif;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fold-arrow{flex:0 0 auto;color:var(--accent);font-size:15px;line-height:1}
.fold-body{padding:0 16px 15px}
/* Кнопка сворачивания была только сверху: дочитав длинный текст, человек
   оказывался внизу и вернуть блок в свёрнутый вид было нечем. */
.fold-close{display:block;margin:10px 0 0 auto;padding:7px 2px;border:0;
  background:transparent;cursor:pointer;font:500 12px 'Golos Text',sans-serif;color:var(--accent)}
.steps{margin:14px 0 0;padding-left:20px;font:400 13px/1.5 'Golos Text',sans-serif;color:var(--ink)}
.steps li{margin-bottom:5px}
#f-feed{font:400 11px 'IBM Plex Mono',monospace;color:var(--mut)}
.themes{display:flex;flex-wrap:wrap;gap:6px;margin:-3px 0 11px}
.theme{border:1px solid var(--line);background:rgba(255,255,255,.7);color:var(--mut);
  border-radius:999px;padding:6px 11px;font:500 12px 'Golos Text',sans-serif;cursor:pointer}

    exp:[], inc:[], ev:[], notes:[], day:{}, del:[], savedAt:null, backupAt:null, firstDataAt:null

/* Записи приходят из трёх мест: из памяти телефона, из файла резервной копии
   и из облака. Раньше достройка недостающих полей была только у первого,
   поэтому запись старого образца из облака или из копии роняла экран.
   Теперь любые данные проходят здесь. */
const DEL_KEEP_DAYS = 180;
function normalize(raw){
  const b = blank();
  const d = (raw && typeof raw === 'object' && !Array.isArray(raw)) ? raw : {};
  for (const k in b){
    if (Array.isArray(b[k])) d[k] = Array.isArray(d[k]) ? d[k] : [];
    else if (b[k] && typeof b[k] === 'object') d[k] = (d[k] && typeof d[k] === 'object' && !Array.isArray(d[k])) ? d[k] : {};
    else if (d[k] === undefined) d[k] = b[k];
  }
  for (const k in b.settings) if (d.settings[k] === undefined) d.settings[k] = b.settings[k];
  /* запись без своего номера нельзя сравнить с такой же на другом телефоне */
  ['exp','inc','ev','notes'].forEach(k => {
    d[k] = d[k].filter(r => r && typeof r === 'object');
    d[k].forEach(r => { if (!r.id) r.id = uid(); });
  });
  const edge = Date.now() - DEL_KEEP_DAYS * 86400000;
  d.del = d.del
    .filter(x => x && x.id && !(x.at && new Date(x.at).getTime() < edge))
    .slice(-4000);
  return d;
}
function load(){
  let raw = null;
  try{ raw = localStorage.getItem(KEY); }
  catch(e){ storageOk = false; }
  try{ S = normalize(raw ? JSON.parse(raw) : null); }
  catch(e){ S = blank(); storageOk = false; }
}
function saveQuiet(){ dropIndex(); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOk = false; } }
function save(){
  const hasData = S.exp.length || S.inc.length || S.ev.length || S.notes.length || Object.keys(S.day || {}).length;
  if (hasData && !S.firstDataAt) S.firstDataAt = new Date().toISOString();
  S.savedAt = new Date().toISOString();
  dropIndex();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOk = false; }
  renderAll(); scheduleCloudSync();
}

/* ---------- автоматическое облачное сохранение ---------- */
let cloudClient=null,cloudUser=null,cloudTimer=null,cloudState='local',cloudError='',cloudRetry=0;
function hasUserData(data){
  if(!data||typeof data!=='object')return false;
  const n=k=>Array.isArray(data[k])?data[k].length:0;
  return !!(n('exp')||n('inc')||n('ev')||n('notes')||Object.keys(data.day||{}).length);
}
function killed(id){
  if(!id)return;
  S.del=S.del||[];
  if(!S.del.some(x=>x.id===id))S.del.push({id:id,at:new Date().toISOString()});
}
function stamp(x){ return x&&x.savedAt?new Date(x.savedAt).getTime():0; }

/* Раньше побеждал целиком тот телефон, чьё сохранение свежее. Из-за этого
   новый телефон с одной записью затирал в облаке весь прошлый год.
   Теперь записи складываются по номерам, а удалённые остаются удалёнными. */
function mergeStates(local, remote){
  const localNewer = stamp(local) >= stamp(remote);
  const older = localNewer ? remote : local;
  const newer = localNewer ? local : remote;
  const out = normalize(JSON.parse(JSON.stringify(newer)));

  const dead = {};
  [].concat(older.del||[], newer.del||[]).forEach(x => { if(x&&x.id) dead[x.id]=x; });
  out.del = Object.keys(dead).map(id => dead[id]);

  ['exp','inc','ev','notes'].forEach(k => {
    const by = {}, old = {};
    (older[k]||[]).forEach(r => { if(r&&r.id){ by[r.id]=r; old[r.id]=r; } });
    (newer[k]||[]).forEach(r => { if(r&&r.id) by[r.id]=r; });
    out[k] = Object.keys(by).filter(id => !dead[id]).map(id => {
      const rec = by[id], was = old[id];
      /* список покупок правится с двух телефонов вперемешку. Если брать
         запись целиком, пункты, добавленные на другом телефоне, пропадут. */
      if (k === 'notes' && was && was !== rec && Array.isArray(rec.items) && Array.isArray(was.items)){
        const merged = rec.items.slice();
        const known = {};
        merged.forEach(i => { if(i&&i.t) known[i.t.toLowerCase()]=1; });
        was.items.forEach(i => { if(i&&i.t&&!known[i.t.toLowerCase()]) merged.push(i); });
        return Object.assign({}, rec, {items:merged});
      }
      return rec;
    });
  });

  out.day = Object.assign({}, older.day||{}, newer.day||{});

  /* обычно свежая настройка вытесняет прежнюю, но нетронутое значение
     по умолчанию (пустое имя, ноль дохода) вытеснять заполненное не должно */
  const bs = blank().settings;
  out.settings = Object.assign({}, older.settings||{}, newer.settings||{});
  Object.keys(bs).forEach(k => {
    const nv = (newer.settings||{})[k], ov = (older.settings||{})[k];
    if (nv === bs[k] && ov !== undefined && ov !== bs[k]) out.settings[k] = ov;
  });

  const first = [older.firstDataAt, newer.firstDataAt].filter(Boolean).sort();
  out.firstDataAt = first[0] || null;
  out.backupAt = [older.backupAt, newer.backupAt].filter(Boolean).sort().pop() || null;
  out.savedAt = new Date().toISOString();
  return normalize(out);
}
/* Строка отвечает на один вопрос: цела ли запись. Поэтому в каждом состоянии
   стоит законченная фраза, а не обрывок, и даже при сбое облака сказано,
   что на устройстве всё сохранено. */
function cloudLabel(){
  if(!storageOk)return 'НЕ СОХРАНЯЕТСЯ';
  if(cloudState==='syncing')return '⟳ сохраняю в облако';
  if(cloudState==='synced')return '✓ сохранено в облаке';
  if(cloudState==='offline')return '○ нет сети · сохранено на устройстве';
  if(cloudState==='error')return '! облако недоступно · сохранено на устройстве';
  return '✓ сохранено';
}
function setCloudState(state,error){cloudState=state;cloudError=error||'';const el=document.getElementById('saved');if(el)el.textContent=cloudLabel();}
function scheduleCloudSync(){
  if(!cloudUser)return;
  cloudRetry=0;
  clearTimeout(cloudTimer);
  if(!navigator.onLine){setCloudState('offline');return;}
  setCloudState('syncing');
  cloudTimer=setTimeout(pushCloud,900);
}
async function pushCloud(){
  if(!cloudClient||!cloudUser)return;
  if(!navigator.onLine){setCloudState('offline');return;}
  try{
    const payload=JSON.parse(JSON.stringify(S));
    const result=await cloudClient.from('user_app_data').upsert({user_id:cloudUser.id,payload:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});
    if(result.error)throw result.error;
    cloudRetry=0;
    setCloudState('synced');
  }catch(e){
    setCloudState('error',e&&e.message);
    /* раньше одна неудачная отправка оставляла записи неотправленными
       до следующей правки. Пробуем сами, с растущей паузой. */
    if(cloudRetry<5){
      const wait=Math.min(60000,4000*Math.pow(2,cloudRetry));
      cloudRetry++;
      clearTimeout(cloudTimer);
      cloudTimer=setTimeout(pushCloud,wait);
    }
  }
}
async function connectCloudUser(user){
  cloudUser=user;setCloudState('syncing');
  try{
    const result=await cloudClient.from('user_app_data').select('payload,updated_at').eq('user_id',user.id).maybeSingle();
    if(result.error)throw result.error;
    const remote=result.data&&result.data.payload?normalize(result.data.payload):null;
    /* записи на этом телефоне принадлежат другому аккаунту: складывать их
       с чужими нельзя, но и стирать молча тоже. Убираем в отдельный ящик. */
    const foreign=S.settings.cloudOwner&&S.settings.cloudOwner!==user.id;
    if(foreign&&hasUserData(S)){
      try{localStorage.setItem(KEY+':prev',JSON.stringify(S));}catch(e){}
      S=remote||blank();
      S.settings.cloudOwner=user.id;saveQuiet();renderAll();
      toast('Записи прежнего аккаунта отложены и в это облако не отправлены');
      setCloudState('synced');await pushCloud();renderAll();return;
    }
    if(remote&&hasUserData(remote))S=mergeStates(S,remote);
    S.settings.cloudOwner=user.id;
    saveQuiet();renderAll();
    await pushCloud();
    if(cloudState!=='error')setCloudState('synced');
  }catch(e){setCloudState(navigator.onLine?'error':'offline',e&&e.message);}
  renderAll();
}
async function initCloud(){
  if(!window.supabase||!window.supabase.createClient){setCloudState('local');return;}
  cloudClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  const sessionResult=await cloudClient.auth.getSession();
  if(sessionResult.data&&sessionResult.data.session)await connectCloudUser(sessionResult.data.session.user);
  cloudClient.auth.onAuthStateChange((event,session)=>{
    if(session&&(!cloudUser||cloudUser.id!==session.user.id))setTimeout(()=>connectCloudUser(session.user),0);
    if(!session){cloudUser=null;setCloudState('local');renderAll();}
  });
}
/* Сервер отвечает по-английски. Показывать это человеку нельзя:
   ошибка должна говорить, что произошло и что делать дальше. */
function cloudErrorText(e){
  const m = String((e && e.message) || '').toLowerCase();
  if (m.includes('only request this after'))
    return 'Слишком часто. Подождите минуту и попробуйте войти — возможно, аккаунт уже создан';
  if (m.includes('already registered') || m.includes('already been registered'))
    return 'Такой аккаунт уже есть. Нажмите «Войти»';
  if (m.includes('invalid login credentials'))
    return 'Неверная почта или пароль. Если пароль забыт — «Забыли пароль?»';
  if (m.includes('email not confirmed'))
    return 'Почта не подтверждена. Откройте письмо и вернитесь сюда';
  if (m.includes('signups not allowed') || m.includes('signup is disabled') || m.includes('email signups are disabled'))
    return 'Регистрация закрыта. Попросите администратора выслать приглашение на вашу почту';
  if (m.includes('rate limit') || m.includes('too many'))
    return 'Слишком много попыток подряд. Попробуйте через несколько минут';
  if (m.includes('password') && m.includes('least'))
    return 'Пароль слишком короткий — нужно не менее 8 символов';
  if (m.includes('invalid') && m.includes('email'))
    return 'Проверьте адрес почты';
  if (m.includes('failed to fetch') || m.includes('network'))
    return 'Нет связи с облаком. Проверьте интернет';
  return 'Не получилось. Попробуйте ещё раз через минуту';
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function iso(d){ const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10); }

  const r = {};
  expUpTo(m, day).forEach(e => { r[e.cat] = (r[e.cat] || 0) + (+e.sum || 0); });
  return Object.entries(r).sort((a,b) => b[1] - a[1]);
}

function occursOn(e, d){
  if (e.date === d) return true;

  if (e.repeat === 'year')  return e.date.slice(5) === d.slice(5);
  if (e.repeat === 'month') return e.date.slice(8) === d.slice(8);
  if (e.repeat === 'week')  return (new Date(d + 'T12:00') - new Date(e.date + 'T12:00')) % (7*86400000) === 0;

function repeatLabel(e){

/* Прежде каждая клетка календаря перебирала все события и все заметки.
   На 120 месяцах это 3600 полных проходов по данным за одну отрисовку.
   Теперь разовые записи разложены по датам один раз, а перебираются
   только повторяющиеся — их всегда единицы. */
let dateIndex = null;

function buildIndex(){
  const ev = {}, notes = {}, repeating = [];
  (S.ev || []).forEach(e => {
    if (!e.repeat || e.repeat === 'none') (ev[e.date] = ev[e.date] || []).push(e);
    else repeating.push(e);

  (S.notes || []).forEach(n => { if (n.due) (notes[n.due] = notes[n.due] || []).push(n); });

let DATE_WORDS_RE = null;
function parseSum(raw){

    .replace(/\sв\s+\d{1,2}([:.]\d{2})?(\s+часов|\s+утра|\s+вечера|\s+дня)?/gi,' ')
    .replace(/\sв\s+(час|два|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать)(\s+часов|\s+утра|\s+вечера|\s+дня)?/gi,' ');

  text.toLowerCase().split(/[\s,]+/).forEach(w => {

      if (!w.startsWith(k)) continue;

      else part += v;

}
const HOURWORD = {'час':13,'один':1,'два':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,
 'девять':9,'десять':10,'одиннадцать':11,'двенадцать':12,'тринадцать':13,'четырнадцать':14,'пятнадцать':15,
 'шестнадцать':16,'семнадцать':17,'восемнадцать':18,'девятнадцать':19,'двадцать':20,'двадцать один':21,
 'двадцать два':22,'двадцать три':23};
const MINWORD = {'ноль ноль':0,'ровно':0,'пятнадцать':15,'тридцать':30,'полтора':30,'сорок пять':45,'десять':10,'двадцать':20,'сорок':40,'пятьдесят':50};
function parseTime(text){
  const low = ' ' + String(text).toLowerCase() + ' ';
  const t = low.match(/(\d{1,2})[:.](\d{2})/);
  if (t && +t[1] <= 23 && +t[2] <= 59) return String(+t[1]).padStart(2,'0') + ':' + t[2];
  if (/полдень/.test(low)) return '12:00';
  if (/полноч/.test(low)) return '00:00';
  const d = low.match(/\sв\s+(\d{1,2})\s*(?:час\w*|ч)?(?:\s+(утра|дня|вечера|ночи))?/);
  if (d && +d[1] <= 23){
    let h = +d[1];
    if (d[2] === 'вечера' && h < 12) h += 12;
    if (d[2] === 'дня' && h < 12 && h > 4) h += 12;
    return String(h).padStart(2,'0') + ':00';
  }
  // числительными: «в пятнадцать ноль ноль», «в десять тридцать», «в шесть вечера»
  const keys = Object.keys(HOURWORD).sort((a,b) => b.length - a.length);
  for (const k of keys){
    const re = new RegExp('\\s(?:в|на|к)\\s+' + k + '(?:\\s+(ноль ноль|тридцать|пятнадцать|сорок пять|десять|двадцать|сорок|пятьдесят|ровно))?(?:\\s+(утра|дня|вечера|ночи))?', 'i');
    const m = low.match(re);

      const part = m[2];

      else if (part === 'ночи' && h < 6) h = h;
      else if (part === 'дня' && h < 12 && h > 4) h += 12;
      else if (!part && h >= 1 && h <= 8 && k !== 'час') h += 12;  // «в шесть» вечером привычнее
      return String(Math.min(23,h)).padStart(2,'0') + ':' + String(mins).padStart(2,'0');
    }
  }
  return null;
}

function parseDate(text){
  const low = ' ' + String(text).toLowerCase() + ' ';

  if (rel && (rel[1] || rel[2])){
    const w = {'две':2,'три':3,'четыре':4,'пять':5}[rel[1]] || +rel[1] || 1;
    const unit = rel[2] || rel[1] || '';
    let days = 0;
    if (/недел/.test(unit)) days = w * 7;
    else if (/месяц/.test(unit)) days = w * 30;
    else if (/дн/.test(unit)) days = w;
    else if (rel[1] === 'неделю') days = 7;
    else if (rel[1] === 'месяц') days = 30;
    if (days) return iso(new Date(Date.now() + days*86400000));
  }
  if (/позавчера/.test(low)) return iso(new Date(Date.now() - 2*86400000));
  if (/вчера/.test(low)) return iso(new Date(Date.now() - 86400000));
  if (/послезавтра/.test(low)) return iso(new Date(Date.now() + 2*86400000));
  if (/завтра/.test(low)) return iso(new Date(Date.now() + 86400000));
  // «24 сентября» или «двадцать четвёртого сентября»
  for (let mi = 0; mi < 12; mi++){
    if (!low.includes(MONTH_GEN[mi])) continue;
    let day = null;
    const dig = low.match(new RegExp('([0-9]{1,2}) +' + MONTH_GEN[mi]));
    if (dig) day = +dig[1];

      const comp = low.match(new RegExp('(двадцать|тридцать) +(перв|втор|треть|четв[её]рт|пят|шест|седьм|восьм|девят)[а-яё]* +' + MONTH_GEN[mi]));
      if (comp){
        const base = comp[1] === 'двадцать' ? 20 : 30;
        const units = {'перв':1,'втор':2,'треть':3,'четв':4,'пят':5,'шест':6,'седьм':7,'восьм':8,'девят':9};
        for (const u in units) if (comp[2].startsWith(u)){ day = base + units[u]; break; }
      }
      if (!day){
        const keys = Object.keys(ORD).sort((a,b) => b.length - a.length);
        for (const k of keys)
          if (new RegExp('(?<!двадцать )(?<!тридцать )' + k + ' +' + MONTH_GEN[mi]).test(low)){ day = ORD[k]; break; }

      let y = now.getFullYear();

}

      const rec = {cat:c, title:clean(part) || c, sum:money, src:'голосом'};
      out.exp.push(rec);
      receipt = {sum:money, items:[]};
      out.receipts = out.receipts || [];
      out.receipts.push(receipt);
      return;
    }
    const isIncome = /получил|зарплат|аванс|перевели|пришл[аои] деньги|заработал|кэшбэк|premi|прем/i.test(low);
    const hasDate = parseDate(part) !== today() || /сегодня/i.test(low);
    const actionVerb = /отправ|написа|позвон|заеха|зайти|зайду|забра|сходи|отвез|оплат|сдать|встрет|привез|отдат|занест|получит|подать|подпис|улета|улечу|улетаю|прилета/i.test(low);
    const isEvent = /встреч|созвон|запис|маникюр|педикюр|парикмахер|стоматолог|косметолог|массаж|брови|ресниц|врач|зал|тренир|танц|уч[её]б|школ|садик|поезд|вылет|прилет|прилёт|приезж|приезд|рейс|самол[её]т|билет|отпуск|день рожд|годовщин|позвонить|отправлен/i.test(low)
                    && (parseTime(part) || hasDate);
    const isTask = actionVerb && (parseTime(part) || hasDate || pending);
    if (isEvent || isTask){
      const realMoney = money && (/руб|₽|тысяч|манат|тенге|стоит|цена/i.test(low) || money >= 100);
      let d = parseDate(part);
      let tm = parseTime(part);
      if (pending){
        if (d === today() && !/сегодня/i.test(low)) d = pending.date;
        if (!tm) tm = pending.time;
        pending = null;
      }
      if (d === today() && !/сегодня/i.test(low) && lastDate) d = lastDate;
      if (d !== today()) lastDate = d;
      out.ev.push({date:d, time:tm, title:clean(part) || 'Событие',
                   plan: realMoney ? money : null});
      return;
    }
    if (!money && isShoppingList(part)){
      out.notes.push(tidy(part.replace(/\bкупила\b/i,'купить').replace(/\bкупил\b/i,'купить')));
      return;
    }
    if (money && isIncome){ out.inc.push({title:clean(part) || 'Доход', sum:money, src:'голосом'}); return; }
    if (money){
      const items = splitItems(part);
      if (items && /чек|магазин|куплен|купила|потратила|в том числе/i.test(low)){
        // первая сумма — общая по чеку, остальные позиции уходят в заметку как состав
        const nums = items.map(x => +(x.match(/\d+/) || [0])[0]);
        const total = Math.max(...nums);
        const rest = items.filter(x => +(x.match(/\d+/) || [0])[0] !== total);
        const c = pickCat(part);
        out.exp.push({cat:c, title:clean(items[0]) || c, sum:total, src:'голосом'});
        if (rest.length) out.notes.push(tidy('В чеке на ' + total + ': ' + rest.join(', ')));
        return;
      }
      const c = pickCat(part);
      out.exp.push({cat:c, title:clean(part) || c, sum:money, src:'голосом'});
      return;
    }
    if (!/^(запиши|запишите|пожалуйста|напиши|напомни|отметь|мне|меня|чтобы я?|ну|вот|и|а|это самое|короче)[.,]?$/i.test(part.trim()))
      out.rest.push(part);
  });
  (out.receipts || []).forEach(r => {
    if (r.items.length) out.notes.push(tidy('В чеке на ' + r.sum + ': ' + r.items.join(', ')));
  });
  delete out.receipts;
  return out;
}

/* ---------- оформление надиктованного текста ----------
   Диктовка на телефоне не ставит знаков препинания. Здесь текст доводится
   до читаемого вида: заглавная буква, запятые в перечислениях и перед
   «потом», «затем», «а», «но», точка в конце длинной фразы. */
const NUMWORDS = 'ноль|один|одна|одну|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать|полтора|полторы';
const PREPS = 'в|во|на|за|с|со|из|от|до|к|по|при|про|для|у|о|об|над|под|около|через';
/* Причёсывание рассчитано на надиктованную фразу: оно расставляет запятые
   и сводит текст в одну строку. Вставленный текст с разметкой оно портит —
   «Занимает две минуты» превращалось в «Занимает, две минуты», а строки
   склеивались в простыню. Поэтому вставленное сохраняем как есть. */
function looksPasted(t){
  const v = String(t || '');
  return v.indexOf('\n') >= 0 || /^#{1,6}\s|^[-*]\s|^\d+\.\s|\*\*|https?:\/\//m.test(v);
}
function keepOrTidy(t){
  const v = String(t || '').trim();
  return looksPasted(v) ? v : tidy(v);
}
function tidy(t){
  if (!t) return '';
  let s = String(t).replace(/\s+/g,' ').trim();
  // запятая перед словами-связками
  s = s.replace(new RegExp('\\s(потом|затем|после этого|а также|плюс|а|но|однако|зато)\\s','gi'), ', $1 ');
  // запятая перед «и ещё», «ещё»
  s = s.replace(/\s(и ещё|и еще|ещё|еще)\s/gi, ', $1 ');
  // запятая перед числом, если это новый пункт перечисления
  s = s.replace(new RegExp('(?<!^)(?<!,)\\s(?<!(?:' + PREPS + ')\\s)((?:' + NUMWORDS + '|\\d+)\\s+[а-яё]{3,})','gi'), ', $1');
  // чистим сдвоенные знаки и пробелы перед ними
  s = s.replace(/\s*,\s*,+/g, ', ').replace(/\s+,/g, ',').replace(/,\s*$/,'').replace(/\s{2,}/g,' ').trim();
  if (!s) return '';
  s = s.charAt(0).toUpperCase() + s.slice(1);
  // точка в конце — только у длинных фраз, чтобы короткие названия не выглядели странно
  const words = s.split(' ').length;
  if ((words >= 5 || s.includes(',')) && !/[.!?…]$/.test(s)) s += '.';
  return s;
}

function clean(t){
  let s = ' ' + String(t).trim() + ' ';
  const cut = (re) => { s = s.replace(re, ' '); };
  cut(/ (ко мне|у меня|мне|меня|нам|нас|мы|я|мо[йяею]|мои|наш[аи]?) /gi);
  cut(new RegExp(' (перв|втор|треть|четв[ёе]рт|пят|шест|седьм|восьм|девят|десят|одиннадцат|двенадцат|двадцат|тридцат)[а-яё]*о?го ', 'gi'));
  cut(/ (двадцать|тридцать) /gi);
  cut(new RegExp(' (' + MONTH_GEN.join('|') + ') ', 'gi'));
  s = s.replace(/[0-9]{1,2}[:.][0-9]{2}/g,' ');
  cut(/ (ноль ноль|ровно) /gi);
  cut(/ (в|во|на|к) +[0-9]{1,2} /gi);
  cut(new RegExp(' (в|во|на|к) +(' + Object.keys(HOURWORD).join('|') + ')( +(утра|дня|вечера|ночи|часов|часа))? ', 'gi'));
  cut(/ (утра|дня|вечера|ночи|часов|часа) /gi);
  cut(/ (во сколько|за день|нужно напоминание|напоминание)[^,.]* /gi);
  cut(/ (потратила|потратил|заплатила|заплатил|купила|купил|съела|съел|поела|поел|позавтракала|пообедала|поужинала|записалась|записался|получила|получил|пришло|перевели|надо|нужно) /gi);
  cut(/ (в|во|на|за|до|к|с) +(понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье|завтра|послезавтра) /gi);
  cut(/ (завтра|послезавтра|вчера|позавчера|сегодня|утром|днём|днем|вечером) /gi);
  cut(/ через +([0-9]+|две|три|четыре|пять)? *(дн[еяй][а-яё]*|недел[а-яё]*|месяц[а-яё]*)? /gi);
  cut(/^ *(и|а|ну|вот) /gi);
  cut(/ [0-9][0-9 ]*(руб[а-яё]*|₽|тысяч[а-яё]*)? /gi);
  cut(/ на [0-9]+ /gi);
  // числительные идут подряд («сорок пять тысяч»), поэтому пробел справа
  // не съедаем — иначе следующее слово остаётся без пробела и уцелеет
  cut(new RegExp(' (' + Object.keys(WORDNUM).join('|') + ')(?= )', 'gi'));
  cut(/ (тысяч[а-яё]*|миллион[а-яё]*|руб[а-яё]*|₽|манат[а-яё]*|тенге)(?= )/gi);
  s = s.replace(/ {2,}/g,' ').trim();
  s = s.replace(/^(в|во|на|за|про|до|к|и|а|с|у)\s+/i,'').trim();
  for (let n = 0; n < 3; n++)
    s = s.replace(/[\s,]+(в|во|на|за|про|до|к|и|а|с|у|вечером|утром|днём|днем|ночью|за день|во сколько)[.,]?$/i,'').trim();
  s = s.replace(/[\s,]+(что|чтобы|когда|где|как|о том)$/i,'').trim();
  s = s.replace(/[\s,.;]+$/,'').replace(/^[\s,.;]+/,'').trim();
  // «получила зарплату» → название «Зарплата», а не «Зарплату»
  const NOM = {'зарплату':'зарплата','премию':'премия','пенсию':'пенсия','стипендию':'стипендия',
    'подработку':'подработка','предоплату':'предоплата','доплату':'доплата','надбавку':'надбавка',
    'квартплату':'квартплата','страховку':'страховка','аренду':'аренда'};
  s = s.replace(/^[а-яё]+/i, w => NOM[w.toLowerCase()] || w);
  if (s.length < 2) return '';
  return tidy(s.charAt(0).toUpperCase() + s.slice(1));
}







/* ================= Экраны ================= */

/* Одна понятная кнопка добавления открывает короткий выбор типа записи. */
const DOCK = {
  's-today': ['Добавить', '＋', 'Добавить дело, событие, заметку или список'],
  's-cal':   ['Добавить', '＋', 'Добавить дело или событие'],
  's-notes': ['Добавить', '＋', 'Добавить заметку или список'],
  's-money': ['Расход', '＋', 'Добавить расход'],
  's-more':  ['', '', '']
};
let curScreen = 's-today';
function openContext(){
  if (curScreen === 's-money') return openSheet('exp');
  if (curScreen === 's-today' && screenOff('s-money') && screenOff('s-notes') && screenOff('s-cal')) return openSheet('ev');
  if (curScreen === 's-cal') return openSheet('ev', selDay || today());
  if (curScreen === 's-notes') return focusNote();
  openSheet('quick');
}
/* кнопка внизу меняется по разделу — значок и слово должны это показывать */
function setDock(id){
  const d = DOCK[id] || DOCK['s-today'];
  const ic = document.getElementById('dock-ic'), tx = document.getElementById('dock-tx');
  const b = document.getElementById('dock-btn');
  if (ic) ic.textContent = d[1];
  if (tx) tx.textContent = d[0];
  if (b){ b.hidden = id === 's-more'; b.setAttribute('aria-label', d[0] + '. ' + d[2]); }
}
function focusNote(kind){
  if (kind && (S.settings.notesTab || 'task') !== kind){ S.settings.notesTab = kind; saveQuiet(); renderNotes(); }
  const el = document.getElementById('n-text');
  if (el){ el.focus(); try{ el.scrollIntoView({block:'center'}); }catch(e){} }
  else openSheet('voice');
}
function go(btn, id){
  curScreen = id;
  setDock(id);
  if (id === 's-cal' && calDirty){
    /* возвращаясь в календарь, начинаем с текущего года — прокрутка вглубь
       всё равно потеряна, а перестраивать сразу десять лет незачем */
    calendarMonthCount = Math.min(calendarMonthCount, 12);
    const c = document.getElementById('s-cal'); if (c) c.hidden = false;
    renderCal(true);
  }
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected','false'));
  btn.setAttribute('aria-selected','true');
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id);
  window.scrollTo(0,0);
}
function goScreen(id){
  const btn = Array.from(document.querySelectorAll('.tabs button')).find(b => (b.getAttribute('onclick') || '').includes("'" + id + "'"));
  if (btn) go(btn,id);
}
function bar(pct, color){
  return '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%;background:' + (color || 'var(--accent)') + '"></i></div>';
}
/* Общее правило экранов: при открытии видно только заголовок и короткий итог.
   Всё содержимое разворачивается нажатием. Иначе экран вываливает всё сразу
   и понять, что где, невозможно. */
let foldOpen = {};
function toggleFold(key){ foldOpen[key] = !foldOpen[key]; renderAll(); }
function fold(key, title, summary, body, openByDefault){
  const open = foldOpen[key] === undefined ? !!openByDefault : foldOpen[key];
  return '<div class="card fold' + (open ? ' open' : '') + '">' +
    '<button type="button" class="fold-head" onclick="toggleFold(\'' + key + '\')" aria-expanded="' + open + '">' +
      '<span class="fold-title">' + esc(title) + '</span>' +
      (summary ? '<span class="fold-sum">' + esc(summary) + '</span>' : '') +
      '<span class="fold-arrow" aria-hidden="true">' + (open ? '⌃' : '⌄') + '</span>' +
    '</button>' +
    (open ? '<div class="fold-body">' + body +
      /* внизу она нужна там, где до верха далеко: у короткой формы
         достаточно стрелки в заголовке */
      (body.length > 900 ? '<button type="button" class="fold-close" onclick="toggleFold(\'' + key + '\')">свернуть ↑</button>' : '') +
      '</div>' : '') +
  '</div>';
}
function card(inner, cls){ return '<div class="card' + (cls ? ' ' + cls : '') + '">' + inner + '</div>'; }
function lab(t){ return '<div class="lab">' + esc(t) + '</div>'; }

function renderAll(){
  dropIndex();
  applyTabs();
  const d = new Date();
  document.getElementById('today-date').textContent =
    WDAYS[d.getDay()].charAt(0).toUpperCase() + WDAYS[d.getDay()].slice(1) + ', ' + humanDate(today());
  document.getElementById('saved').textContent = cloudLabel();
  renderToday(); renderCal(); renderNotes(); renderMoney(); renderMore();
}

/* ---------- Сегодня ---------- */
function renderToday(){
  const d = today(), rec = dayRec(d);
  let h = greetingCard();

  if (!storageOk) h += '<div class="warnbar">Записи не сохраняются. Обычно это переполненная память браузера или режим инкогнито. Сохраните резервную копию, пока приложение открыто.</div>';
  if (!cloudUser) h += '<button type="button" class="tip" onclick="openSheet(\'cloudAuth\')">Защитите записи от потери: подключить облачное сохранение →</button>';

  if (!S.settings.hi){
    h += card('<div style="font-size:14px;margin-bottom:10px">Здесь собраны планы на сегодня. Отмечайте выполненное галочкой, а новые дела, события и заметки добавляйте одной кнопкой.</div>' +
      '<div class="row" style="gap:8px">' +
      '<button class="btn ghost" style="flex:1" onclick="hideHi()">Понятно</button>' +
      '<button class="btn" style="flex:1" onclick="openSheet(\'hi\')">Подробнее</button></div>');
  }
  /* Система наблюдений была построена целиком, но карточку никто не выводил.
     Показываем её сразу после приветствия, до планов на день. */
  h += veilCard();

  /* просроченное должно быть первым, а не в самом низу экрана */
  const dn = dueNotes();
  if (dn.length) h += card(lab('Напоминание') + dn.map(n =>
    '<div class="item" style="align-items:flex-start"><div class="ic">🔔</div>' +
    '<button type="button" class="txt" onclick="editNote(\'' + n.id + '\')">' +
    '<b style="font-weight:400;font-size:14px">' + esc(n.text) + '</b>' +
    '<small>' + dueLabel(n) + ' · нажмите, чтобы изменить</small></button>' +
    ((n.kind || 'task') === 'task' ? '<button class="tick" onclick="toggleNoteDone(\'' + n.id + '\')" title="Отметить выполненным"></button>' :
      '<button class="del" style="color:var(--accent)" onclick="clearDue(\'' + n.id + '\')">снять</button>') + '</div>').join(''));

  const nx = nextEvent();
  h += card(
    '<div class="row" style="align-items:flex-start"><div>' + lab('Дальше по плану') +
    (nx && !nx.far
      ? '<div style="font-family:\'Spectral\',serif;font-size:18px;font-weight:600">' + esc(nx.e.title) + '</div>' +
        '<div class="mut" style="margin-top:3px">' + (nx.e.time ? esc(nx.e.time) + ' · ' : '') + esc(nx.when) +
          (!nx.e.time ? ' · время не указано' : '') +
          (repeatLabel(nx.e) ? ' · ' + repeatLabel(nx.e) : '') + '</div>'
      : nx && nx.far
        ? '<div class="mut">На ближайшую неделю ничего не назначено.</div>' +
          '<div class="mut" style="margin-top:5px;font-size:11px">Следующее — ' +
          '<button type="button" class="txt" style="display:inline;font-size:11px;text-decoration:underline" ' +
          'onclick="editEv(\'' + nx.e.id + '\')">«' + esc(nx.e.title) + '», ' + esc(nx.when) + '</button>' +
          '. Напомню ближе к дате.</div>'
        : '<div class="mut">Дальше сегодняшнего дня пока ничего не назначено.</div>') +
    '</div>' +
    /* кнопка должна относиться к тому, что написано рядом. Пока ближайшая неделя
       пуста, «Перенести / удалить» повисало в воздухе: переносить было нечего. */
    (nx && !nx.far
      ? '<button class="chip" onclick="editEv(\'' + nx.e.id + '\')">' + (nx.e.time ? 'Перенести / удалить' : 'Указать время') + '</button>'
      : '<button class="chip" onclick="go(document.querySelector(\'.tabs button:nth-child(2)\'),\'s-cal\')">План →</button>') +
    '</div>', (nx && !nx.far) ? 'now' : '');

  const ev = evOf(d);
  const visibleEv = S.settings.showDone ? ev : ev.filter(e => !(rec.done || []).includes(e.id));
  const todayTasks = ev.filter(e => (e.kind || 'plain') === 'plain');
  const todayDone = todayTasks.filter(e => (rec.done || []).includes(e.id)).length;
  h += card(lab('Сегодня') + (todayTasks.length ? '<div class="mut" style="margin-bottom:10px">Выполнено ' + todayDone + ' из ' + todayTasks.length + '</div>' : '') +
    (visibleEv.length ? visibleEv.map(e => {
        const done = (rec.done || []).includes(e.id);
        /* время события уже прошло, а отметки нет — это надо видеть, а не искать */
        const late = !done && e.time && e.time < nowHHMM();
        return '<div class="tl' + (done ? ' done' : (late ? ' late' : ' next')) + '"><div class="tl-dot"></div>' +
          '<div class="tl-time">' + esc(e.time || '—') + (late ? ' <span class="late-mark">уже прошло</span>' : '') + '</div>' +
          '<div class="row"><span class="tl-what" onclick="editEv(\'' + e.id + '\')" style="cursor:pointer' + (done ? ';text-decoration:line-through;color:var(--mut)' : '') + '">' +
          esc(e.title) + '</span>' +
          ((e.kind || 'plain') === 'plain' ? '<button class="tick' + (done ? ' on' : '') + '" onclick="toggleDone(\'' + e.id + '\')" title="Сделано">' +
          (done ? '✓' : '') + '</button>' : '<span class="ic" aria-label="Напоминание">🔔</span>') + '</div></div>';
      }).join('')
      : '<div class="empty">На сегодня ничего не запланировано.</div>'));

  const lists = activeLists();
  lists.forEach(n => {
    const left = n.items.filter(i => !i.done).length;
    h += fold('today-list-' + n.id, (n.title || 'Список') + (n.where ? ' · ' + n.where : ''),
      'осталось ' + left + ' ' + plural(left,'пункт','пункта','пунктов'),
      listBody(n) +
      '<button class="btn ghost" style="margin-top:10px" onclick="editNote(\'' + n.id + '\')">Изменить список</button>');
  });

  if (backupDue())
    h += '<button type="button" class="tip" onclick="openSheet(\'backup\')">Прошла неделя без резервной копии. Сохранить сейчас →</button>';

  const td = todo();
  if (td.length) h += card(lab('Нужно отметить') + td.map(t =>
    '<div class="item"><div class="ic">' + t[0] + '</div>' +
    (t[3] ? '<button type="button" class="txt" onclick="' + t[3] + '">' : '<div class="txt">') +
    '<b>' + esc(t[1]) + '</b><small>' + esc(t[2]) + '</small>' +
    (t[3] ? '</button>' : '</div>') + '</div>').join(''));

  document.getElementById('s-today').innerHTML = h;
}

function greetingCard(){
  const now = new Date(), hour = now.getHours();
  const hello = hour < 5 ? 'Доброй ночи' : hour < 12 ? 'Доброе утро' : hour < 18 ? 'Добрый день' : 'Добрый вечер';
  const period = hour < 5 ? 'night' : hour < 12 ? 'morning' : hour < 18 ? 'day' : 'evening';
  const time = now.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  const phrase = hour < 5 ? 'Пусть всё важное подождёт до утра' :
    hour < 12 ? 'Пусть день начнётся легко и красиво' :
    hour < 18 ? 'Самое время свериться с планами' : 'Можно замедлиться и подвести итоги';
  const name = esc(S.settings.name || '');
  const greeting = name ? hello + ', ' + name + '!' : hello + '!';
  return '<div class="greeting ' + period + '" aria-label="' + greeting + ' Сейчас ' + time + '">' +
    '<div class="hello">' + greeting + '</div>' +
    '<div class="moment"><i aria-hidden="true"></i><span>' + time + ' · ' + phrase + '</span></div></div>';
}
function toggleDone(id){
  const r = dayRec(today());
  r.done = r.done || []; r.doneAt = r.doneAt || {};
  const i = r.done.indexOf(id);
  if (i >= 0){ r.done.splice(i,1); delete r.doneAt[id]; }
  else { r.done.push(id); r.doneAt[id] = today(); }
  save();
}
function hideHi(){ S.settings.hi = 1; save(); }

/* ---------- План: непрерывный календарь ---------- */
let selDay = today(), calendarMonthCount = 12;
function nowHHMM(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function planDone(date,id){ return !!(S.day[date]&&S.day[date].done&&(S.day[date].done||[]).includes(id)); }
function togglePlanDone(date,id){ const r=dayRec(date);r.done=r.done||[];r.doneAt=r.doneAt||{};const i=r.done.indexOf(id);if(i>=0){r.done.splice(i,1);delete r.doneAt[id];}else{r.done.push(id);r.doneAt[id]=today();}save(); }
function addMonths(key, amount){ const p=key.split('-').map(Number);return iso(new Date(p[0],p[1]-1+amount,1)).slice(0,7); }
function calendarEntries(date){
  /* в клетке календаря у списка достаточно названия: перечень пунктов
     превращал ячейку в кашу */
  return evOf(date).map(e=>({title:e.title,e:e}))
    .concat(notesOn(date).map(n=>({title:n.items ? (n.title || 'Список') : noteTitle(n), note:n})));
}
/* Календарь показывал только «здесь что-то есть». Теперь показывает,
   что с этим стало: закрыто, впереди или прошло и осталось не отмеченным. */
function dayState(date, known){
  /* записи для клетки уже собраны выше — собирать их второй раз незачем */
  const items = known || calendarEntries(date);
  if (!items.length) return '';
  const open = items.filter(x => x.e ? !planDone(date, x.e.id) : !x.note.done);
  if (!open.length) return 'day-done';
  return date < today() ? 'day-missed' : 'day-ahead';
}
function dayStateWord(state, count){
  if (state === 'day-done') return ', всё отмечено';
  if (state === 'day-missed') return ', прошло и не отмечено';
  return count ? ', запланировано' : '';
}
/* «Гинеколог» не влезал в строку, и браузер рвал его дефисом: «Гинеко-лог».
   Слова не рвём — вместо этого подбираем размер под самое длинное слово. */
function previewSize(title){
  const longest = String(title || '').split(/\s+/).reduce((a,b) => a.length >= b.length ? a : b, '');
  if (longest.length <= 8) return '';
  if (longest.length <= 11) return 'p-s';
  return 'p-xs';
}
function monthCalendar(key){
  const p=key.split('-').map(Number),y=p[0],mm=p[1];
  const heads='<div class="dw">пн</div><div class="dw">вт</div><div class="dw">ср</div><div class="dw">чт</div><div class="dw">пт</div><div class="dw">сб</div><div class="dw">вс</div>';
  let cells='',shift=(new Date(y,mm-1,1).getDay()+6)%7;
  for(let i=0;i<shift;i++)cells+='<div class="d out"></div>';
  for(let i=1;i<=daysInMonth(key);i++){
    const ds=key+'-'+String(i).padStart(2,'0'),entries=calendarEntries(ds),count=entries.length;
    const preview=entries.slice(0,2).map(x=>'<span class="day-preview '+previewSize(x.title)+'">• '+esc(x.title)+'</span>').join('')+(count>2?'<span class="day-preview">ещё '+(count-2)+'</span>':'');
    const st=dayState(ds,entries);
    cells+='<button type="button" class="d'+(ds===today()?' today':'')+(count?' has-plan':'')+(st?' '+st:'')+'" onclick="openDay(\''+ds+'\')" aria-label="'+(count?humanDate(ds)+', записей: '+count+dayStateWord(st,count):humanDate(ds))+'"><span class="day-num">'+i+'</span>'+preview+'</button>';
  }
  return '<div class="month-card"><div class="month-title">'+MONTHS_N[mm-1]+' '+y+'</div><div class="cal continuous-cal">'+heads+cells+'</div></div>';
}
/* Календарь перестраивался при каждом сохранении, даже когда открыт другой
   экран. На 120 месяцах это 4000 клеток впустую после каждой записи.
   Теперь пока календарь не виден, он только помечается устаревшим. */
let calDirty = true;
function renderCal(force){
  const host=document.getElementById('s-cal');
  if (!host) return;
  if (!force && host.hidden){ calDirty = true; return; }
  calDirty = false;
  const scroll=host.scrollTop,start=monthOf(today());
  let h='<div class="calendar-stream" id="cal-stream">' + monthsHtml(0, calendarMonthCount) + '</div>';
  host.innerHTML=h;host.scrollTop=scroll;
}
function monthsHtml(from, count){
  const start = monthOf(today());
  let h = '';
  for (let i = from; i < from + count; i++) h += monthCalendar(addMonths(start, i));
  return h;
}
function calendarScroll(el){
  if (el.scrollHeight - el.scrollTop - el.clientHeight >= 450 || calendarMonthCount >= 120) return;
  /* дописываем следующий год снизу, а не перерисовываем весь календарь */
  const stream = document.getElementById('cal-stream');
  if (stream){
    stream.insertAdjacentHTML('beforeend', monthsHtml(calendarMonthCount, 12));
    calendarMonthCount += 12;
  } else { calendarMonthCount += 12; renderCal(); }
}

  if (financePeriod === 'month') return [monthOf(end) + '-01',end];
  if (financePeriod === 'custom') return [financeFrom || end,financeTo || end];
  return [iso(new Date(Date.now()-6*86400000)),end];
}

/* ---------- отправка события в календарь телефона ----------
   Приложение в браузере не может присылать уведомления сам — для этого нужен
   сервер. Поэтому событие уходит файлом в родной календарь телефона,
   и напоминает уже он: за сутки и за два часа. */
/* ---------- Записи: заметки и списки ---------- */
/* Дела, заметки и списки лежали одной кучей: рецепт вперемешку с делами.
   Разное назначение — разные вкладки, чтобы не приходилось выискивать. */
/* Тема — не папка: её не надо заводить заранее и можно не заполнять вовсе.
   Не заполнили — работают поиск и вкладки, ничего не сломалось. */
function themeList(){
  const stats = {};
  (S.notes || []).forEach((n, i) => {
    const t = String(n.theme || '').trim(), key = t.toLowerCase();
    if (!key) return;
    if (!stats[key]) stats[key] = {t:t, count:0, last:i};
    stats[key].count++; stats[key].last = i;
  });
  return Object.keys(stats).map(k => stats[k])
    .sort((a,b) => b.count - a.count || b.last - a.last).map(x => x.t);
}
let themeFilter = '';
function setTheme(v){ themeFilter = (themeFilter === v ? '' : v); renderNotes(); }
function noteBucket(n){
  if (n.items) return 'list';
  return (n.kind || 'task') === 'task' ? 'task' : 'note';
}
const NOTE_TABS = [['task','Дела'],['note','Заметки'],['list','Списки']];
function setNotesTab(v){ S.settings.notesTab = v; saveQuiet(); renderNotes(); }
function renderNotes(){
  const list = S.notes;
  const q = (noteQuery || '').toLowerCase();
  const found = q ? list.filter(x => [x.text,x.title].concat((x.items || []).map(i=>i.t)).join(' ').toLowerCase().includes(q)) : list;
  /* при поиске вкладки не мешают: ищем сразу по всем */
  const tab = S.settings.notesTab || 'task';
  let inTab = q ? found : found.filter(x => noteBucket(x) === tab);
  const sorted = inTab.slice().sort((a,b) =>
    (+!!b.pinned) - (+!!a.pinned) || (+!!a.done) - (+!!b.done) ||
    (b.date + b.id).localeCompare(a.date + a.id));
  const counts = {task:0, note:0, list:0};
  list.forEach(x => { if (!x.done) counts[noteBucket(x)]++; });

  /* Поиск стоял под формой новой записи: чтобы им воспользоваться, надо было
     пролистать вверх мимо всей формы. Теперь он первый на экране. */
  let h = '<input class="note-search" id="n-q" value="' + esc(noteQuery || '') +
    '" placeholder="Поиск" aria-label="Поиск в записях, событиях и тратах" oninput="noteFind(this.value)">';

  /* Раньше вид записи выбирался дважды: переключателем в форме и вкладкой ниже,
     и они друг о друге не знали. Теперь выбор один — вкладка, а форма ей следует. */
  if (!q) h += (tab === 'list'
    ? fold('new-list', 'Новый список', '',
        '<button class="btn" onclick="openSheet(\'list\')">Создать список</button>')
    : fold('new-' + tab, tab === 'note' ? 'Новая заметка' : 'Новое дело', '',
        '<div class="quick-note"><textarea id="n-text" rows="2" placeholder="' +
          (tab === 'note' ? 'Например: рецепт, адрес, мысль' : 'Например: позвонить маме') + '"></textarea>' +
          micBtn('n-text','raw') + '</div>' +
        '<div class="quick-note-actions"><button class="btn" onclick="saveNote()">Сохранить</button></div>' +
        ''));


  /* при пустом поиске карточка с заголовком не нужна — сообщение будет одно, ниже */
  if (!q || sorted.length) h += card(
    (q ? lab('Найдено во всех записях')
       : '<div class="switch" role="tablist" aria-label="Что показать" style="margin-bottom:11px">' +
         NOTE_TABS.map(t => '<button type="button" role="tab" aria-selected="' + (t[0] === tab) +
           '" onclick="setNotesTab(\'' + t[0] + '\')">' + t[1] +
           (counts[t[0]] ? ' <em style="font-style:normal;opacity:.6">' + counts[t[0]] + '</em>' : '') +
           '</button>').join('') + '</div>') +
    (sorted.length ? sorted.map(x =>
      (x.items && x.items.length
        ? listCard(x)
        : noteBucket(x) === 'note' ? noteCard(x) : taskCard(x))).join('')
      : '<div class="empty">' + (q ? 'Ничего не нашлось.'
          : tab === 'task' ? 'Дел пока нет. Запишите то, что нужно сделать — у дела будет галочка.'
          : tab === 'note' ? 'Заметок пока нет. Сюда складывают то, что нужно сохранить: рецепт, адрес, мысль.'
          : 'Списков пока нет. Список — это несколько пунктов, каждый со своей галочкой.') + '</div>') +
    '');
  if (q) h += searchElsewhere(q, sorted.length);

  document.getElementById('s-notes').innerHTML = h;
}
/* поиск за пределами заметок: события, расходы, доходы */
function searchElsewhere(q, foundInNotes){
  const hit = t => String(t || '').toLowerCase().includes(q);
  const ev = (S.ev || []).filter(e => hit(e.title) || hit(e.address)).slice(0,12);
  const exp = (S.exp || []).filter(e => hit(e.title) || hit(e.cat)).slice(0,12);
  const inc = (S.inc || []).filter(e => hit(e.title)).slice(0,12);
  let out = '';
  if (ev.length) out += card(lab('События') + ev.map(e =>
    '<div class="item"><div class="ic">▦</div>' +
    '<button type="button" class="txt" onclick="editEv(\'' + e.id + '\')">' +
    '<b>' + esc(e.title) + '</b><small>' + humanDate(e.date) + (e.time ? ' · ' + esc(e.time) : '') +
    (e.address ? ' · ' + esc(e.address) : '') + '</small></button></div>').join(''));
  if (exp.length) out += card(lab('Расходы') + exp.map(e =>
    '<div class="item"><div class="ic">' + esc(sign()) + '</div>' +
    '<button type="button" class="txt" onclick="editExp(\'' + e.id + '\')">' +
    '<b>' + esc(e.title) + '</b><small>' + esc(e.cat || '') + ' · ' + humanDate(e.date) + '</small></button>' +
    '<div class="sum">−' + money(e.sum, curOf(e)) + '</div></div>').join(''));
  if (inc.length) out += card(lab('Доходы') + inc.map(e =>
    '<div class="item"><div class="ic">+</div>' +
    '<button type="button" class="txt" onclick="editInc(\'' + e.id + '\')">' +
    '<b>' + esc(e.title) + '</b><small>' + humanDate(e.date) + '</small></button>' +
    '<div class="sum" style="color:var(--ok)">+' + money(e.sum, curOf(e)) + '</div></div>').join(''));
  /* сообщение о пустом результате нужно один раз и только если пусто везде */
  if (!out && !foundInNotes) out = card('<div class="empty">Ничего не нашлось.</div>');
  return out;
}
let noteQuery = '';
function noteFind(v){ noteQuery = v; renderNotes(); const el = document.getElementById('n-q'); if (el){ el.focus(); el.setSelectionRange(v.length, v.length); } }
function saveNote(){
  const raw = val('n-text');

/* Диктовка не ставит переносов строк: весь список приезжает одной строкой,
   а поле ждёт по пункту на строку. Здесь строка раскладывается обратно
   на пункты и заодно приводятся в порядок дробные веса. */
const UNIT_WORDS = ['кг','килограмм','килограмма','килограммов','кило','г','гр','грамм','грамма','граммов',
  'л','литр','литра','литров','мл','шт','штук','штука','штуки','пачк','упаковк','банк','бутылк',
  'буханк','пучок','пучка','кочан','десяток','пакет','пакета'];
function isUnit(w){
  const t = w.toLowerCase().replace(/[.,]/g,'');
  return UNIT_WORDS.some(u => t === u || (u.length > 4 && t.startsWith(u)));
}
function normalizeAmounts(text){
  /* \b в JavaScript не считает русские буквы буквами, поэтому границы слова
     задаём явно — иначе ни одно из правил ниже не срабатывает. */
  const L = '[а-яёa-z0-9]';
  const w = (body) => new RegExp('(?<!' + L + ')(?:' + body + ')(?!' + L + ')', 'g');
  let t = ' ' + String(text).toLowerCase() + ' ';
  t = t.replace(w('полтора|полторы'), '1,5');
  /* «5 килограмм» — то же, что «5 кг» */
  t = t.replace(/(\d)\s+(килограмм\w*|кило)(?![а-яё])/g, '$1 кг')
       .replace(/(\d)\s+(литр\w*)(?![а-яё])/g, '$1 л')
       .replace(/(\d)\s+(грамм\w*)(?![а-яё])/g, '$1 г')
       .replace(/(\d)\s+(штук\w*)(?![а-яё])/g, '$1 шт');
  /* «лук килограмм» — это один килограмм, а не единица измерения без числа */
  t = t.replace(/(?<![\d,]\s)(?<![а-яё])(килограмм|кило|литр|пачка|пачку|банка|банку|бутылка|бутылку|штука|штуку)(?![а-яё])/g,
    (m,u) => '1 ' + ({'килограмм':'кг','кило':'кг','литр':'л','пачка':'пачка','пачку':'пачка',
      'банка':'банка','банку':'банка','бутылка':'бутылка','бутылку':'бутылка','штука':'шт','штуку':'шт'}[u] || u));
  t = t.replace(w('полкило[а-яё]*|пол-кило[а-яё]*'), '0,5 кг');
  t = t.replace(w('поллитра|пол-литра'), '0,5 л');
  /* «ноль целых пять», «ноль целых 5», «ноль целых,5» — всё это 0,5 */
  t = t.replace(/(?<![а-яёa-z0-9])ноль\s+целых\s*,?\s*(\d|[а-яё]+)/g, (m, d) => {
    const n = /\d/.test(d) ? d : (WORDNUM[d] !== undefined ? WORDNUM[d] : null);
    return n === null ? m : '0,' + n;
  });
  /* «0 5 кг» — распознавание потеряло запятую */
  t = t.replace(/(?<![\d,])(\d)\s+(\d)(?=\s+[а-яё])/g, '$1,$2');
  return t.replace(/\s+/g, ' ').trim();
}
const JOIN_WORDS = ['а','и','ещё','еще','плюс','также'];
/* «сахар соль уксус морковь 2 кг» — четыре покупки без единого числа.
   Определяющее: прилагательное всегда относится к следующему слову
   («сладкий красный перец» — один пункт), а существительное за существительным
   без количества между ними — уже новый пункт. */
function isAdjective(w){
  return /(ый|ий|ой|ая|яя|ое|ее|ые|ие|ого|его|ому|ему|ым|им|ых|их|ую|юю)$/i.test(w) && w.length > 4;
}
function isCountWord(w){
  return /^(пара|пары|штука|штуки|банка|банки|пачка|пачки|бутылка|бутылки|пакет|пакета|кусок|куска|головка|головки|пучок|пучка)$/i.test(w);
}
function splitDictatedItems(text){
  /* «купить хлеб» — это один пункт, а не глагол и пункт */
  const src = normalizeAmounts(text)
    .replace(/^(не забыть|нужно|надо|купить|взять|заказать|приобрести|захватить|прикупить)\s+/i, '');
  if (!src) return [];
  const tokens = src.split(/\s+/).filter(Boolean);
  const items = [];
  let cur = [], prev = '';
  const push = () => { const t = cur.join(' ').replace(/[\s,]+$/,'').trim(); if (t) items.push(t); cur = []; };
  const isNum = x => /^\d+([.,]\d+)?$/.test(String(x).replace(/,$/,''));
  tokens.forEach(tok => {
    const bare = tok.replace(/[,.;]+$/,'');
    if (JOIN_WORDS.indexOf(bare.toLowerCase()) >= 0){ push(); prev = ''; return; }
    const word = /^[а-яё-]+$/i.test(bare);
    /* новый пункт начинается там, где после количества снова пошло название */
    if (cur.length && word && !isUnit(bare) && (isUnit(prev) || isNum(prev))) push();
    /* …или там, где одно название сменилось другим без количества между ними */
    else if (cur.length && word && !isUnit(bare) && !isCountWord(bare) &&
             prev && /^[а-яё-]+$/i.test(prev) && !isAdjective(prev) && !isUnit(prev) && !isCountWord(prev)) push();
    cur.push(bare);
    prev = bare;
    if (/[,;]$/.test(tok)){ push(); prev = ''; }
  });
  push();
  /* «5 кг» без названия — не покупка, а хвост от соседнего пункта.
     Такой обрывок приклеиваем к следующему, а если он последний — к предыдущему. */
  const nameless = t => !/[а-яё]{3,}/i.test(String(t).replace(/(?<![а-яё])(кг|г|гр|мл|л|шт|штук\w*|грамм\w*|литр\w*|килограмм\w*|пачк\w*|банк\w*|бутылк\w*)(?![а-яё])/gi, ''));
  for (let i = 0; i < items.length; i++){
    if (!nameless(items[i])) continue;
    if (i + 1 < items.length){ items[i+1] = items[i] + ' ' + items[i+1]; items.splice(i,1); i--; }
    else if (i > 0){ items[i-1] = items[i-1] + ' ' + items[i]; items.splice(i,1); i--; }
  }
  return items.map(x => x.charAt(0).toUpperCase() + x.slice(1)).slice(0,50);
}
/* раскладываем прямо в поле, чтобы человек увидел результат и мог поправить */
function spillList(el){
  const raw = (el.value || '').trim();
  if (!raw || raw.indexOf('\n') >= 0) return;
  const items = splitDictatedItems(raw);
  if (items.length > 1) el.value = items.join('\n');
}

/* Срок описывался по-разному: на «Сегодня» — «было на 3 сентября»,
   в «Заметках» — просто «дата 3 сентября», без признака просрочки. */
function dueLabel(n){
  if (!n.due) return '';
  if (n.done) return 'срок был ' + humanDate(n.due);
  if (n.due === today()) return 'на сегодня';
  if (n.due < today()){
    const days = Math.round((new Date(today()+'T12:00') - new Date(n.due+'T12:00')) / 86400000);
    return 'срок прошёл ' + days + ' ' + plural(days,'день','дня','дней') + ' назад';
  }
  return 'на ' + humanDate(n.due);
}
/* Длинный текст занимал весь экран. Теперь видна первая строка, остальное
   раскрывается нажатием — как в бумажном блокноте с загнутой страницей. */
const NOTE_HEAD = 90;
let noteOpen = {};
function noteIsLong(t){
  const s = String(t || '');
  return s.length > NOTE_HEAD || s.indexOf('\n') >= 0;
}
function noteHead(t){
  /* в свёрнутом виде значки разметки выглядят мусором — берём первую
     содержательную строку и чистим её от решёток и звёздочек */
  const first = (noteBody(t).split('\n').map(x => x.trim())
    .find(x => x && !/^-{3,}$/.test(x)) || '')
    .replace(/^#{1,6}\s*/, '').replace(/\*\*/g, '').replace(/^[-*•]\s*/, '');
  if (first.length <= NOTE_HEAD) return first;
  return first.slice(0, NOTE_HEAD).replace(/\s+\S*$/, '') + '…';
}
function toggleNoteText(id){ noteOpen[id] = !noteOpen[id]; renderNotes(); }
/* Диктовка и вставка приносят перечень одной простынёй: «... : * помидоры — 5 кг;
   * перец — 2 кг». Разворачиваем в строки, иначе читать невозможно. */
function noteBody(t){
  let v = String(t || '');
  /* у вставленного текста своя разметка — звёздочки там значат другое */
  if (looksPasted(v)) return v;
  if ((v.match(/\*/g) || []).length < 2) return v;
  v = v.replace(/\s*[;,.]?\s*\*\s*/g, '\n• ');
  return v.replace(/\n{2,}/g, '\n').replace(/^\n/, '').trim();
}

/* развёрнутый текст выносим под строку, во всю ширину карточки:
   в узкой колонке между значком и кнопками помещалось по три слова */
/* Вставленный текст выводился сплошняком: заголовки, списки и ссылки терялись.
   Разбираем простую разметку — этого хватает для рецептов и инструкций. */
function noteMarkup(text){
  const lines = noteReadingText(text).split('\n');
  let out = '', inList = false;
  const closeList = () => { if (inList){ out += '</ul>'; inList = false; } };
  const inline = t => esc(t)
    .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
  lines.forEach(raw => {
    const line = raw.trim();
    if (!line){ closeList(); return; }
    if (/^-{3,}$/.test(line)){ closeList(); out += '<hr class="nt-hr">'; return; }
    const head = line.match(/^(#{1,6})\s+(.*)$/);
    if (head){ closeList(); out += '<div class="nt-h' + Math.min(head[1].length,3) + '">' + inline(head[2]) + '</div>'; return; }
    const bullet = line.match(/^[-*•]\s+(.*)$/);
    if (bullet){
      if (!inList){ out += '<ul class="nt-ul">'; inList = true; }
      out += '<li>' + inline(bullet[1]) + '</li>';
      return;
    }
    const num = line.match(/^(\d+)\.\s+(.*)$/);
    if (num){ closeList(); out += '<div class="nt-num"><b>' + num[1] + '.</b> ' + inline(num[2]) + '</div>'; return; }
    closeList();
    out += '<p class="nt-p">' + inline(line) + '</p>';
  });
  closeList();
  return out;
}
/* Вставленная из сообщения или документа инструкция часто приходит одной
   строкой. При чтении делим её на смысловые блоки, не меняя сохранённый текст. */
function noteReadingText(text){
  let v = String(text || '').replace(/\r/g, '').trim();
  if (!v) return '';

  v = v.replace(/(?<!#)\s+(Действие|Шаг)\s+(\d+)\.\s*/gi, '\n\n## $1 $2\n');
  v = v.replace(/\s+([1-9]\d?)\.\s+(?=[А-ЯЁA-Z])/g, (match, number, offset, whole) => {
    const before = whole.slice(Math.max(0, offset - 12), offset);
    return /(?:Действие|Шаг)$/i.test(before) ? match : '\n' + number + '. ';
  });
  v = v
    .replace(/\s*•\s*/g, '\n• ')
    .replace(/([.!?])\s+(Если|Когда|Важно|Готово|Ссылка|Проверить|Дальше)(?=\s|:)/g, '$1\n\n$2');

  const blocks = v.split(/\n{2,}/).map(block => {
    const p = block.trim();
    if (!p || /^(#{1,6}\s|[-*•]\s|\d+\.\s)/.test(p) || p.length < 260) return p;
    const sentences = p.match(/.*?[.!?](?=\s+[А-ЯЁA-Z]|$)|.+$/g) || [p];
    const groups = [];
    let current = '';
    sentences.forEach(sentence => {
      const next = (current ? current + ' ' : '') + sentence.trim();
      if (current && next.length > 280){ groups.push(current); current = sentence.trim(); }
      else current = next;
    });
    if (current) groups.push(current);
    return groups.join('\n\n');
  }).filter(Boolean);
  return blocks.join('\n\n').replace(/\n{3,}/g, '\n\n');
}
function noteFullBlock(x){
  if (!noteIsLong(x.text) || !noteOpen[x.id]) return '';
  return '<div class="note-full">' + noteMarkup(noteBody(x.text)) + '</div>' +
    '<button type="button" class="fold-close" onclick="toggleNoteText(\'' + x.id + '\')">Свернуть</button>';
}
function noteMeta(x){
  const kind = (x.kind || 'task') === 'task';
  const state = kind ? (x.done ? 'Выполнено ' + humanDate(x.completedAt || today()) : noteAge(x)) : '';
  /* «Добавлено сегодня · создано 5 сентября» — одно и то же дважды */
  const created = noteAge(x) === 'Добавлено сегодня' && kind && !x.done ? '' : humanDate(x.date);
  return [state, created, x.due ? dueLabel(x) : ''].filter(Boolean).join(' · ');
}
function noteAge(n){
  const days=Math.max(0,Math.floor((new Date(today()+'T12:00')-new Date((n.date||today())+'T12:00'))/86400000));
  return days ? 'В списке '+days+' '+plural(days,'день','дня','дней') : 'Добавлено сегодня';
}

/* ---------- списки по пунктам ---------- */

/* Чтобы дописать строчку в длинную заметку, приходилось открывать правку,

function openAppend(id){ editNoteId = id; openSheet('noteAppend'); }
function saveAppend(){
  const n = findNote(editNoteId);
  if (!n) return;
  const raw = (val('f-append') || '').trim();
  if (!raw){ toast('Впишите или продиктуйте, что дописать'); return; }
  const add = keepOrTidy(raw);
  if (n.items){
    /* разбираем до причёсывания: tidy ставит запятую перед числом
       и «яйца 10 штук» разъезжается на два пункта */
    const lines = splitDictatedItems(raw);
    const known = {};
    n.items.forEach(i => { known[i.t.toLowerCase()] = 1; });
    lines.forEach(t => { if (!known[t.toLowerCase()]) n.items.push({t:t, done:false}); });
    toast(lines.length > 1 ? 'Добавлено ' + lines.length + ' ' + plural(lines.length,'пункт','пункта','пунктов') : 'Пункт добавлен');
  } else {
    n.text = String(n.text || '').replace(/\s+$/,'') + '\n' + add;
    toast('Дописано');
  }
  const returnView = n.items ? 'list' : ((n.kind || 'task') === 'task' ? 'task' : 'note');
  const savedId = n.id;
  save();
  if (returnView === 'list') openListView(savedId);
  else if (returnView === 'task') openTask(savedId);
  else openNote(savedId);
}

function saveNoteEdit(){
  const n = findNote(editNoteId);
  if (!n) return;
  const txt = val('f-note');
  const lines = (val('f-items') || '').split('\n').map(x => x.trim()).filter(Boolean);
  if (!txt && !lines.length){ toast('Запись пустая — впишите текст или пункты'); return; }
  n.text = keepOrTidy(txt) || n.text;
  if (n.items || lines.length){
    if (!lines.length){ toast('В списке должен остаться хотя бы один пункт'); return; }
    const was = {};
    (n.items || []).forEach(i => { was[i.t.toLowerCase()] = i.done; });
    n.items = lines.slice(0,40).map(t => ({t: t.charAt(0).toUpperCase() + t.slice(1), done: !!was[t.toLowerCase()]}));
    n.title = tidy(txt) || 'Список'; n.text = n.title;
    const wh = val('f-where');
    if (wh) n.where = wh; else delete n.where;
  } else {
    /* Тип записи задан вкладкой. У заметки нет статуса выполнения. */
    if ((n.kind || 'task') === 'task') n.done = val('f-done') === '1';
    else n.done = false;
    if (n.done && !n.completedAt) n.completedAt = today();
    if (!n.done) delete n.completedAt;
    delete n.where;

  const due = val('f-due');
  if (due) n.due = due; else delete n.due;
  save(); closeSheet();
  toast(due ? 'Изменено · напомню ' + humanDate(due) : 'Изменено');
}

/* ================= Наблюдения =================
   Приложение считает только по вашим же записям и только тогда, когда данных
   достаточно. Если их мало — оно молчит, а не выдумывает закономерность.
   Показывается вуалью: намёк без цифр, открывать или нет — решаете вы. */
const WDAY_ACC = ['воскресенья','понедельники','вторники','среды','четверги','пятницы','субботы'];
const WDAY_DAT = ['воскресеньям','понедельникам','вторникам','средам','четвергам','пятницам','субботам'];
const OBS_NOTE = 'Это совпадение в ваших записях, а не причина и следствие. Приложение ничего не предсказывает.';
function avgOf(a){ return a.length ? a.reduce((s,x) => s + x, 0) / a.length : 0; }
function obsCfg(){
  if (!S.settings.obs) S.settings.obs = {off:0, lastAt:null, seen:{}, muted:{}};
  const o = S.settings.obs;
  o.seen = o.seen || {}; o.muted = o.muted || {};
