}
/* только текущая валюта: иначе тысяча рублей и пять тысяч тенге
   складывались в одну бессмысленную цифру */
function spentOn(d){ return sum(inCur(S.exp.filter(e => e.date === d))); }

/* день недели с заметно большими тратами */
function obsWeekday(){
  const dates = [...new Set(S.exp.map(e => e.date))].sort();
  if (S.exp.length < 15 || dates.length < 10) return null;
  const span = (new Date(dates[dates.length-1] + 'T12:00') - new Date(dates[0] + 'T12:00')) / 86400000;
  if (span < 20) return null;
  const bySum = {}, byCount = {};
  for (let t = new Date(dates[0] + 'T12:00'); t <= new Date(dates[dates.length-1] + 'T12:00'); t.setDate(t.getDate() + 1)){
    const w = t.getDay(), d = iso(t);
    byCount[w] = (byCount[w] || 0) + 1;
    bySum[w] = (bySum[w] || 0) + spentOn(d);
  }
  const avg = Object.keys(byCount).filter(w => byCount[w] >= 3).map(w => [+w, bySum[w] / byCount[w]]);
  if (avg.length < 6) return null;
  avg.sort((a,b) => b[1] - a[1]);
  const top = avg[0], rest = avgOf(avg.slice(1).map(x => x[1]));
  if (!rest || top[1] < rest * 1.5) return null;
  return {id:'wday',
    teaser:'Кое-что заметила про ваши ' + WDAY_ACC[top[0]] + '.',
    title:'Дни недели',
    body:'По ' + WDAY_DAT[top[0]] + ' у вас уходит в среднем ' + money(top[1]) +
         ', в остальные дни — ' + money(rest) + '.'};
}
/* категория, куда уходит много мелкими шагами */
function obsHabit(){
  const m = monthOf(today()), by = {};
  expOf(m).forEach(e => { by[e.cat] = by[e.cat] || {n:0, s:0}; by[e.cat].n++; by[e.cat].s += +e.sum || 0; });
  const c = Object.entries(by).filter(x => x[1].n >= 6).sort((a,b) => b[1].s - a[1].s)[0];
  if (!c) return null;
  return {id:'habit',
    teaser:'Одна привычка набегает по мелочи.',
    title:'Мелкими шагами',
    body:'В этом месяце «' + c[0] + '» — ' + c[1].n + ' ' + plural(c[1].n,'раз','раза','раз') +
         ' на ' + money(c[1].s) + '. В среднем ' + money(c[1].s / c[1].n) + ' за раз.'};
}
/* категория, которая заметно изменилась к прошлому месяцу */
function obsMonthCat(){
  const m = monthOf(today()), pm = prevMonth(m);
  if (expOf(pm).length < 5 || expOf(m).length < 5) return null;
  // сравниваем равные отрезки: неполный месяц против полного дал бы ложное «стало меньше»
  const day = dayNow(), full = day >= daysInMonth(m);
  const now = Object.fromEntries(full ? byCat(m) : byCatUpTo(m, day));
  const was = Object.fromEntries(full ? byCat(pm) : byCatUpTo(pm, day));
  let best = null;
  Object.keys(Object.assign({}, now, was)).forEach(c => {
    const a = now[c] || 0, b = was[c] || 0, d = a - b;
    if (!b || Math.abs(d) < notable() || Math.abs(d) / b < 0.3) return;
    if (!best || Math.abs(d) > Math.abs(best.d)) best = {c, a, b, d};
  });
  if (!best) return null;
  return {id:'mcat',
    teaser:'Одна категория в этом месяце ведёт себя иначе.',
    title:'Не как в прошлом месяце',
    body:(full ? '' : 'За первые ' + day + ' ' + plural(day,'день','дня','дней') + ' месяца. ') +
         '«' + best.c + '»: было ' + money(best.b) + ', стало ' + money(best.a) + ' — ' +
         (best.d > 0 ? 'больше на ' : 'меньше на ') + money(Math.abs(best.d)) + '.'};
}
function allObs(){
  return [obsWeekday(), obsHabit(), obsMonthCat()]
    .filter(Boolean);

/* вуаль: намёк без цифр, не чаще раза в три дня */
function pickObs(){
  const o = obsCfg();
  if (o.off) return null;
  if (o.lastAt && (Date.now() - new Date(o.lastAt).getTime()) / 86400000 < 3) return null;
  const list = allObs().filter(x => !o.muted[x.id]);
  if (!list.length) return null;
  list.sort((a,b) => (o.seen[a.id] || 0) - (o.seen[b.id] || 0) || a.id.localeCompare(b.id));
  return list[0];
}

function backupDue(){
  const records = S.exp.length + S.inc.length + S.ev.length + S.notes.length + Object.keys(S.day || {}).length;
  if (!records) return false;
  const from = S.backupAt || S.firstDataAt || S.savedAt;
  if (!from) return false;
  return Date.now() - new Date(from).getTime() >= 7 * 86400000;
}

const EVENT_HINTS = ['Маникюр','Педикюр','Парикмахер','Врач','Стоматолог','Тренировка','Танцы','Встреча','Созвон','Учёба','Покупки','Уборка'];

/* Список выпадающих подсказок в айфоне не показывается — Safari прячет его
   в узкую полоску над клавиатурой. Поэтому подсказки рисуем сами, прямо под
   полем, и сортируем по тому, как часто запись повторялась. */
function eventHintList(onlyMine){
  const seen = {};
  (S && S.ev ? S.ev : []).forEach((e, i) => {
    const t = tidy(e.title || '');
    if (!t) return;
    const key = t.toLowerCase();
    if (!seen[key]) seen[key] = {text:t, count:0, last:-1};
    seen[key].count++;
    seen[key].last = i;
  });
  const mine = Object.keys(seen).map(k => seen[k])
    .sort((a,b) => b.count - a.count || b.last - a.last)
    .map(x => x.text);
  return onlyMine ? mine : [...new Set(mine.concat(EVENT_HINTS))];
}
/* Своего списка Safari не показывает под полем — он раскрывает панель во весь
   экран и закрывает форму. Поэтому list у поля больше нет: подсказки рисуем
   сами, строкой под полем, а само поле остаётся сверху и всегда доступно. */
function eventInput(value, parseOnBlur){
  return '<input id="f-title" value="' + esc(value || '') + '" placeholder="Например: Маникюр"' +
    ' autocomplete="off" onfocus="openHints(\'f-title\')" oninput="renderHints(\'f-title\',this.value)"' +
    ' onblur="closeHints(\'f-title\');' + (parseOnBlur ? 'spillTitle(this)' : '') + '">';
}
/* Подсказки были только у названия события; адрес, расход и название списка
   открывали панель Safari во весь экран. Механизм один на все поля. */
const TIME_HINTS = ['09:00','10:00','10:30','11:00','12:00','13:00','15:00','16:00','18:00','19:00'];
function timeHints(onlyMine){
  const stats = {};
  (S.ev || []).forEach((e,i) => {
    const t = e.time; if (!t) return;
    if (!stats[t]) stats[t] = {t:t, count:0, last:i};
    stats[t].count++; stats[t].last = i;
  });
  const mine = Object.keys(stats).map(k => stats[k])
    .sort((a,b) => b.count - a.count || b.last - a.last).map(x => x.t);
  return onlyMine ? mine : [...new Set(mine.concat(TIME_HINTS))];
}
function hintSource(kind, onlyMine){
  const all = kind === 'time'    ? timeHints(onlyMine)
            : kind === 'theme'   ? themeList()
            : kind === 'event'   ? eventHintList(onlyMine)
            : kind === 'address' ? addressHints()
            : kind === 'expense' ? expenseHints(onlyMine)
            : kind === 'list'    ? listTitleHints(onlyMine) : [];
  return all;
}
/* Список раскрывается под полем, как привычная подсказка ввода: своё —
   сверху и помечено, встроенные примеры — ниже. Свой список, а не системный:
   Safari показывает собственный панелью во весь экран поверх формы. */
function hintsBox(fieldId, kind, value){
  return '<div class="hints" id="hints-' + fieldId + '" data-field="' + fieldId + '" data-kind="' + kind + '">' +
    hintRows(kind, value || '') + '</div>';
}
function hintRows(kind, typed){
  const mine = hintSource(kind, true);
  const own = {};
  mine.forEach(x => { own[x.toLowerCase()] = 1; });
  const all = hintSource(kind);
  const q = String(typed).trim().toLowerCase();
  const fit = (q ? all.filter(x => x.toLowerCase().includes(q) && x.toLowerCase() !== q) : all).slice(0, 40);
  if (!fit.length) return '';
  return fit.map(x =>
    '<button type="button" class="hint-row" data-v="' + esc(x) + '" onclick="useHint(this)">' +
      '<span>' + esc(x) + '</span>' +
      (own[x.toLowerCase()] ? '<em>вы записывали</em>' : '') +
    '</button>').join('');
}
function renderHints(fieldId, typed){
  const box = document.getElementById('hints-' + fieldId);
  if (!box) return;
  box.innerHTML = hintRows(box.dataset.kind, typed);
  box.classList.toggle('open', !!box.innerHTML);
}
function openHints(fieldId){
  const el = document.getElementById(fieldId);
  renderHints(fieldId, el ? el.value : '');
}
function closeHints(fieldId){
  /* задержка нужна, чтобы успело сработать нажатие по строке списка */
  setTimeout(() => {
    const box = document.getElementById('hints-' + fieldId);
    if (box) box.classList.remove('open');
  }, 160);
}
function useHint(btn){
  const box = btn.closest('.hints');
  const el = box && document.getElementById(box.dataset.field);
  if (!el) return;
  el.value = btn.dataset.v;
  box.classList.remove('open');
  if (box.dataset.kind === 'expense') syncExpenseCategory(el.value);
  if (box.dataset.kind === 'list') fillListFromHistory(el.value);
  el.focus();
}
function addressHints(){
  const stats = {};
  (S && S.ev ? S.ev : []).forEach((e,idx) => {
    /* адрес не предложение: точку в конце дописывать не нужно */
    const a = String(e.address || '').trim().replace(/\s+/g,' '), key = a.toLowerCase(); if (!key) return;
    if (!stats[key]) stats[key] = {a:a, count:0, last:idx};
    stats[key].count++; stats[key].last = idx;
  });
  return Object.keys(stats).map(k=>stats[k]).sort((x,y)=>y.count-x.count || y.last-x.last).map(x=>x.a).slice(0,20);
}
function addressInput(value){
  return '<input id="f-address" value="'+esc(value||'')+'" placeholder="Например: ул. Ленина, 10" autocomplete="street-address" onfocus="openHints(\'f-address\')" oninput="renderHints(\'f-address\',this.value)" onblur="closeHints(\'f-address\')">'+
    hintsBox('f-address','address',value||'');
}
const EXPENSE_HINTS = ['Продукты','Кафе','Доставка','Коммунальные услуги','Маникюр','Аптека','Такси','Бензин','Одежда','Подарки'];
function expenseHints(onlyMine){
  const stats = {};
  (S && S.exp ? S.exp : []).forEach((e,idx) => {
    const title = tidy(e.title || ''), key = title.toLowerCase(); if (!key) return;
    if (!stats[key]) stats[key] = {title:title,count:0,last:idx};
    stats[key].count++; stats[key].last=idx;
  });
  const learned = Object.values(stats).sort((a,b)=>b.count-a.count || b.last-a.last).map(x=>x.title);
  return onlyMine ? learned : [...new Set(learned.concat(EXPENSE_HINTS))].slice(0,40);
}
function expenseInput(value){
  return '<input id="f-title" value="' + esc(value || '') + '" placeholder="Например: Продукты" autocomplete="off" onfocus="openHints(\'f-title\')" oninput="syncExpenseCategory(this.value);renderHints(\'f-title\',this.value)" onblur="closeHints(\'f-title\')">';
}
function syncExpenseCategory(text){
  if (catTouched) return;
  const el = document.getElementById('f-cat'); if (el) el.value = pickCat(text);
}
const LIST_HINTS = ['Покупки','Дела на сегодня','Подготовить документы','В дорогу','Уборка','Звонки','Рабочие задачи'];
function listTitleHints(onlyMine){
  const stats = {}, lists = (S && S.notes ? S.notes.filter(n => n.items && (n.title || n.text)) : []);
  lists.forEach((n,idx) => {
    const title = tidy(n.title || n.text), key = title.toLowerCase();
    if (!stats[key]) stats[key] = {title:title, count:0, last:idx};
    stats[key].count++; stats[key].last=idx;
  });
  const learned = Object.values(stats).sort((a,b) => b.count-a.count || b.last-a.last).map(x=>x.title);
  return onlyMine ? learned : [...new Set(learned.concat(LIST_HINTS))].slice(0,40);
}
function listTitleInput(){
  return '<input id="f-list-title" placeholder="Например: Покупки" autocomplete="off" onchange="fillListFromHistory(this.value)" onfocus="openHints(\'f-list-title\')" oninput="renderHints(\'f-list-title\',this.value)" onblur="closeHints(\'f-list-title\')">' +
    hintsBox('f-list-title','list','');
}
function fillListFromHistory(title){
  const items = document.getElementById('f-list-items');
  if (!items || items.value.trim() || !title.trim()) return;
  const old = (S.notes || []).slice().reverse().find(n => n.items && tidy(n.title || n.text).toLowerCase() === title.trim().toLowerCase());
  if (!old) return;
  items.value = old.items.map(i => i.t).join('\n');
  toast('Пункты прошлого списка подставлены — их можно изменить');
}
function setTimeValue(el, time){
  if (!el || !time) return;
  if (el.tagName === 'SELECT' && !Array.from(el.options).some(o => o.value === time)){
    const o = document.createElement('option'); o.value = time; o.textContent = time; el.appendChild(o);
  }
  el.value = time;
}

function finishWelcome(){
  const name=val('f-welcome-name');
  if(!name){toast('Введите имя для приветствия');return;}
  S.settings.name=tidy(name);S.settings.cur=val('f-welcome-cur')||'RUB';S.settings.onboarded=1;S.settings.hi=1;
  save();closeSheet();toast('Готово. Можно добавить первое дело');
}

/* ---------- разбор фразы, надиктованной в первое поле ----------
   Клавиатура телефона кладёт весь распознанный текст туда, где стоит курсор.
   Поэтому из первого поля вынимаем сумму, дату и время и раскладываем их
   по своим полям, а в названии оставляем только суть. */
function spillTitle(el){
  if (!el) return;
  const raw = (el.value || '').trim();
  if (!raw) return;
  const sumEl = document.getElementById('f-sum');
  const dateEl = document.getElementById('f-date');
  const timeEl = document.getElementById('f-time');
  const moved = [];
  if (sumEl && !sumEl.value.trim()){
    const v = parseSum(' ' + raw + ' ');
    if (v){ sumEl.value = v; moved.push('сумма ' + num(v) + ' ' + sign()); }
  }
  if (dateEl && dateEl.value === today()){
    const d = parseDate(raw);
    if (d && d !== today()){ dateEl.value = d; moved.push('дата ' + humanDate(d)); }
  }
  if (timeEl && !timeEl.value.trim()){
    const tm = parseTime(' ' + raw + ' ');
    if (tm){ setTimeValue(timeEl, tm); moved.push('время ' + tm); }
  }
  if (!moved.length){ el.value = tidy(raw); return; }
  el.value = clean(raw) || tidy(raw);
  toast('Разложила: ' + moved.join(', '));
}
/* если поле не успело потерять фокус, разбираем прямо при нажатии кнопки */

}

function fixSum(el){
  const raw = (el.value || '').trim();
  if (!raw) return;
  if (/^[0-9]+([.,][0-9]+)?$/.test(raw.replace(/\s/g,''))){ el.value = raw.replace(/\s/g,'').replace(',','.'); return; }
  const n = parseSum(' ' + raw + ' ');
  if (n) el.value = n;
  else { el.value = ''; toast('Не поняла сумму — скажите «восемьсот» или напишите цифрами'); }
}
/* Двоеточие ставим прямо во время набора, а не когда человек уйдёт из поля:
   иначе на экране висит «1015» и непонятно, понял ли его телефон.
   Если час больше двух — час однозначно один: «815» это 8:15, а не 81:5. */
function liveTime(el){
  const raw = el.value;
  if (/[^\d:.\s]/.test(raw)) return;   // продиктовано словами — не вмешиваемся
  const d = raw.replace(/\D/g,'').slice(0,4);
  if (!d){ el.value = ''; return; }
  const hLen = (+d[0] >= 3) ? 1 : 2;
  el.value = d.length > hLen ? d.slice(0,hLen) + ':' + d.slice(hLen, hLen + 2) : d;
}
function fixTime(el){
  const raw = (el.value || '').trim();
  if (!raw) return;
  let t = null;
  /* «0815» и «1930» — так время набирают на цифровой клавиатуре. Раньше сюда
     первым добирался разбор речи, видел «08» и терял минуты: 0815 → 08:00. */
  const compact = raw.match(/^([0-9]{1,2})([0-9]{2})$/);
  if (compact){
    const h = +compact[1], m = +compact[2];
    if (h <= 23 && m <= 59) t = String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0');
    else { el.value = ''; toast('Время должно быть от 00:00 до 23:59, например 10:15'); return; }
  }
  if (!t) t = parseTime(' в ' + raw + ' ') || parseTime(' ' + raw + ' ');
  if (!t){
    const m = raw.match(/^([0-9]{1,2})[^0-9]?([0-9]{2})?$/);
    if (m && +m[1] <= 23 && +(m[2] || 0) <= 59)
      t = String(+m[1]).padStart(2,'0') + ':' + (m[2] || '00');
  }
  if (t) el.value = t;
  else { el.value = ''; toast('Время должно быть от 00:00 до 23:59, например 10:15'); }
}
function validTime(t){ return !t || /^([01]\d|2[0-3]):[0-5]\d$/.test(t); }
function saveEv(){

  const kind = 'plain';
  // если дату и время сказали прямо в названии — вынимаем их оттуда
  const saidDate = parseDate(raw), saidTime = parseTime(' ' + raw + ' ');
  const t = clean(raw) || tidy(raw);
  const rec = {title: t,
         date: val('f-date') && val('f-date') !== today() ? val('f-date') : (saidDate || today()),
         time: val('f-time') || saidTime || null,

      : '<div class="parse">' + rows + '</div>') +
    (parsed.rest.length ? '<div class="card" style="margin:0"><div class="lab">Сохраню как заметку</div><div class="mut">' +

    (nothing ? '' : '<button class="btn" style="margin-top:12px" onclick="applyParse()">Записать</button>') +

function applyParse(){

  parsed.exp.forEach(e => S.exp.push(Object.assign({id:uid(), date:today(), cur:S.settings.cur}, e)));
  parsed.inc.forEach(e => S.inc.push(Object.assign({id:uid(), date:today(), cur:S.settings.cur}, e)));

function backupBlob(){
  const data = JSON.stringify({app:'tochka-dnya', v:1, at:new Date().toISOString(), data:S}, null, 1);
  return new File([data], 'tochka-dnya-' + today() + '.json', {type:'application/json'});
}
function markBackup(){ S.backupAt = new Date().toISOString(); save(); }
async function sendBackup(){
  const file = backupBlob();
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'Копия «Точки дня»'});
      markBackup(); closeSheet(); toast('Копия отправлена');
      return;
    }catch(e){ if (e && e.name === 'AbortError') return; }
  }
  downloadBackup();
  toast('Отправка недоступна — файл сохранён, перешлите его себе вручную');
}
function downloadBackup(){
  const file = backupBlob();
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markBackup(); closeSheet(); toast('Копия сохранена');
}
function restoreFile(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      const d = o && o.data ? o.data : o;
      if (!d || !Array.isArray(d.exp)) throw 0;
      const now = normalize(d);
      if (hasUserData(S) && !window.confirm(
        'Заменить всё, что сейчас в приложении, записями из копии? Текущие записи будут стёрты.')) return;
      S = now;
      if (cloudUser) S.settings.cloudOwner = cloudUser.id;
      save(); toast('Копия загружена — все записи на месте');
    }catch(e){ toast('Это не похоже на копию «Точки дня»'); }
  };
  r.readAsText(f);
  input.value = '';
}
/* ================= Голосовое заполнение полей =================
   Встроенное распознавание речи есть в Chrome и требует открытия приложения
   по адресу в сети (не файлом с диска). Где его нет — подсказываем диктовку
   с клавиатуры телефона: результат тот же, надёжность выше. */
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
/* На айфоне диктовка уже есть в системной клавиатуре. Отдельная кнопка только
   дублировала её и выглядела как непонятный значок, поэтому там её не показываем. */
function micOn(){ return !isIOS() && !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function inFrame(){ try{ return window.self !== window.top; }catch(e){ return true; } }
function secureOrigin(){ return location.protocol === 'https:' || location.hostname === 'localhost'; }
function micWhyNot(){
  if (isIOS()) return 'На айфоне диктует клавиатура: нажмите поле, затем микрофон на клавиатуре.';
  if (inFrame()) return 'Во встроенном окне просмотра микрофон недоступен — откройте приложение отдельной страницей.';
  if (!secureOrigin()) return 'Микрофон работает только с адреса в сети (https), не с файла на диске.';
  if (!micOn()) return 'Этот браузер не умеет распознавать речь — нажмите микрофон на клавиатуре телефона.';
  return null;
}
function micBtn(targetId, mode){
  if (isIOS()) return '';
  return '<button type="button" class="mic" title="Сказать голосом" aria-label="Сказать голосом"' +
    ' onclick="micStart(this,\'' + targetId + '\',\'' + (mode || 'text') + '\')">🎙</button>';
}
function fldMic(labelText, inputHtml, targetId, mode, below){
  return '<div class="fld"><label>' + labelText + '</label><div class="withmic">' +
    inputHtml + micBtn(targetId, mode) + '</div>' + (below || '') + '</div>';
}
let rec = null;
function micStart(btn, targetId, mode){
  const el = document.getElementById(targetId);
  if (!el) return;
  if (isIOS()){
    el.focus();
    toast('Нажмите микрофон на клавиатуре — на айфоне диктует она');
    return;
  }
  const why = micWhyNot();
  if (why){ toast(why + ' Пока диктуйте микрофоном на клавиатуре телефона.'); el.focus(); return; }
  if (rec){ try{ rec.stop(); }catch(e){} rec = null; btn.dataset.on = '0'; return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new R();
  rec.lang = 'ru-RU'; rec.interimResults = false; rec.maxAlternatives = 1;
  btn.dataset.on = '1';
  rec.onresult = e => {
    btn.dataset.on = '0'; rec = null;
    const said = e.results[0][0].transcript;
    if (mode === 'sum'){
      const v = parseSum(said);
      if (v) el.value = v; else toast('Не расслышала сумму: «' + said + '»');
    } else if (mode === 'time'){
      const t = parseTime(said);
      if (t) setTimeValue(el, t); else toast('Не расслышала время: «' + said + '»');
    } else {
      el.value = mode === 'raw'
        ? tidy((el.value ? el.value + ' ' : '') + said)
        : (el.value ? el.value + ', ' : '') + clean(said);
      if (targetId === 'f-title' && document.getElementById('f-cat')) syncExpenseCategory(el.value);
    }
  };
  rec.onerror = ev => {
    btn.dataset.on = '0'; rec = null;
    toast(ev.error === 'not-allowed'
      ? (inFrame() ? 'Во встроенном окне просмотра микрофон недоступен — откройте приложение отдельной страницей.'
                   : 'Микрофон запрещён — разрешите доступ браузеру.')
      : 'Не получилось расслышать. Попробуйте микрофон на клавиатуре телефона.');
  };
  rec.onend = () => { btn.dataset.on = '0'; rec = null; };
  try{ rec.start(); }catch(e){ btn.dataset.on = '0'; rec = null; }
}
function micStopAll(){ if (rec){ try{ rec.stop(); }catch(e){} rec = null; } }

load();

/* старое значение бюджета по умолчанию (60 000) осталось у тех,
   кто открывал ранние версии — стираем, чтобы не показывать чужую цифру */

/* до этой версии валюта была одна на всё приложение: символ менялся, а суммы
   оставались прежними. Поэтому проставляем старым записям ту валюту,
   которая активна сейчас, — в ней они и вносились. */
(function stampCurrency(){
  if (S.settings.curStamped) return;
  let n = 0;
  S.exp.concat(S.inc).forEach(e => { if (!e.cur){ e.cur = S.settings.cur; n++; } });
  S.settings.curStamped = 1;
  saveQuiet();
})();

/* разовая починка старых записей: если дата и время остались внутри названия,
   раскладываем их по местам — событие «Парикмахер, 29 сентября 10:00» становится
   событием «Парикмахер» на 29 сентября в 10:00 */
(function fixOldEvents(){
  if (S.settings.fixedEv) return;
  let changed = 0;
  S.ev.forEach(e => {
    const t = String(e.title || '');
    const hasDate = new RegExp('(' + MONTH_GEN.join('|') + ')', 'i').test(t);
    const hasTime = /[0-9]{1,2}[:.][0-9]{2}/.test(t) || /ноль ноль|часов|утра|вечера/i.test(t);
    if (!hasDate && !hasTime) return;
    const d = parseDate(t), tm = parseTime(' ' + t + ' ');
    const nice = clean(t);
    if (nice) e.title = nice;
    if (hasDate && d) e.date = d;
    if (tm) e.time = tm;
    changed++;
  });
  S.settings.fixedEv = 1;
  if (changed) save(); else saveQuiet();
})();

/* Без этого любая незамеченная ошибка оставляла белый экран без единого слова.
   Записи при этом целы — важно сказать об этом, а не молчать. */
let crashShown = false;
function showCrash(what){
  if (crashShown) return;
  crashShown = true;
  try{ saveQuiet(); }catch(e){}
  const bar = document.createElement('div');
  bar.className = 'crashbar';
  bar.innerHTML = '<b>Что-то пошло не так</b>' +
    '<span>Записи сохранены — они на месте. Обновите страницу, а если повторится, сохраните резервную копию.</span>' +
    '<span class="crash-why">' + esc(String(what || '').slice(0,140)) + '</span>' +
    '<button type="button" onclick="location.reload()">Обновить</button>';
  (document.body || document.documentElement).appendChild(bar);
}
/* Приложение, открытое в двух местах, затирало само себя: каждая вкладка
   писала своё поверх чужого. Теперь чужая запись подхватывается и сливается
   по тем же правилам, что и записи из облака. */
window.addEventListener('storage', e => {
  if (e.key !== KEY || !e.newValue) return;
  try{
    const other = normalize(JSON.parse(e.newValue));
    const merged = mergeStates(S, other);
    const changed = JSON.stringify(merged) !== JSON.stringify(other);
    S = merged;
    /* назад пишем только если добавилось наше — иначе вкладки будут
       бесконечно передавать запись друг другу */
    if (changed) saveQuiet();
    renderAll();
    toast('Записи обновлены — приложение открыто ещё в одном месте');
  }catch(err){}
});
window.addEventListener('error', e => showCrash(e && e.message));
window.addEventListener('unhandledrejection', e => showCrash(e && e.reason && e.reason.message));

renderAll();
setDock(curScreen);

/* iOS не уменьшает окно, когда выезжает клавиатура: форма считает, что места
   по-прежнему во весь экран, и кнопка сохранения уходит под клавиатуру.
   Подгоняем высоту окна под то, что реально видно. */
if (window.visualViewport){
  const fitSheet = () => {
    const box = document.getElementById('sheet-in');
    if (!box) return;
    const hidden = Math.max(0, window.innerHeight - visualViewport.height - visualViewport.offsetTop);
    if (hidden > 80){
      box.style.maxHeight = (visualViewport.height - 24) + 'px';
      box.style.paddingBottom = (hidden > 0 ? 26 : 22) + 'px';
    } else {
      box.style.maxHeight = '';
      box.style.paddingBottom = '';
    }
  };
  visualViewport.addEventListener('resize', fitSheet);
  visualViewport.addEventListener('scroll', fitSheet);
}
/* и подводим само поле к глазам, а не оставляем у нижнего края */
document.addEventListener('focusin', e => {
  const el = e.target;
  if (!el || !el.closest || !el.closest('#sheet-in')) return;
  setTimeout(() => { try{ el.scrollIntoView({block:'center'}); }catch(err){} }, 280);
});
/* фон окна закрывается нажатием, но у клавиатуры нажатия нет — нужен Esc */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && document.getElementById('sheet').classList.contains('open')
      && sheetState.kind !== 'welcome') closeSheet();
});
initCloud();
if (!S.settings.onboarded) setTimeout(() => openSheet('welcome'), 120);
setInterval(() => {
  if (!document.getElementById('s-today').hidden) renderToday();
}, 60000);
if (!storageOk) toast('Браузер не сохраняет данные — работайте в обычном режиме, не в инкогнито');
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

</script>
