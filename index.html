let parsed = null;
function doParse(){
  const text = val('f-speech');
  if (!text){ toast('Сначала надиктуйте или впишите текст'); return; }
  parsed = parseSpeech(text);
  const line = (ic, t, where) => '<div class="to">' + ic + ' <span>' + esc(t) + '</span><em>' + where + '</em></div>';
  let rows = '';
  parsed.exp.forEach(e => rows += line('💸', e.title + ' · ' + money(e.sum) + ' · ' + e.cat, 'Деньги'));
  parsed.inc.forEach(e => rows += line('💰', e.title + ' · ' + money(e.sum), 'Доход'));
  parsed.ev.forEach(e => rows += line('📅', e.title + ' · ' + humanDate(e.date) + (e.time ? ', ' + e.time : ''), 'Календарь'));
  parsed.notes.forEach(t => rows += line('✎', t, 'Записи'));
  const nothing = !rows && !parsed.rest.length;
  document.getElementById('sheet-in').innerHTML =
    '<h3>Разложено</h3>' +
    (nothing ? '<div class="mut">Не удалось ничего распознать. Попробуйте назвать сумму или время: «потратила 800 на продукты».</div>'
      : '<div class="parse">' + rows + '</div>') +
    (parsed.rest.length ? '<div class="card" style="margin:0"><div class="lab">Сохраню как заметку</div><div class="mut">' +
        esc(parsed.rest.join('. ')) + '</div></div>' : '') +
    (nothing ? '' : '<button class="btn" style="margin-top:12px" onclick="applyParse()">Записать</button>') +
    '<button class="btn ghost" style="margin-top:8px" onclick="openSheet(\'voice\')">Сказать заново</button>';
}
function restToNote(){
  if (!parsed || !parsed.rest.length) return;
  S.notes.push({id:uid(), date:today(), text:tidy(parsed.rest.join('. ')), kind:'note', done:false});
  parsed.rest = [];
  save(); closeSheet(); toast('Сохранено в заметки — ничего не потерялось');
}
function applyParse(){
  if (!parsed) return;
  parsed.exp.forEach(e => S.exp.push(Object.assign({id:uid(), date:today(), cur:S.settings.cur}, e)));
  parsed.inc.forEach(e => S.inc.push(Object.assign({id:uid(), date:today(), cur:S.settings.cur}, e)));
  parsed.ev.forEach(e => S.ev.push(Object.assign({id:uid()}, e)));
  parsed.notes.forEach(t => S.notes.push(makeNote(t)));
  parsed.rest.forEach(t => S.notes.push({id:uid(), date:today(), text:tidy(t), kind:'note', done:false}));
  save(); closeSheet(); toast('Записано');
  parsed = null;
}

/* ---------- копия данных ---------- */
function backupBlob(){
  const data = JSON.stringify({app:'tochka-dnya', v:1, at:new Date().toISOString(), data:S}, null, 1);
  return new File([data], 'tochka-dnya-' + today() + '.json', {type:'application/json'});
}
function markBackup(){ S.backupAt = new Date().toISOString(); save(); }
async function sendBackup(){
  const file = backupBlob();
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'Копия «Точки дня»'});
      markBackup(); closeSheet(); toast('Копия отправлена');
      return;
    }catch(e){ if (e && e.name === 'AbortError') return; }
  }
  downloadBackup();
  toast('Отправка недоступна — файл сохранён, перешлите его себе вручную');
}
function downloadBackup(){
  const file = backupBlob();
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markBackup(); closeSheet(); toast('Копия сохранена');
}
function restoreFile(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      const d = o && o.data ? o.data : o;
      if (!d || !Array.isArray(d.exp)) throw 0;
      S = d; save(); toast('Копия загружена — все записи на месте');
    }catch(e){ toast('Это не похоже на копию «Точки дня»'); }
  };
  r.readAsText(f);
  input.value = '';
}
/* ================= Голосовое заполнение полей =================
   Встроенное распознавание речи есть в Chrome и требует открытия приложения
   по адресу в сети (не файлом с диска). Где его нет — подсказываем диктовку
   с клавиатуры телефона: результат тот же, надёжность выше. */
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
/* на айфоне распознавание речи Apple отдаёт только своей клавиатуре,
   поэтому кнопка не притворяется микрофоном, а открывает клавиатуру */
function micOn(){ return !isIOS() && !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function inFrame(){ try{ return window.self !== window.top; }catch(e){ return true; } }
function secureOrigin(){ return location.protocol === 'https:' || location.hostname === 'localhost'; }
function micWhyNot(){
  if (isIOS()) return 'На айфоне диктует клавиатура: нажмите поле, затем микрофон на клавиатуре.';
  if (inFrame()) return 'Во встроенном окне просмотра микрофон недоступен — откройте приложение отдельной страницей.';
  if (!secureOrigin()) return 'Микрофон работает только с адреса в сети (https), не с файла на диске.';
  if (!micOn()) return 'Этот браузер не умеет распознавать речь — нажмите микрофон на клавиатуре телефона.';
  return null;
}
function micBtn(targetId, mode){
  const kb = isIOS();
  return '<button type="button" class="mic" title="' + (kb ? 'Открыть клавиатуру с микрофоном' : 'Сказать голосом') +
    '" onclick="micStart(this,\'' + targetId + '\',\'' + (mode || 'text') + '\')">' + (kb ? '⌨' : '🎙') + '</button>';
}
function fldMic(labelText, inputHtml, targetId, mode){
  return '<div class="fld"><label>' + labelText + '</label><div class="withmic">' +
    inputHtml + micBtn(targetId, mode) + '</div></div>';
}
let rec = null;
function micStart(btn, targetId, mode){
  const el = document.getElementById(targetId);
  if (!el) return;
  if (isIOS()){
    el.focus();
    toast('Нажмите микрофон на клавиатуре — на айфоне диктует она');
    return;
  }
  const why = micWhyNot();
  if (why){ toast(why + ' Пока диктуйте микрофоном на клавиатуре телефона.'); el.focus(); return; }
  if (rec){ try{ rec.stop(); }catch(e){} rec = null; btn.dataset.on = '0'; return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new R();
  rec.lang = 'ru-RU'; rec.interimResults = false; rec.maxAlternatives = 1;
  btn.dataset.on = '1';
  rec.onresult = e => {
    btn.dataset.on = '0'; rec = null;
    const said = e.results[0][0].transcript;
    if (mode === 'sum'){
      const v = parseSum(said);
      if (v) el.value = v; else toast('Не расслышала сумму: «' + said + '»');
    } else if (mode === 'time'){
      const t = parseTime(said);
      if (t) setTimeValue(el, t); else toast('Не расслышала время: «' + said + '»');
    } else {
      el.value = mode === 'raw'
        ? tidy((el.value ? el.value + ' ' : '') + said)
        : (el.value ? el.value + ', ' : '') + clean(said);
      if (targetId === 'f-title' && document.getElementById('f-cat')) syncExpenseCategory(el.value);
    }
  };
  rec.onerror = ev => {
    btn.dataset.on = '0'; rec = null;
    toast(ev.error === 'not-allowed'
      ? (inFrame() ? 'Во встроенном окне просмотра микрофон недоступен — откройте приложение отдельной страницей.'
                   : 'Микрофон запрещён — разрешите доступ браузеру.')
      : 'Не получилось расслышать. Попробуйте микрофон на клавиатуре телефона.');
  };
  rec.onend = () => { btn.dataset.on = '0'; rec = null; };
  try{ rec.start(); }catch(e){ btn.dataset.on = '0'; rec = null; }
}
function micStopAll(){ if (rec){ try{ rec.stop(); }catch(e){} rec = null; } }

/* ================= Камера: QR чека =================
   Используется встроенный в браузер распознаватель кодов (BarcodeDetector).
   Он есть в Chrome на Android. Где его нет (Safari на iPhone) — предлагаем
   ручной ввод, приложение не ломается. Никаких внешних библиотек. */

function camSupported(){ return typeof window.BarcodeDetector !== 'undefined'; }
let camStream = null, camStop = false;

function camBox(title, hint){
  return '<h3>' + esc(title) + '</h3><div class="mut">' + esc(hint) + '</div>' +
    '<div class="camwrap"><video id="cam" playsinline muted autoplay></video><div class="camline"></div></div>' +
    '<div class="mut" id="cam-note" style="margin-top:8px">Наведите камеру на код</div>';
}
async function camStart(kinds, onCode){
  camStop = false;
  const video = document.getElementById('cam');
  if (!video) return;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = camStream;
    await video.play();
  }catch(e){
    document.getElementById('cam-note').textContent = inFrame()
      ? 'Во встроенном окне просмотра камера недоступна — откройте приложение отдельной страницей.'
      : (!secureOrigin() ? 'Камера работает только с адреса в сети (https), не с файла на диске.'
                         : 'Камера запрещена — разрешите доступ браузеру или внесите вручную.');
    return;
  }
  const det = new window.BarcodeDetector({formats:kinds});
  const tick = async () => {
    if (camStop) return;
    try{
      const codes = await det.detect(video);
      if (codes && codes.length){ camEnd(); onCode(codes[0].rawValue); return; }
    }catch(e){}
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function camEnd(){
  camStop = true;
  if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}

/* ---------- чек ---------- */
/* В QR фискального чека лежат реквизиты вида
   t=20260828T1542&s=1842.00&fn=...&i=...&fp=...&n=1
   Состава покупок там нет — он хранится в базе ФНС и запрашивается отдельно. */
function parseReceiptQR(raw){
  const q = {};
  String(raw).split('&').forEach(p => { const [k,v] = p.split('='); if (k) q[k] = v; });
  if (!q.s || !q.t) return null;
  const sum = parseFloat(String(q.s).replace(',','.'));
  const t = String(q.t);
  const date = t.length >= 8 ? t.slice(0,4) + '-' + t.slice(4,6) + '-' + t.slice(6,8) : today();
  const time = t.length >= 13 ? t.slice(9,11) + ':' + t.slice(11,13) : null;
  if (!sum) return null;
  return {sum, date, time, fn:q.fn || null, fd:q.i || null, fp:q.fp || null};
}
function openCheck(){
  if (!camSupported()){
    document.getElementById('sheet-in').innerHTML =
      '<h3>Чек</h3><div class="mut">Этот браузер не умеет читать коды камерой. На айфоне откройте приложение в Chrome ' +
      'или внесите сумму вручную — она есть на чеке крупно.</div>' +
      '<button class="btn" style="margin-top:12px" onclick="openSheet(\'exp\')">Внести сумму</button>' +
      '<button class="btn ghost" style="margin-top:8px" onclick="openSheet(\'voice\')">Сказать голосом</button>' +
      '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Закрыть</button>';
    return;
  }
  document.getElementById('sheet-in').innerHTML =
    camBox('Чек', 'Наведите на квадратный код внизу чека — сумма и дата подставятся сами.') +
    '<button class="btn ghost" style="margin-top:12px" onclick="camEnd();openSheet(\'exp\')">Внести вручную</button>' +
    '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Закрыть</button>';
  camStart(['qr_code'], raw => {
    const r = parseReceiptQR(raw);
    if (!r){ toast('Это не фискальный чек — попробуйте ещё раз'); openCheck(); return; }
    checkConfirm(r);
  });
}
function checkConfirm(r){
  document.getElementById('sheet-in').innerHTML =
    '<h3>Чек прочитан</h3>' +
    '<div class="parse"><div class="to">🧾 <span>' + money(r.sum) + '</span><em>' + humanDate(r.date) + (r.time ? ', ' + r.time : '') + '</em></div></div>' +
    '<div class="fld"><label>Куда отнести</label><div class="pick" id="p-cat">' +
      CATS.map((c,i) => '<button data-v="' + esc(c) + '" aria-pressed="' + (i===0) + '" onclick="pickOne(this)">' + c + '</button>').join('') +
    '</div></div>' +
    '<div class="fld"><label>Название — необязательно</label><input id="f-title" placeholder="Магазин у дома"></div>' +
    '<div class="mut">Состав по позициям в коде не записан: он хранится в базе ФНС и подключается отдельно. ' +
      'Если нужно разделить чек — проговорите голосом, что в нём было.</div>' +
    '<button class="btn" style="margin-top:12px" onclick="saveCheck(' + r.sum + ',\'' + r.date + '\')">Записать расход</button>' +
    '<button class="btn ghost" style="margin-top:8px" onclick="openCheck()">Сканировать другой</button>';
}
function saveCheck(sum, date){
  addExp({title: val('f-title') || 'Покупка по чеку', sum: sum, cat: picked('p-cat','Продукты'), date: date, src:'из чека'});
  closeSheet(); toast('Расход по чеку записан');
}

/* ---------- запуск ---------- */
load();

/* старое значение бюджета по умолчанию (60 000) осталось у тех,
   кто открывал ранние версии — стираем, чтобы не показывать чужую цифру */
if (S.settings.budget){ delete S.settings.budget; saveQuiet(); }

/* до этой версии валюта была одна на всё приложение: символ менялся, а суммы
   оставались прежними. Поэтому проставляем старым записям ту валюту,
   которая активна сейчас, — в ней они и вносились. */
(function stampCurrency(){
  if (S.settings.curStamped) return;
  let n = 0;
  S.exp.concat(S.inc).forEach(e => { if (!e.cur){ e.cur = S.settings.cur; n++; } });
  S.settings.curStamped = 1;
  saveQuiet();
})();

/* разовая починка старых записей: если дата и время остались внутри названия,
   раскладываем их по местам — событие «Парикмахер, 29 сентября 10:00» становится
   событием «Парикмахер» на 29 сентября в 10:00 */
(function fixOldEvents(){
  if (S.settings.fixedEv) return;
  let changed = 0;
  S.ev.forEach(e => {
    const t = String(e.title || '');
    const hasDate = new RegExp('(' + MONTH_GEN.join('|') + ')', 'i').test(t);
    const hasTime = /[0-9]{1,2}[:.][0-9]{2}/.test(t) || /ноль ноль|часов|утра|вечера/i.test(t);
    if (!hasDate && !hasTime) return;
    const d = parseDate(t), tm = parseTime(' ' + t + ' ');
    const nice = clean(t);
    if (nice) e.title = nice;
    if (hasDate && d) e.date = d;
    if (tm) e.time = tm;
    changed++;
  });
  S.settings.fixedEv = 1;
  if (changed) save(); else saveQuiet();
})();
renderAll();
setDock(curScreen);
initCloud();
if (!S.settings.onboarded) setTimeout(() => openSheet('welcome'), 120);
setInterval(() => {
  if (!document.getElementById('s-today').hidden) renderToday();
}, 60000);
if (!storageOk) toast('Браузер не сохраняет данные — работайте в обычном режиме, не в инкогнито');
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

</script>
