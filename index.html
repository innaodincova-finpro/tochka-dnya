<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4E7A9E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Точка дня">
<title>Точка дня</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Golos+Text:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>

:root{
  --ground:#F4F7FA;
  --card:#FFFFFF;
  --ink:#22303F;
  --mut:#6B7F92;
  --line:#DCE6EE;
  --navy:#28425C;
  --head:#4E7A9E;
  --accent:#2F6091;
  --ok:#4B7F62;
  --ochre:#B08347;
  --stop:#A85147;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{max-width:100%;overflow-x:hidden}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:'Golos Text',system-ui,-apple-system,sans-serif;line-height:1.45;
  display:flex;flex-direction:column;align-items:center;padding:26px 14px 56px;
}
.intro{max-width:600px;width:100%;text-align:center;margin-bottom:20px}
.intro .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:6px}
.intro h1{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:clamp(22px,5vw,30px);margin:0 0 8px}
.intro p{margin:0;color:var(--mut);font-size:14px}
.num{font-family:'IBM Plex Mono',monospace;font-weight:500}

/* телефон */
.phone{
  width:390px;max-width:100%;height:800px;background:var(--ground);
  border-radius:34px;border:1px solid var(--line);overflow:hidden;
  box-shadow:0 26px 60px -26px rgba(40,66,92,.5);position:relative;display:flex;flex-direction:column
}
.status{height:24px;flex:0 0 24px;background:var(--head);color:rgba(255,255,255,.75);font-size:10px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
.appbar{background:var(--head);color:#fff;padding:6px 18px 14px;display:flex;align-items:flex-end;justify-content:space-between}
.appbar h2{font-family:'Spectral',serif;font-size:18px;margin:0;font-weight:600}
.appbar .sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
.appbar .saved{font-size:10px;color:rgba(255,255,255,.75)}
.screen{flex:1;overflow-y:auto;padding:14px 16px 150px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.screen[hidden]{display:none}

.tip{background:#E8F0F7;border:1px solid #CBDDEB;border-radius:12px;padding:9px 12px;font-size:12px;color:var(--accent);margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card.now{border-color:var(--accent);border-width:2px}
.card.navy{background:var(--navy);color:#fff;border-color:var(--navy)}
.card.navy .lab,.card.navy .mut{color:rgba(255,255,255,.65)}
.lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:600;margin-bottom:8px}
.mut{color:var(--mut);font-size:12px}
.big{font-family:'IBM Plex Mono',monospace;font-size:27px;font-weight:500;letter-spacing:-.02em}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.grid2 .card{margin:0}

/* линия дня */
.dayline{position:relative;padding-left:22px}
.spine{position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.tl{position:relative;padding:0 0 16px}
.tl-dot{position:absolute;left:-21px;top:4px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--line)}
.tl.done .tl-dot{background:var(--ok);border-color:var(--ok)}
.tl.next .tl-dot{background:var(--accent);border-color:var(--accent)}
.tl-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut)}
.tl-what{font-size:14px;font-weight:500}
.tl-sum{font-family:'IBM Plex Mono',monospace;font-size:13px}
.now-mark{display:inline-block;background:var(--ochre);color:#fff;font-size:9px;letter-spacing:.14em;padding:2px 8px;border-radius:99px;font-weight:600;margin-bottom:6px}

.stat{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat:last-child{border:0;padding-bottom:0}
.stat b{font-family:'IBM Plex Mono',monospace;font-weight:500}

.item{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.ic{width:34px;height:34px;flex:0 0 34px;border-radius:10px;background:#EDF3F8;display:flex;align-items:center;justify-content:center;font-size:15px}
.item .txt{flex:1;min-width:0}
.item .txt b{display:block;font-weight:500;font-size:14px}
.item .txt small{color:var(--mut);font-size:11px}
.sum{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:500;white-space:nowrap}
.sum.in{color:var(--ok)}

.bar{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:7px}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.seg{display:flex;height:9px;border-radius:99px;overflow:hidden;margin:10px 0}
.seg>i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:9px;font-size:11px;color:var(--mut)}
.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px}

.chip{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border:none;border-radius:99px;background:#EDF3F8;
  font-family:inherit;font-size:12px;color:var(--accent);font-weight:600;cursor:pointer}
.chip:active{background:#DCE8F3}
.card.tap{cursor:pointer}
.card.tap:active{background:#F7FAFC}
.chip.ok{background:#E7F1EA;color:var(--ok)}
.chip.warn{background:#F6EEE1;color:var(--ochre)}

.btn{display:block;width:100%;border:0;border-radius:12px;padding:12px;font-family:'Golos Text',sans-serif;font-size:14px;font-weight:500;cursor:pointer;background:var(--accent);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ok{background:var(--ok)}

.switch{display:flex;background:#E6EDF3;border-radius:12px;padding:3px;margin-bottom:12px}
.switch button{flex:1;border:0;background:transparent;padding:9px;border-radius:10px;cursor:pointer;font-family:'Golos Text',sans-serif;font-size:13px;font-weight:500;color:var(--mut)}
.switch button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(40,66,92,.12)}

/* календарь */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .dw{font-size:10px;color:var(--mut);padding-bottom:4px}
.cal .d{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:12px;background:#fff;border:1px solid var(--line);position:relative}
.cal .d.out{color:#C4D1DC;background:transparent;border-color:transparent}
.cal .d.today{background:var(--navy);color:#fff;border-color:var(--navy)}
.cal .d .mk{position:absolute;bottom:5px;display:flex;gap:2px}
.cal .d .mk i{width:4px;height:4px;border-radius:50%}

.daycard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.tarot{width:76px;flex:0 0 76px}
.tarot svg,.tarot img.art{width:100%;height:auto;display:block;border-radius:6px}
.tarot .artbox{border-radius:6px;overflow:hidden;box-shadow:0 3px 10px -4px rgba(40,66,92,.5)}
.cmp{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.cmp:last-of-type{border-bottom:0}
.cmp span{flex:1}
.cmp b{font-family:'IBM Plex Mono',monospace;font-weight:500}
.cmp em{font-style:normal;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mut);min-width:82px;text-align:right}
.cmp em.down{color:var(--ok)}
.cmp em.up{color:var(--ochre)}
.textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;font-family:'Golos Text',sans-serif;font-size:16px;resize:none;background:#FBFDFE}

/* строка ввода */
.fab{position:absolute;right:16px;bottom:76px;width:54px;height:54px;border:0;border-radius:50%;
  background:var(--ochre);color:#fff;font-size:21px;cursor:pointer;
  box-shadow:0 8px 20px -6px rgba(176,131,71,.6);z-index:5}
.fab:active{transform:scale(.95)}

.tabs{position:absolute;left:0;right:0;bottom:0;height:66px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 4px}
.tabs button{flex:1;border:0;background:transparent;cursor:pointer;padding:5px 0;font-family:'Golos Text',sans-serif;font-size:10px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabs button i{font-style:normal;font-size:16px;opacity:.5}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:600}
.tabs button[aria-selected="true"] i{opacity:1}

.sheet{position:absolute;inset:0;background:rgba(34,48,63,.45);display:none;align-items:flex-end;z-index:20}
.sheet.open{display:flex}
.sheet-in{background:#fff;width:100%;border-radius:20px 20px 0 0;padding:18px 16px 22px;animation:up .26s ease}
@keyframes up{from{transform:translateY(50px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet-in{animation:none}}
.sheet h3{font-family:'Spectral',serif;font-size:16px;margin:0 0 4px;font-weight:600}
.parse{background:#F4F8FB;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.parse .to{display:flex;align-items:center;gap:8px;font-size:13px;padding:5px 0}
.parse .to em{font-style:normal;color:var(--mut);font-size:11px;margin-left:auto}
.note{max-width:600px;width:100%;margin-top:22px;font-size:13px;color:var(--mut);text-align:center}

/* ---- рабочая версия: формы, поля, всплывающие сообщения ---- */
html{overflow-x:hidden}
body{padding:0;background:var(--ground);display:block;overflow-x:hidden;width:100%}
.screen{overflow-x:hidden}
.card,.item,.parse,.daycard{max-width:100%}
.item .txt b,.item .txt small,.mut,.empty{overflow-wrap:anywhere}
.phone{width:100%;max-width:520px;height:auto;min-height:100vh;margin:0 auto;border:0;border-radius:0;box-shadow:none;background:var(--ground)}
.status{display:none}
.appbar{position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top))}
.screen{padding-bottom:150px}
.fab{position:fixed;right:max(16px,calc(50% - 230px));bottom:calc(80px + env(safe-area-inset-bottom))}
.tabs{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:520px;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom)}
.sheet{position:fixed}
.sheet-in{max-width:520px;margin:0 auto;max-height:88vh;overflow-y:auto;padding-bottom:calc(22px + env(safe-area-inset-bottom))}
.fld{margin-bottom:10px}
.fld label{display:block;font-size:11px;color:var(--mut);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea,input,textarea,select{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;
  font-family:'Golos Text',sans-serif;font-size:16px;background:#FBFDFE;color:var(--ink)
}
.fld textarea{resize:vertical;min-height:78px}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--accent);outline-offset:1px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{
  border:1px solid var(--line);background:#fff;border-radius:99px;padding:7px 12px;cursor:pointer;
  font-family:'Golos Text',sans-serif;font-size:13px;color:var(--ink)
}
.tick{width:26px;height:26px;flex:0 0 26px;border:1.5px solid var(--line);background:#fff;border-radius:50%;
  cursor:pointer;color:#fff;font-size:14px;line-height:1;padding:0}
.tick.on{background:var(--ok);border-color:var(--ok)}
.pick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;z-index:60;display:flex;flex-direction:column;gap:6px;width:min(480px,92%)}
.toast{background:var(--navy);color:#fff;border-radius:12px;padding:11px 14px;font-size:13px;box-shadow:0 10px 24px -12px rgba(40,66,92,.8)}
.empty{color:var(--mut);font-size:13px;padding:8px 0}
.del{border:0;background:transparent;color:var(--stop);font-size:12px;cursor:pointer;font-family:'Golos Text',sans-serif}
.backart{width:100%;aspect-ratio:100/160;border-radius:6px;background:var(--navy);
  border:1px solid rgba(176,131,71,.55);display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 10px -4px rgba(40,66,92,.5)}
.backart span{color:var(--ochre);font-size:26px;line-height:1}
.flip{animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(90deg);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.flip{animation:none}}
.withmic{display:flex;gap:7px;align-items:stretch}
.withmic input,.withmic textarea{flex:1}
.mic{flex:0 0 46px;border:1px solid var(--line);background:#fff;border-radius:11px;font-size:17px;cursor:pointer;color:var(--accent)}
.mic[data-on="1"]{background:var(--ochre);border-color:var(--ochre);color:#fff}
.camwrap{position:relative;margin:12px 0;border-radius:14px;overflow:hidden;background:var(--navy);aspect-ratio:4/3}
.camwrap video{width:100%;height:100%;object-fit:cover;display:block}
.camline{position:absolute;left:12%;right:12%;top:50%;height:2px;background:var(--ochre);box-shadow:0 0 10px var(--ochre)}
.warnbar{background:#F6E7E4;border:1px solid #E4C3BD;color:var(--stop);border-radius:12px;padding:9px 12px;font-size:12px;margin-bottom:12px}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span></span></div>
  <div class="appbar">
    <div>
      <h2>Точка дня</h2>
      <div class="sub" id="today-date"></div>
    </div>
    <div class="saved" id="saved"></div>
  </div>

  <section class="screen" id="s-today"></section>
  <section class="screen" id="s-cal" hidden></section>
  <section class="screen" id="s-money" hidden></section>
  <section class="screen" id="s-notes" hidden></section>
  <section class="screen" id="s-more" hidden></section>

  <button class="fab" id="dock-btn" title="Записать" onclick="openContext()" aria-label="Записать">✎</button>

  <nav class="tabs">
    <button aria-selected="true" onclick="go(this,'s-today')"><i>◉</i>Сегодня</button>
    <button aria-selected="false" onclick="go(this,'s-cal')"><i>▦</i>Календарь</button>
    <button aria-selected="false" onclick="go(this,'s-money')"><i>₽</i>Деньги</button>
    <button aria-selected="false" onclick="go(this,'s-notes')"><i>✎</i>Записи</button>
    <button aria-selected="false" onclick="go(this,'s-more')"><i>≡</i>Ещё</button>
  </nav>

  <div class="sheet" id="sheet" onclick="if(event.target.id==='sheet')closeSheet()">
    <div class="sheet-in" id="sheet-in"></div>
  </div>
  <div class="toasts" id="toasts"></div>
</div>
<script>
/* ================= Точка дня — рабочая версия =================
   Один файл. Данные хранятся в браузере телефона, никуда не отправляются.
   Семья приложениеов: Точка решения / Точка речи / Точка ответа / Точка красоты.
   ============================================================== */

const KEY = 'tochka-dnya-v1';
const CATS = ['Продукты','Кафе','Доставка','Дом','Красота','Транспорт','Здоровье','Одежда','Дети','Прочее'];
const SLOTS = [['b','Завтрак'],['l','Обед'],['s','Перекус'],['d','Ужин']];
const PLACES = [['home','дома'],['take','с собой'],['cafe','кафе'],['deliv','доставка']];
const REPEATS = [['none','Не повторять'],['year','Каждый год'],['month','Каждый месяц'],['week','Каждую неделю']];
const KINDS = [['plain','Дело'],['bd','День рождения'],['pay','Платёж'],['doc','Срок документа']];
const SLEEP = [['good','Выспалась'],['ok','Нормально'],['bad','Плохо'],['few','Мало спала']];
const MOODS = [['ok','Хорошо'],['flat','Ровно'],['tired','Устала'],['hard','Тяжело']];

const CURR = [['RUB','₽','Рубль'],['AZN','₼','Манат'],['KZT','₸','Тенге']];
function cur(){ return (CURR.find(c => c[0] === (S && S.settings && S.settings.cur)) || CURR[0]); }
function sign(){ return cur()[1]; }

let S = null, storageOk = true;

function blank(){
  return {
    settings:{income:0, save:0, budget:0, art:'web', cur:'RUB', notesTab:'note'},
    exp:[], inc:[], ev:[], meals:[], notes:[], dreams:[], day:{}, savedAt:null, backupAt:null
  };
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    S = raw ? JSON.parse(raw) : blank();
  }catch(e){ S = blank(); storageOk = false; }
  const b = blank();
  for (const k in b) if (S[k] === undefined) S[k] = b[k];
  for (const k in b.settings) if (S.settings[k] === undefined) S.settings[k] = b.settings[k];
}
function saveQuiet(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function save(){
  S.savedAt = new Date().toISOString();
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ storageOk = false; }
  renderAll();
}

/* ---------- вспомогательное ---------- */
function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function iso(d){ const x = d || new Date(); return new Date(x.getTime() - x.getTimezoneOffset()*60000).toISOString().slice(0,10); }
function today(){ return iso(new Date()); }
function money(n){ return (Math.round(n) || 0).toLocaleString('ru-RU') + ' ' + sign(); }
function num(n){ return (Math.round(n) || 0).toLocaleString('ru-RU'); }
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const MONTHS_N = ['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const WDAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
function humanDate(s){ const d = new Date(s + 'T12:00'); return d.getDate() + ' ' + MONTHS[d.getMonth()]; }
function monthOf(s){ return s.slice(0,7); }
function prevMonth(m){
  const [y,mm] = m.split('-').map(Number);
  return mm === 1 ? (y-1) + '-12' : y + '-' + String(mm-1).padStart(2,'0');
}
function daysInMonth(m){ const [y,mm] = m.split('-').map(Number); return new Date(y, mm, 0).getDate(); }
function plural(n,a,b,c){ n = Math.abs(n)%100; const d = n%10;
  if (n>10 && n<20) return c; if (d>1 && d<5) return b; if (d===1) return a; return c; }

function toast(t){
  const host = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = t;
  host.appendChild(el);
  setTimeout(() => el.remove(), 3600);
}

/* ---------- расчёты ---------- */
function expOf(m){ return S.exp.filter(e => monthOf(e.date) === m); }
function incOf(m){ return S.inc.filter(e => monthOf(e.date) === m); }
function sum(a){ return a.reduce((s,x) => s + (+x.sum || 0), 0); }
function spentMonth(m){ return sum(expOf(m)); }
function byCat(m){
  const r = {};
  expOf(m).forEach(e => { r[e.cat] = (r[e.cat] || 0) + (+e.sum || 0); });
  return Object.entries(r).sort((a,b) => b[1] - a[1]);
}
function budgetOf(){
  const s = S.settings;
  return s.income ? Math.max(0, s.income - (s.save || 0)) : 0;
}
function freeLeft(){ return budgetOf() - spentMonth(monthOf(today())); }
function daysLeft(){
  const t = new Date(), n = daysInMonth(monthOf(today()));
  return Math.max(1, n - t.getDate() + 1);
}
function mealsOf(d){ return S.meals.filter(x => x.date === d); }
function kcalOf(d){ return mealsOf(d).reduce((s,x) => s + (+x.kcal || 0), 0); }
function occursOn(e, d){
  if (e.date === d) return true;
  if (!e.repeat || e.repeat === 'none' || d < e.date) return false;

function parseSum(raw){
  // выражения времени вырезаем, иначе «в шесть» превращается в шесть рублей
  const text = String(raw)
    .replace(/\sв\s+\d{1,2}([:.]\d{2})?(\s+часов|\s+утра|\s+вечера|\s+дня)?/gi,' ')
    .replace(/\sв\s+(час|два|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать)(\s+часов|\s+утра|\s+вечера|\s+дня)?/gi,' ');
  const digits = text.match(/(\d[\d\s]{0,8})\s*(?:р|₽|руб|тыс)?/i);
  if (digits){
    let v = +digits[1].replace(/\s/g,'');
    if (/тыс/i.test(text) && v < 100) v *= 1000;
    if (v > 0) return v;
  }
  const keys = Object.keys(WORDNUM).sort((a,b) => b.length - a.length);
  let total = 0, part = 0, seen = false;
  text.toLowerCase().split(/[\s,]+/).forEach(w => {
    for (const k of keys){
      if (!w.startsWith(k)) continue;
      const v = WORDNUM[k];
      seen = true;
      if (v === 1000){ total += (part >= 1000 ? part / 1000 : (part || 1)) * 1000; part = 0; }
      else part += v;
      break;
    }
  });
  return seen ? total + part : null;
}
const HOURWORD = {'час':13,'один':1,'два':2,'три':3,'четыре':4,'пять':5,'шесть':6,'семь':7,'восемь':8,

function parseTime(text){
  const low = ' ' + String(text).toLowerCase() + ' ';
  const t = low.match(/(\d{1,2})[:.](\d{2})/);
  if (t) return String(+t[1]).padStart(2,'0') + ':' + t[2];
  if (/полдень/.test(low)) return '12:00';
  if (/полноч/.test(low)) return '00:00';
  const d = low.match(/\sв\s+(\d{1,2})\s*(?:час\w*|ч)?(?:\s+(утра|дня|вечера|ночи))?/);
  if (d && +d[1] <= 23){
    let h = +d[1];
    if (d[2] === 'вечера' && h < 12) h += 12;
    if (d[2] === 'дня' && h < 12 && h > 4) h += 12;
    return String(h).padStart(2,'0') + ':00';
  }
  // числительными: «в пятнадцать ноль ноль», «в десять тридцать», «в шесть вечера»
  const keys = Object.keys(HOURWORD).sort((a,b) => b.length - a.length);
  for (const k of keys){
    const re = new RegExp('\\s(?:в|на|к)\\s+' + k + '(?:\\s+(ноль ноль|тридцать|пятнадцать|сорок пять|десять|двадцать|сорок|пятьдесят|ровно))?(?:\\s+(утра|дня|вечера|ночи))?', 'i');
    const m = low.match(re);
    if (m){
      let h = HOURWORD[k];
      const mins = m[1] ? (MINWORD[m[1]] || 0) : 0;
      const part = m[2];
      if (part === 'вечера' && h < 12) h += 12;
      else if (part === 'ночи' && h < 6) h = h;
      else if (part === 'дня' && h < 12 && h > 4) h += 12;
      else if (!part && h >= 1 && h <= 8 && k !== 'час') h += 12;  // «в шесть» вечером привычнее
      return String(Math.min(23,h)).padStart(2,'0') + ':' + String(mins).padStart(2,'0');
    }
  }
  return null;
}

function parseDate(text){
  const low = ' ' + String(text).toLowerCase() + ' ';
  const rel = low.match(/через +([0-9]+|две|три|четыре|пять|неделю|месяц|полторы недели)? *(дн[еяй]\w*|недел\w*|месяц\w*)?/);
  if (rel && (rel[1] || rel[2])){
    const w = {'две':2,'три':3,'четыре':4,'пять':5}[rel[1]] || +rel[1] || 1;
    const unit = rel[2] || rel[1] || '';
    let days = 0;
    if (/недел/.test(unit)) days = w * 7;
    else if (/месяц/.test(unit)) days = w * 30;
    else if (/дн/.test(unit)) days = w;
    else if (rel[1] === 'неделю') days = 7;
    else if (rel[1] === 'месяц') days = 30;
    if (days) return iso(new Date(Date.now() + days*86400000));
  }
  if (/послезавтра/.test(low)) return iso(new Date(Date.now() + 2*86400000));
  if (/завтра/.test(low)) return iso(new Date(Date.now() + 86400000));
  // «24 сентября» или «двадцать четвёртого сентября»
  for (let mi = 0; mi < 12; mi++){
    if (!low.includes(MONTH_GEN[mi])) continue;
    let day = null;
    const dig = low.match(new RegExp('([0-9]{1,2}) +' + MONTH_GEN[mi]));
    if (dig) day = +dig[1];
    if (!day){
      // сначала составные: «двадцать четвёртого», «тридцать первого»
      const comp = low.match(new RegExp('(двадцать|тридцать) +(перв|втор|треть|четв[её]рт|пят|шест|седьм|восьм|девят)[а-яё]* +' + MONTH_GEN[mi]));
      if (comp){
        const base = comp[1] === 'двадцать' ? 20 : 30;
        const units = {'перв':1,'втор':2,'треть':3,'четв':4,'пят':5,'шест':6,'седьм':7,'восьм':8,'девят':9};
        for (const u in units) if (comp[2].startsWith(u)){ day = base + units[u]; break; }
      }
      if (!day){
        const keys = Object.keys(ORD).sort((a,b) => b.length - a.length);
        for (const k of keys)
          if (new RegExp('(?<!двадцать )(?<!тридцать )' + k + ' +' + MONTH_GEN[mi]).test(low)){ day = ORD[k]; break; }
      }
    }
    if (day){
      const now = new Date();
      let y = now.getFullYear();
      const cand = y + '-' + String(mi+1).padStart(2,'0') + '-' + String(day).padStart(2,'0');
      return cand < today() ? (y+1) + cand.slice(4) : cand;
    }
  }
  for (const w in WDAY_WORDS){
    if (low.includes(w)){
      const want = WDAY_WORDS[w], d = new Date();
      let add = (want - d.getDay() + 7) % 7;
      if (add === 0) add = 7;
      return iso(new Date(Date.now() + add*86400000));
    }
  }
  return today();
}

      if (d === today() && !/сегодня/i.test(low) && lastDate) d = lastDate;
      if (d !== today()) lastDate = d;
      out.ev.push({date:d, time:tm, title:clean(part) || 'Событие',
                   plan: realMoney ? money : null});
      return;
    }
    const sleepWord = /(спалось|спала|спал|сон|поспала)/i.test(low);
    const sleepQual = low.match(/(хорошо|нормально|отлично|плохо|ужасно|так себе|мало|нормас)/);
    if ((sleepWord && sleepQual) || /выспалась|не выспалась|не спала/i.test(low)){
      const w = sleepQual ? sleepQual[1] : (/не выспалась|не спала/i.test(low) ? 'плохо' : 'хорошо');
      out.sleep = /хорошо|отлично|выспалась/.test(w) ? 'good'
                : /нормально|так себе/.test(w) ? 'ok'
                : /мало/.test(w) ? 'few' : 'bad';
      return;
    }
    if (!money && isShoppingList(part)){
      out.notes.push(tidy(part.replace(/\bкупила\b/i,'купить').replace(/\bкупил\b/i,'купить')));
      return;
    }
    if (money && isIncome){ out.inc.push({title:clean(part) || 'Доход', sum:money, src:'голосом'}); return; }
    if (money){
      const items = splitItems(part);
      if (items && /чек|магазин|куплен|купила|потратила|в том числе/i.test(low)){
        // первая сумма — общая по чеку, остальные позиции уходят в заметку как состав
        const nums = items.map(x => +(x.match(/\d+/) || [0])[0]);
        const total = Math.max(...nums);
        const rest = items.filter(x => +(x.match(/\d+/) || [0])[0] !== total);
        const c = pickCat(part);
        out.exp.push({cat:c, title:clean(items[0]) || c, sum:total, src:'голосом'});
        if (rest.length) out.notes.push(tidy('В чеке на ' + total + ': ' + rest.join(', ')));
        return;
      }
      const c = pickCat(part);
      out.exp.push({cat:c, title:clean(part) || c, sum:money, src:'голосом'});
      return;
    }
    if (!/^(запиши|запишите|пожалуйста|напиши|напомни|отметь|мне|меня|чтобы я?|ну|вот|и|а|это самое|короче)[.,]?$/i.test(part.trim()))
      out.rest.push(part);
  });
  (out.receipts || []).forEach(r => {
    if (r.items.length) out.notes.push(tidy('В чеке на ' + r.sum + ': ' + r.items.join(', ')));
  });
  delete out.receipts;
  return out;
}

/* ---------- оформление надиктованного текста ----------
   Диктовка на телефоне не ставит знаков препинания. Здесь текст доводится
   до читаемого вида: заглавная буква, запятые в перечислениях и перед
   «потом», «затем», «а», «но», точка в конце длинной фразы. */
const NUMWORDS = 'ноль|один|одна|одну|два|две|три|четыре|пять|шесть|семь|восемь|девять|десять|одиннадцать|двенадцать|полтора|полторы';
const PREPS = 'в|во|на|за|с|со|из|от|до|к|по|при|про|для|у|о|об|над|под|около|через';
function tidy(t){
  if (!t) return '';
  let s = String(t).replace(/\s+/g,' ').trim();
  // запятая перед словами-связками
  s = s.replace(new RegExp('\\s(потом|затем|после этого|а также|плюс|а|но|однако|зато)\\s','gi'), ', $1 ');
  // запятая перед «и ещё», «ещё»
  s = s.replace(/\s(и ещё|и еще|ещё|еще)\s/gi, ', $1 ');
  // запятая перед числом, если это новый пункт перечисления
  s = s.replace(new RegExp('(?<!^)(?<!,)\\s(?<!(?:' + PREPS + ')\\s)((?:' + NUMWORDS + '|\\d+)\\s+[а-яё]{3,})','gi'), ', $1');
  // чистим сдвоенные знаки и пробелы перед ними
  s = s.replace(/\s*,\s*,+/g, ', ').replace(/\s+,/g, ',').replace(/,\s*$/,'').replace(/\s{2,}/g,' ').trim();
  if (!s) return '';
  s = s.charAt(0).toUpperCase() + s.slice(1);
  // точка в конце — только у длинных фраз, чтобы короткие названия не выглядели странно
  const words = s.split(' ').length;
  if ((words >= 5 || s.includes(',')) && !/[.!?…]$/.test(s)) s += '.';
  return s;
}

function clean(t){
  let s = ' ' + String(t).trim() + ' ';
  const cut = (re) => { s = s.replace(re, ' '); };
  cut(/ (ко мне|у меня|мне|меня|нам|нас|мы|я|мо[йяею]|мои|наш[аи]?) /gi);
  cut(new RegExp(' (перв|втор|треть|четв[ёе]рт|пят|шест|седьм|восьм|девят|десят|одиннадцат|двенадцат|двадцат|тридцат)[а-яё]*о?го ', 'gi'));
  cut(/ (двадцать|тридцать) /gi);
  cut(new RegExp(' (' + MONTH_GEN.join('|') + ') ', 'gi'));
  s = s.replace(/[0-9]{1,2}[:.][0-9]{2}/g,' ');
  cut(/ (ноль ноль|ровно) /gi);
  cut(/ (в|во|на|к) +[0-9]{1,2} /gi);
  cut(new RegExp(' (в|во|на|к) +(' + Object.keys(HOURWORD).join('|') + ')( +(утра|дня|вечера|ночи|часов|часа))? ', 'gi'));
  cut(/ (утра|дня|вечера|ночи|часов|часа) /gi);
  cut(/ (во сколько|за день|нужно напоминание|напоминание)[^,.]* /gi);
  cut(/ (потратила|потратил|заплатила|заплатил|купила|купил|съела|съел|поела|поел|позавтракала|пообедала|поужинала|записалась|записался|получила|получил|пришло|перевели|надо|нужно) /gi);
  cut(/ (в|во|на|за|до|к|с) +(понедельник|вторник|среду|четверг|пятницу|субботу|воскресенье|завтра|послезавтра) /gi);
  cut(/ (завтра|послезавтра|сегодня|утром|днём|днем|вечером) /gi);
  cut(/ через +([0-9]+|две|три|четыре|пять)? *(дн[еяй][а-яё]*|недел[а-яё]*|месяц[а-яё]*)? /gi);
  cut(/^ *(и|а|ну|вот) /gi);
  cut(/ [0-9][0-9 ]*(руб[а-яё]*|₽|тысяч[а-яё]*)? /gi);
  cut(/ на [0-9]+ /gi);
  cut(new RegExp(' (' + Object.keys(WORDNUM).join('|') + ') ', 'gi'));
  s = s.replace(/ {2,}/g,' ').trim();
  s = s.replace(/^(в|во|на|за|про|до|к|и|а|с|у)\s+/i,'').trim();
  for (let n = 0; n < 3; n++)
    s = s.replace(/[\s,]+(в|во|на|за|про|до|к|и|а|с|у|вечером|утром|днём|днем|ночью|за день|во сколько)[.,]?$/i,'').trim();
  s = s.replace(/[\s,]+(что|чтобы|когда|где|как|о том)$/i,'').trim();
  s = s.replace(/[\s,.;]+$/,'').replace(/^[\s,.;]+/,'').trim();
  if (s.length < 2) return '';
  return tidy(s.charAt(0).toUpperCase() + s.slice(1));
}

  return '<circle cx="0" cy="0" r="6.8"/><path d="M0 -4.6 L2.7 3.72 L-4.37 -1.42 H4.37 L-2.7 3.72 Z"/>';
}

function cardArtDrawn(cardId, rev){
  const c = CARD_BY_ID[cardId];
  const frame =
    '<rect x="1.2" y="1.2" width="97.6" height="157.6" rx="7" fill="#FBF6EE" stroke="#D8C5A4" stroke-width="1.6"/>'+
    '<rect x="6" y="6" width="88" height="148" rx="4" fill="none" stroke="#E2D2B6" stroke-width="0.9"/>';
  if (!c){
    return '<svg class="art" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Пустое место">'+
      '<rect x="1.2" y="1.2" width="97.6" height="157.6" rx="7" fill="none" stroke="#C9D4E0" stroke-width="1.6" stroke-dasharray="5 4"/>'+
      '<path d="M50 66 V94 M36 80 H64" stroke="#B7C4D2" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>';
  }
  let body = '';
  if (c.major){
    body = '<text x="50" y="27" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="13" fill="'+MAJ_INK+'">'+ROMAN[c.num]+'</text>'+
      '<g transform="translate(50,88) scale(1.85)" stroke="'+MAJ_LINE+'" stroke-width="1.05" fill="none" stroke-linecap="round" stroke-linejoin="round">'+
      MAJ_ART[c.num]+'</g>'+
      '<path d="M32 140 H68" stroke="'+MAJ_LINE+'" stroke-width="0.9" opacity=".6"/>';
  } else {
    const col = SUIT_COLOR[c.suit], g = suitGlyph(c.suit);
    if (c.num <= 10){
      const pts = PIPS[c.num];
      const k = c.num === 1 ? 2.3 : (c.num <= 3 ? 1.15 : (c.num <= 6 ? 0.98 : (c.num <= 8 ? 0.84 : 0.76)));
      const base = c.num === 1 ? 2.4 : 1.7;
      body = '<g stroke="'+col+'" stroke-width="'+(base/k).toFixed(2)+'" fill="none" stroke-linecap="round" stroke-linejoin="round">'+
        pts.map(function(p){ return '<g transform="translate('+p[0]+','+p[1]+') scale('+k+')">'+g+'</g>'; }).join('')+'</g>'+
        (c.num === 1 ? '' : '<text x="50" y="21" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="12" fill="'+col+'">'+c.num+'</text>');
    } else {
      body = '<g transform="translate(50,46)" stroke="'+col+'" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">'+
        COURT_MARK[c.num]+'</g>'+
        '<g transform="translate(50,102) scale(2.1)" stroke="'+col+'" stroke-width="0.85" fill="none" stroke-linecap="round" stroke-linejoin="round">'+
        g+'</g>';
    }
  }
  return '<svg class="art" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="'+esc(c.n)+'">'+
    frame + '<g transform="rotate('+(rev?180:0)+' 50 80)">'+body+'</g>'+
    (rev ? '<path d="M88 12 v8 m-3 -3 l3 3 l3 -3" stroke="#C08463" stroke-width="1.4" fill="none" stroke-linecap="round"/>' : '')+
    '</svg>';
}

/* ---------- настоящие карты Уэйта ----------
   Колода Райдера—Уэйта—Смит (1909) — общественное достояние.
   Берётся из папки cards рядом с приложениеом (офлайн) либо с Викисклада.
   Если картинка не загрузилась — на её место встаёт рисунок приложения. */
const RWS_MAJOR = ['RWS_Tarot_00_Fool','RWS_Tarot_01_Magician','RWS_Tarot_02_High_Priestess','RWS_Tarot_03_Empress',
'RWS_Tarot_04_Emperor','RWS_Tarot_05_Hierophant','RWS_Tarot_06_Lovers','RWS_Tarot_07_Chariot','RWS_Tarot_08_Strength',
'RWS_Tarot_09_Hermit','RWS_Tarot_10_Wheel_of_Fortune','RWS_Tarot_11_Justice','RWS_Tarot_12_Hanged_Man','RWS_Tarot_13_Death',
'RWS_Tarot_14_Temperance','RWS_Tarot_15_Devil','RWS_Tarot_16_Tower','RWS_Tarot_17_Star','RWS_Tarot_18_Moon',
'RWS_Tarot_19_Sun','RWS_Tarot_20_Judgement','RWS_Tarot_21_World'];
const RWS_SUIT = {w:'Wands', c:'Cups', s:'Swords', p:'Pents'};
function pad2(n){ return String(n).padStart(2,'0'); }
function cardFile(c){ return (c.major ? RWS_MAJOR[c.num] : RWS_SUIT[c.suit] + pad2(c.num)) + '.jpg'; }
/* 'web' — с Викисклада, 'local' — из папки cards рядом, 'draw' — рисунок приложения */
function cardImgUrl(cardId){
  const c = CARD_BY_ID[cardId]; if (!c || ART_MODE === 'draw') return null;
  if (ART_MODE === 'local') return 'cards/' + cardFile(c);
  return 'https://commons.wikimedia.org/wiki/Special:FilePath/' + encodeURIComponent(cardFile(c)) + '?width=420';
}
function artFail(img){
  const box = img.parentNode; if (!box || !box.getAttribute) return;
  const id = box.getAttribute('data-card');
  ART_FAILED = true;
  box.outerHTML = cardArtDrawn(id, false);
  const note = document.getElementById('art-note');
  if (note) note.style.display = 'block';
}
let ART_FAILED = false;
function cardArt(cardId){
  const url = cardImgUrl(cardId);
  if (!url) return cardArtDrawn(cardId, false);
  const c = CARD_BY_ID[cardId];
  return '<div class="artbox" data-card="' + cardId + '">' +
    '<img class="art" alt="' + esc(c.n) + '" src="' + url + '" onerror="artFail(this)"></div>';
}

/* ================= Экраны ================= */

/* кнопка внизу знает, в каком вы разделе: в календаре пишет событие,
   в деньгах — трату, в записях — заметку. Разбирать длинную фразу
   целиком приходится только на «Сегодня», и там об этом сказано прямо. */
const DOCK = {
  's-today': ['Расскажите про день — разложу по разделам', 'openSheet(\'voice\')'],
  's-cal':   ['Событие: что и когда', 'openSheet(\'ev\')'],
  's-money': ['Трата или доход', 'openSheet(\'exp\')'],
  's-notes': ['Заметка или сон', 'focusNote()'],
  's-more':  ['Расскажите свободно', 'openSheet(\'voice\')']
};
let curScreen = 's-today';
function openContext(){
  const a = (DOCK[curScreen] || DOCK['s-today'])[1];
  new Function(a)();
}
function focusNote(){
  const el = document.getElementById('n-text');
  if (el){ el.focus(); el.scrollIntoView({block:'center'}); }
  else openSheet('voice');
}
function go(btn, id){
  curScreen = id;
  const b = document.getElementById('dock-btn');
  if (b) b.title = (DOCK[id] || DOCK['s-today'])[0];
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected','false'));
  btn.setAttribute('aria-selected','true');
  document.querySelectorAll('.screen').forEach(s => s.hidden = s.id !== id);
  window.scrollTo(0,0);
}
function bar(pct, color){
  return '<div class="bar"><i style="width:' + Math.max(0, Math.min(100, pct)) + '%;background:' + (color || 'var(--accent)') + '"></i></div>';
}
function card(inner, cls){ return '<div class="card' + (cls ? ' ' + cls : '') + '">' + inner + '</div>'; }
function lab(t){ return '<div class="lab">' + esc(t) + '</div>'; }

function renderAll(){
  const d = new Date();
  document.getElementById('today-date').textContent =
    WDAYS[d.getDay()].charAt(0).toUpperCase() + WDAYS[d.getDay()].slice(1) + ', ' + humanDate(today());
  document.getElementById('saved').textContent = storageOk ? '' : 'НЕ СОХРАНЯЕТСЯ';
  renderToday(); renderCal(); renderMoney(); renderNotes(); renderMore();
}

/* ---------- Сегодня ---------- */
function renderToday(){
  const d = today(), rec = dayRec(d), free = freeLeft(), perDay = free / daysLeft();
  const spentPct = budgetOf() ? spentMonth(monthOf(d)) / budgetOf() * 100 : 0;
  let h = '';

  if (!storageOk) h += '<div class="warnbar">Браузер не сохраняет данные. Проверьте, не открыт ли режим инкогнито.</div>';

  if (!S.settings.hi){
    h += card('<div style="font-size:14px;margin-bottom:10px">Говорите — кнопка внизу запишет. В календаре она пишет событие, ' +
      'в деньгах трату, в записях мысль.</div>' +
      '<div class="row" style="gap:8px">' +
      '<button class="btn ghost" style="flex:1" onclick="hideHi()">Понятно</button>' +
      '<button class="btn" style="flex:1" onclick="openSheet(\'hi\')">Подробнее</button></div>');
  }
  const nx = nextEvent();
  h += card(
    '<div class="row" style="align-items:flex-start"><div>' + lab('Ближайшее событие') +
    (nx && !nx.far
      ? '<div style="font-family:\'Spectral\',serif;font-size:18px;font-weight:600">' + esc(nx.e.title) + '</div>' +
        '<div class="mut" style="margin-top:3px">' + (nx.e.time ? esc(nx.e.time) + ' · ' : '') + esc(nx.when) + '</div>'
      : nx && nx.far
        ? '<div class="mut">На ближайшую неделю ничего не назначено.</div>' +
          '<div class="mut" style="margin-top:5px;font-size:11px">Следующее — «' + esc(nx.e.title) + '», ' + esc(nx.when) +
          '. Напомню ближе к дате.</div>'
        : '<div class="mut">Ничего не назначено. Добавьте встречу или напоминание.</div>') +
    '</div><button class="chip" onclick="go(document.querySelector(\'.tabs button:nth-child(2)\'),\'s-cal\')">Календарь →</button></div>', (nx && !nx.far) ? 'now' : '');

  h += dayCardHtml();

  h += '<div class="grid2">' +
    '<div class="card tap" onclick="go(document.querySelector(\'.tabs button:nth-child(3)\'),\'s-money\')">' +
      lab('Деньги →') +
      (budgetOf()
        ? '<div class="big" style="font-size:20px">' + money(free) + '</div>' +
          '<div class="mut">осталось до конца месяца</div>' + bar(spentPct, 'var(--ochre)') +
          '<div class="mut" style="margin-top:7px;font-size:11px">по ' + money(perDay) + ' в день на ' +
            daysLeft() + ' ' + plural(daysLeft(),'день','дня','дней') + '</div>'
        : '<div class="big" style="font-size:20px">' + money(spentMonth(monthOf(d))) + '</div>' +
          '<div class="mut">потрачено в этом месяце</div>' +
          '<div class="mut" style="margin-top:7px;font-size:11px">Укажите доход в «Ещё» — посчитаю остаток</div>') +
      '</div>' +
    '<div class="card tap" onclick="go(document.querySelector(\'.tabs button:nth-child(4)\'),\'s-notes\')">' +
      lab('Записи →') + '<div class="big" style="font-size:20px">' + (S.notes.length + S.dreams.length) + '</div>' +
      '<div class="mut">заметок и снов</div>' +
      bar(Math.min(100,(S.notes.length + S.dreams.length) * 8), 'var(--ok)') + '</div>' +
  '</div>';

  const ev = evOf(d);
  h += card(lab('Назначено на сегодня') +
    (ev.length ? ev.map(e => {
        const done = (rec.done || []).includes(e.id);
        return '<div class="tl' + (done ? ' done' : ' next') + '"><div class="tl-dot"></div>' +
          '<div class="tl-time">' + esc(e.time || '—') + '</div>' +
          '<div class="row"><span class="tl-what"' + (done ? ' style="text-decoration:line-through;color:var(--mut)"' : '') + '>' +
          esc(e.title) + '</span>' +
          '<button class="tick' + (done ? ' on' : '') + '" onclick="toggleDone(\'' + e.id + '\')" title="Сделано">' +
          (done ? '✓' : '') + '</button></div></div>';
      }).join('')
      : '<div class="empty">На сегодня ничего не назначено. Скажите «завтра врач в десять» — попадёт в календарь.</div>') +
    '<button class="btn ghost" style="margin-top:10px" onclick="openSheet(\'ev\')">Добавить событие</button>');

  const te = S.exp.filter(x => x.date === d);
  const evDone = (rec.done || []).length;
  const evening = new Date().getHours() >= 18;
  h += card(lab('Как идёт день') +
    '<div class="stat"><span>Дела</span><b>' +
      (ev.length ? (evDone ? evDone + ' из ' + ev.length + ' сделано'
                           : 'впереди ' + ev.length + ' ' + plural(ev.length,'дело','дела','дел')) : '—') + '</b></div>' +
    '<div class="stat"><span>Потрачено</span><b>' + (te.length ? money(sum(te)) : '—') + '</b></div>' +
    '<div class="stat"><span>Сон</span><b>' + (rec.sleep ? (SLEEP.find(x => x[0] === rec.sleep)||['','—'])[1] : 'не отмечен') + '</b></div>' +
    (te.length ? '<div class="mut" style="margin-top:8px">' + esc(te.map(x => x.title).slice(0,4).join(', ')) + '</div>' : '') +
    (evening || rec.mood ? '<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">' +
      '<div style="font-size:13px;margin-bottom:8px">Как вы себя чувствуете?</div>' +
      '<div class="pick">' + MOODS.map(m =>
        '<button aria-pressed="' + (rec.mood === m[0]) + '" onclick="setMood(\'' + m[0] + '\')">' + m[1] + '</button>').join('') +
      '</div></div>' : ''));

  const records = S.exp.length + S.ev.length + S.notes.length + S.dreams.length;
  const sinceBackup = S.backupAt ? Math.floor((Date.now() - new Date(S.backupAt)) / 86400000) : 99;
  if (records >= 12 && sinceBackup > 7)
    h += '<div class="tip" style="cursor:pointer" onclick="openSheet(\'backup\')">Давно не делали копию данных →</div>';

  const td = todo();
  if (td.length) h += card(lab('Нужно отметить') + td.map(t =>
    '<div class="item"' + (t[3] ? ' onclick="' + t[3] + '" style="cursor:pointer"' : '') + '><div class="ic">' + t[0] + '</div>' +
    '<div class="txt"><b>' + esc(t[1]) + '</b><small>' + esc(t[2]) + '</small></div></div>').join(''));

  document.getElementById('s-today').innerHTML = h;
}
function toggleDone(id){
  const r = dayRec(today());
  r.done = r.done || [];
  const i = r.done.indexOf(id);
  if (i >= 0) r.done.splice(i,1); else r.done.push(id);
  save();
}
function hideHi(){ S.settings.hi = 1; save(); }
function setMood(v){ dayRec(today()).mood = v; save(); }
function addPlace(pl){
  S.meals.push({id:uid(), date:today(), place:pl, slot:'l', title:(PLACES.find(x=>x[0]===pl)||['','—'])[1]});
  save(); toast('Отмечено');
}

/* ---------- Календарь ---------- */
let calMonth = monthOf(today());
function renderCal(){
  const [y, mm] = calMonth.split('-').map(Number);
  const first = new Date(y, mm-1, 1), shift = (first.getDay() + 6) % 7, n = daysInMonth(calMonth);
  let cells = '';
  for (let i = 0; i < shift; i++) cells += '<div class="d out"></div>';
  for (let i = 1; i <= n; i++){
    const ds = calMonth + '-' + String(i).padStart(2,'0');
    const marks = [];
    if (S.ev.some(e => occursOn(e, ds))) marks.push('var(--accent)');
    if (S.exp.some(e => e.date === ds) || S.inc.some(e => e.date === ds)) marks.push('var(--ok)');
    cells += '<div class="d' + (ds === today() ? ' today' : '') + '" onclick="pickDay(\'' + ds + '\')">' + i +
      (marks.length ? '<span class="mk">' + marks.map(c => '<i style="background:' + (ds === today() ? '#fff' : c) + '"></i>').join('') + '</span>' : '') +
      '</div>';
  }
  const sel = selDay || today();
  const list = evOf(sel);
  document.getElementById('s-cal').innerHTML =
    card('<div class="row" style="margin-bottom:10px"><span style="font-family:\'Spectral\',serif;font-size:15px;font-weight:600">' +
      MONTHS_N[mm-1] + ' ' + y + '</span><span class="mut"><button class="del" style="color:var(--accent)" onclick="shiftMonth(-1)">‹</button> ' +
      '<button class="del" style="color:var(--accent)" onclick="shiftMonth(1)">›</button></span></div>' +
      '<div class="cal"><div class="dw">пн</div><div class="dw">вт</div><div class="dw">ср</div><div class="dw">чт</div><div class="dw">пт</div><div class="dw">сб</div><div class="dw">вс</div>' +
      cells + '</div>' +
      '<div class="legend" style="margin-top:12px"><span><i class="dot" style="background:var(--accent)"></i>Встречи и дела</span>' +
      '<span><i class="dot" style="background:var(--ok)"></i>Деньги</span></div>') +
    card(lab(humanDate(sel)) +
      (list.length ? list.map(e =>
        '<div class="item"><div class="ic">📅</div><div class="txt"><b>' + esc(e.title) + '</b>' +
        '<small>' + (e.time ? esc(e.time) : 'без времени') + (e.plan ? ' · ' + money(e.plan) : '') + '</small></div>' +

/* ---------- отправка события в календарь телефона ----------
   Приложение в браузере не может присылать уведомления сам — для этого нужен
   сервер. Поэтому событие уходит файлом в родной календарь телефона,
   и напоминает уже он: за сутки и за два часа. */
function icsDate(d, t){
  const [y,m,dd] = d.split('-');
  if (!t) return y+m+dd;
  return y+m+dd+'T'+t.replace(':','')+'00';
}
function eventICS(e){
  const allDay = !e.time;
  const start = icsDate(e.date, e.time);
  const end = e.time ? icsDate(e.date, String(Math.min(23, +e.time.slice(0,2)+1)).padStart(2,'0') + e.time.slice(2)) : start;
  const rule = e.repeat === 'year' ? 'RRULE:FREQ=YEARLY\r\n'
             : e.repeat === 'month' ? 'RRULE:FREQ=MONTHLY\r\n'
             : e.repeat === 'week' ? 'RRULE:FREQ=WEEKLY\r\n' : '';
  const alarm = (mins, txt) =>
    'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:' + txt + '\r\nTRIGGER:-PT' + mins + 'M\r\nEND:VALARM\r\n';
  return 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Точка дня//RU\r\nCALSCALE:GREGORIAN\r\n' +
    'BEGIN:VEVENT\r\nUID:' + e.id + '@tochka-dnya\r\n' +
    'DTSTAMP:' + icsDate(today(), '00:00') + 'Z\r\n' +
    (allDay ? 'DTSTART;VALUE=DATE:' + start + '\r\nDTEND;VALUE=DATE:' + start + '\r\n'
            : 'DTSTART:' + start + '\r\nDTEND:' + end + '\r\n') +
    rule +
    'SUMMARY:' + String(e.title).replace(/[,;]/g,' ') + '\r\n' +
    (e.plan ? 'DESCRIPTION:Планируемый расход ' + e.plan + '\r\n' : '') +
    alarm(1440, 'Завтра: ' + String(e.title).replace(/[,;]/g,' ')) +
    (e.time ? alarm(120, 'Через два часа') : '') +
    'END:VEVENT\r\nEND:VCALENDAR\r\n';
}
async function toPhoneCalendar(id){
  const e = S.ev.find(x => x.id === id);
  if (!e) return;
  const file = new File([eventICS(e)], 'sobytie.ics', {type:'text/calendar'});
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file], title:e.title}); toast('Откройте файл — событие добавится в календарь телефона'); return; }
    catch(err){ if (err && err.name === 'AbortError') return; }
  }
  const url = URL.createObjectURL(file);
  const a = document.createElement('a'); a.href = url; a.download = 'sobytie.ics'; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast('Файл сохранён — откройте его, событие добавится в календарь с напоминанием');
}

/* что повторяется в снах — считается из её же записей, без толкований */
function dreamHint(){
  const stop = new Set(['и','в','на','с','а','но','что','как','это','мне','меня','был','была','было','были',
    'сне','сон','снилось','снился','снилась','очень','потом','когда','где','там','тут','его','её','ее','они','мы','я','ты','он','она','не','по','из','за','то','же','бы','уже','ещё','еще']);
  const freq = {};
  S.dreams.forEach(d => (d.text || '').toLowerCase().split(/[^а-яё]+/).forEach(w => {
    if (w.length > 3 && !stop.has(w)) freq[w] = (freq[w] || 0) + 1;
  }));
  const top = Object.entries(freq).filter(x => x[1] > 1).sort((a,b) => b[1] - a[1]).slice(0,3);
  if (!top.length) return '<div class="mut">Записей пока мало для наблюдений. Продолжайте — через пару недель здесь появится то, что повторяется.</div>';
  return '<div style="font-size:14px">В ' + S.dreams.length + ' ' + plural(S.dreams.length,'записи','записях','записях') +
    ' чаще всего повторяется: ' + top.map(t => esc(t[0]) + ' (' + t[1] + ')').join(', ') + '.</div>' +
    '<div class="mut" style="margin-top:7px">Это просто подсчёт слов из ваших записей. Никаких толкований.</div>';
}

let parsed = null;
function doParse(){
  const text = val('f-speech');
  if (!text){ toast('Сначала надиктуйте или впишите текст'); return; }
  parsed = parseSpeech(text);
  const line = (ic, t, where) => '<div class="to">' + ic + ' <span>' + esc(t) + '</span><em>' + where + '</em></div>';
  let rows = '';
  parsed.exp.forEach(e => rows += line('💸', e.title + ' · ' + money(e.sum) + ' · ' + e.cat, 'Деньги'));
  parsed.inc.forEach(e => rows += line('💰', e.title + ' · ' + money(e.sum), 'Доход'));
  parsed.meals.forEach(e => rows += line('🍽', e.title + ' · ' + (PLACES.find(p => p[0] === e.place)||['','—'])[1], 'Еда'));
  parsed.ev.forEach(e => rows += line('📅', e.title + ' · ' + humanDate(e.date) + (e.time ? ', ' + e.time : ''), 'Календарь'));
  parsed.notes.forEach(t => rows += line('✎', t, 'Заметки'));
  if (parsed.sleep) rows += line('☾', (SLEEP.find(x => x[0] === parsed.sleep)||['','—'])[1], 'Сон');
  const nothing = !rows;
  document.getElementById('sheet-in').innerHTML =
    '<h3>Разложено</h3>' +
    (nothing ? '<div class="mut">Не удалось ничего распознать. Попробуйте назвать сумму или время: «потратила 800 на продукты».</div>'
      : '<div class="parse">' + rows + '</div>') +
    (parsed.rest.length ? '<div class="card" style="margin:0"><div class="lab">Не разобрано</div><div class="mut">' +
        esc(parsed.rest.join('. ')) + '</div></div>' : '') +
    (nothing ? '' : '<button class="btn" style="margin-top:12px" onclick="applyParse()">Записать</button>') +
    (parsed.rest.length ? '<button class="btn ghost" style="margin-top:8px" onclick="restToNote()">Остаток — в заметки</button>' : '') +
    '<button class="btn ghost" style="margin-top:8px" onclick="openSheet(\'voice\')">Сказать заново</button>';
}
function restToNote(){
  if (!parsed || !parsed.rest.length) return;
  S.notes.push({id:uid(), date:today(), text:tidy(parsed.rest.join('. '))});
  parsed.rest = [];
  save(); closeSheet(); toast('Сохранено в заметки — ничего не потерялось');
}
function applyParse(){
  if (!parsed) return;
  parsed.exp.forEach(e => S.exp.push(Object.assign({id:uid(), date:today()}, e)));
  parsed.inc.forEach(e => S.inc.push(Object.assign({id:uid(), date:today()}, e)));
  parsed.meals.forEach(e => S.meals.push(Object.assign({id:uid(), date:today()}, e)));
  parsed.ev.forEach(e => S.ev.push(Object.assign({id:uid()}, e)));
  parsed.notes.forEach(t => S.notes.push({id:uid(), date:today(), text:t}));
  if (parsed.sleep) dayRec(today()).sleep = parsed.sleep;
  save(); closeSheet(); toast('Записано');
  parsed = null;
}

function backupBlob(){
  const data = JSON.stringify({app:'tochka-dnya', v:1, at:new Date().toISOString(), data:S}, null, 1);
  return new File([data], 'tochka-dnya-' + today() + '.json', {type:'application/json'});
}
function markBackup(){ S.backupAt = new Date().toISOString(); save(); }
async function sendBackup(){
  const file = backupBlob();
  if (navigator.canShare && navigator.canShare({files:[file]})){
    try{
      await navigator.share({files:[file], title:'Копия «Точки дня»'});
      markBackup(); closeSheet(); toast('Копия отправлена');
      return;
    }catch(e){ if (e && e.name === 'AbortError') return; }
  }
  downloadBackup();
  toast('Отправка недоступна — файл сохранён, перешлите его себе вручную');
}
function downloadBackup(){
  const file = backupBlob();
  const url = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = url; a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
  markBackup(); closeSheet(); toast('Копия сохранена');
}
function restoreFile(input){
  const f = input.files && input.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const o = JSON.parse(r.result);
      const d = o && o.data ? o.data : o;
      if (!d || !Array.isArray(d.exp)) throw 0;
      S = d; save(); toast('Копия загружена — все записи на месте');
    }catch(e){ toast('Это не похоже на копию «Точки дня»'); }
  };
  r.readAsText(f);
  input.value = '';
}
function shareApp(){
  const url = location.href.split('#')[0];
  if (navigator.share) navigator.share({title:'Точка дня', text:'Приложение для денег, еды и планов', url}).catch(()=>{});
  else { navigator.clipboard && navigator.clipboard.writeText(url); toast('Ссылка скопирована'); }
}

/* ---------- карта дня ---------- */
function cardOfDay(d){
  const key = iso(d || new Date());
  let h = 2166136261;
  for (let i = 0; i < key.length; i++){ h ^= key.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  h ^= h >>> 13; h = Math.imul(h, 2246822507) >>> 0; h ^= h >>> 16;
  return DECK[(h >>> 0) % DECK.length];
}

      '<div class="pick"><button aria-pressed="' + (rec.card === 'hit') + '" onclick="markCard(\'hit\')">Совпало</button>' +
      '<button aria-pressed="' + (rec.card === 'miss') + '" onclick="markCard(\'miss\')">Мимо</button></div></div>' +
    '<div class="mut" style="margin-top:9px;font-size:11px">Для настроения. Завтра будет новая карта.</div></div>';
}
function openDayCard(){
  const rec = dayRec(today());
  rec.opened = new Date().toISOString();
  rec.justOpened = true;
  save();
  setTimeout(() => { const r = dayRec(today()); delete r.justOpened; }, 600);
}
function markCard(v){ dayRec(today()).card = v; save(); }
function setSleep(v){ dayRec(today()).sleep = v; save(); }
function openAdvice(){
  const c = cardOfDay(), e = EXT[c.id];
  document.getElementById('sheet-in').innerHTML =
    '<h3>' + esc(c.n) + '</h3><div class="mut">Карта дня</div>' +

    (e && e[3] ? '<div class="mut" style="margin-top:12px">Совет</div>' +
      '<div style="font-size:14px;margin-top:4px">' + esc(e[3]) + '</div>' : '') +
    '<button class="btn" style="margin-top:14px" onclick="closeSheet()">Закрыть</button>';
  document.getElementById('sheet').classList.add('open');
}


/* ================= Голосовое заполнение полей =================
   Встроенное распознавание речи есть в Chrome и требует открытия приложения
   по адресу в сети (не файлом с диска). Где его нет — подсказываем диктовку
   с клавиатуры телефона: результат тот же, надёжность выше. */
function isIOS(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
  (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
/* на айфоне распознавание речи Apple отдаёт только своей клавиатуре,
   поэтому кнопка не притворяется микрофоном, а открывает клавиатуру */
function micOn(){ return !isIOS() && !!(window.SpeechRecognition || window.webkitSpeechRecognition); }
function inFrame(){ try{ return window.self !== window.top; }catch(e){ return true; } }
function secureOrigin(){ return location.protocol === 'https:' || location.hostname === 'localhost'; }
function micWhyNot(){
  if (isIOS()) return 'На айфоне диктует клавиатура: нажмите поле, затем микрофон на клавиатуре.';
  if (inFrame()) return 'Во встроенном окне просмотра микрофон недоступен — откройте приложение отдельной страницей.';
  if (!secureOrigin()) return 'Микрофон работает только с адреса в сети (https), не с файла на диске.';
  if (!micOn()) return 'Этот браузер не умеет распознавать речь — нажмите микрофон на клавиатуре телефона.';
  return null;
}
function micBtn(targetId, mode){
  const kb = isIOS();
  return '<button type="button" class="mic" title="' + (kb ? 'Открыть клавиатуру с микрофоном' : 'Сказать голосом') +
    '" onclick="micStart(this,\'' + targetId + '\',\'' + (mode || 'text') + '\')">' + (kb ? '⌨' : '🎙') + '</button>';
}
function fldMic(labelText, inputHtml, targetId, mode){
  return '<div class="fld"><label>' + labelText +
    ' <span style="color:var(--accent)">· можно голосом</span></label><div class="withmic">' +
    inputHtml + micBtn(targetId, mode) + '</div></div>';
}
let rec = null;
function micStart(btn, targetId, mode){
  const el = document.getElementById(targetId);
  if (!el) return;
  if (isIOS()){
    el.focus();
    toast('Нажмите микрофон на клавиатуре — на айфоне диктует она');
    return;
  }
  const why = micWhyNot();
  if (why){ toast(why + ' Пока диктуйте микрофоном на клавиатуре телефона.'); el.focus(); return; }
  if (rec){ try{ rec.stop(); }catch(e){} rec = null; btn.dataset.on = '0'; return; }
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  rec = new R();
  rec.lang = 'ru-RU'; rec.interimResults = false; rec.maxAlternatives = 1;
  btn.dataset.on = '1';
  rec.onresult = e => {
    btn.dataset.on = '0'; rec = null;
    const said = e.results[0][0].transcript;
    if (mode === 'sum'){
      const v = parseSum(said);
      if (v) el.value = v; else toast('Не расслышала сумму: «' + said + '»');
    } else if (mode === 'time'){
      const t = parseTime(said);
      if (t) el.value = t; else toast('Не расслышала время: «' + said + '»');
    } else {
      el.value = mode === 'raw'
        ? tidy((el.value ? el.value + ' ' : '') + said)
        : (el.value ? el.value + ', ' : '') + clean(said);
    }
  };
  rec.onerror = ev => {
    btn.dataset.on = '0'; rec = null;
    toast(ev.error === 'not-allowed'
      ? (inFrame() ? 'Во встроенном окне просмотра микрофон недоступен — откройте приложение отдельной страницей.'
                   : 'Микрофон запрещён — разрешите доступ браузеру.')
      : 'Не получилось расслышать. Попробуйте микрофон на клавиатуре телефона.');
  };
  rec.onend = () => { btn.dataset.on = '0'; rec = null; };
  try{ rec.start(); }catch(e){ btn.dataset.on = '0'; rec = null; }
}
function micStopAll(){ if (rec){ try{ rec.stop(); }catch(e){} rec = null; } }

/* ================= Камера: QR чека и штрих-код продукта =================
   Используется встроенный в браузер распознаватель кодов (BarcodeDetector).
   Он есть в Chrome на Android. Где его нет (Safari на iPhone) — предлагаем
   ручной ввод, приложение не ломается. Никаких внешних библиотек. */

function camSupported(){ return typeof window.BarcodeDetector !== 'undefined'; }
let camStream = null, camStop = false;

function camBox(title, hint){
  return '<h3>' + esc(title) + '</h3><div class="mut">' + esc(hint) + '</div>' +
    '<div class="camwrap"><video id="cam" playsinline muted autoplay></video><div class="camline"></div></div>' +
    '<div class="mut" id="cam-note" style="margin-top:8px">Наведите камеру на код</div>';
}
async function camStart(kinds, onCode){
  camStop = false;
  const video = document.getElementById('cam');
  if (!video) return;
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = camStream;
    await video.play();
  }catch(e){
    document.getElementById('cam-note').textContent = inFrame()
      ? 'Во встроенном окне просмотра камера недоступна — откройте приложение отдельной страницей.'
      : (!secureOrigin() ? 'Камера работает только с адреса в сети (https), не с файла на диске.'
                         : 'Камера запрещена — разрешите доступ браузеру или внесите вручную.');
    return;
  }
  const det = new window.BarcodeDetector({formats:kinds});
  const tick = async () => {
    if (camStop) return;
    try{
      const codes = await det.detect(video);
      if (codes && codes.length){ camEnd(); onCode(codes[0].rawValue); return; }
    }catch(e){}
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}
function camEnd(){
  camStop = true;
  if (camStream){ camStream.getTracks().forEach(t => t.stop()); camStream = null; }
}

/* ---------- чек ---------- */
/* В QR фискального чека лежат реквизиты вида
   t=20260828T1542&s=1842.00&fn=...&i=...&fp=...&n=1
   Состава покупок там нет — он хранится в базе ФНС и запрашивается отдельно. */
function parseReceiptQR(raw){
  const q = {};
  String(raw).split('&').forEach(p => { const [k,v] = p.split('='); if (k) q[k] = v; });
  if (!q.s || !q.t) return null;
  const sum = parseFloat(String(q.s).replace(',','.'));
  const t = String(q.t);
  const date = t.length >= 8 ? t.slice(0,4) + '-' + t.slice(4,6) + '-' + t.slice(6,8) : today();
  const time = t.length >= 13 ? t.slice(9,11) + ':' + t.slice(11,13) : null;
  if (!sum) return null;
  return {sum, date, time, fn:q.fn || null, fd:q.i || null, fp:q.fp || null};
}
function openCheck(){
  if (!camSupported()){
    document.getElementById('sheet-in').innerHTML =
      '<h3>Чек</h3><div class="mut">Этот браузер не умеет читать коды камерой. На айфоне откройте приложение в Chrome ' +
      'или внесите сумму вручную — она есть на чеке крупно.</div>' +
      '<button class="btn" style="margin-top:12px" onclick="openSheet(\'exp\')">Внести сумму</button>' +
      '<button class="btn ghost" style="margin-top:8px" onclick="openSheet(\'voice\')">Сказать голосом</button>' +
      '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Закрыть</button>';
    return;
  }
  document.getElementById('sheet-in').innerHTML =
    camBox('Чек', 'Наведите на квадратный код внизу чека — сумма и дата подставятся сами.') +
    '<button class="btn ghost" style="margin-top:12px" onclick="camEnd();openSheet(\'exp\')">Внести вручную</button>' +
    '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Закрыть</button>';
  camStart(['qr_code'], raw => {
    const r = parseReceiptQR(raw);
    if (!r){ toast('Это не фискальный чек — попробуйте ещё раз'); openCheck(); return; }
    checkConfirm(r);
  });
}
function checkConfirm(r){
  document.getElementById('sheet-in').innerHTML =
    '<h3>Чек прочитан</h3>' +
    '<div class="parse"><div class="to">🧾 <span>' + money(r.sum) + '</span><em>' + humanDate(r.date) + (r.time ? ', ' + r.time : '') + '</em></div></div>' +
    '<div class="fld"><label>Куда отнести</label><div class="pick" id="p-cat">' +
      CATS.map((c,i) => '<button data-v="' + esc(c) + '" aria-pressed="' + (i===0) + '" onclick="pickOne(this)">' + c + '</button>').join('') +
    '</div></div>' +
    '<div class="fld"><label>Название — необязательно</label><input id="f-title" placeholder="Магазин у дома"></div>' +
    '<div class="mut">Состав по позициям в коде не записан: он хранится в базе ФНС и подключается отдельно. ' +
      'Если нужно разделить чек — проговорите голосом, что в нём было.</div>' +
    '<button class="btn" style="margin-top:12px" onclick="saveCheck(' + r.sum + ',\'' + r.date + '\')">Записать расход</button>' +
    '<button class="btn ghost" style="margin-top:8px" onclick="openCheck()">Сканировать другой</button>';
}
function saveCheck(sum, date){
  addExp({title: val('f-title') || 'Покупка по чеку', sum: sum, cat: picked('p-cat','Продукты'), date: date, src:'из чека'});
  closeSheet(); toast('Расход по чеку записан');
}

/* ---------- штрих-код продукта ---------- */
/* Своего справочника производителей нет — он платный. Поэтому приложение
   запоминает продукты сам: незнакомый код вносится один раз и дальше узнаётся. */
function products(){ if (!S.products) S.products = {}; return S.products; }
function openScan(){
  if (!camSupported()){
    document.getElementById('sheet-in').innerHTML =
      '<h3>Штрих-код</h3><div class="mut">Этот браузер не умеет читать коды камерой. Внесите продукт вручную — ' +
      'в следующий раз его можно будет выбрать из своих.</div>' +
      '<button class="btn ok" style="margin-top:12px" onclick="openSheet(\'meal\')">Внести вручную</button>' +
      '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Закрыть</button>';
    return;
  }
  document.getElementById('sheet-in').innerHTML =
    camBox('Штрих-код продукта', 'Наведите на полоски на упаковке.') +
    '<button class="btn ghost" style="margin-top:12px" onclick="camEnd();openSheet(\'meal\')">Внести вручную</button>' +
    '<button class="btn ghost" style="margin-top:8px" onclick="closeSheet()">Закрыть</button>';
  camStart(['ean_13','ean_8','upc_a','upc_e'], code => {
    const p = products()[code];
    if (p) scanKnown(code, p); else scanNew(code);
  });
}
function scanKnown(code, p){
  document.getElementById('sheet-in').innerHTML =
    '<h3>' + esc(p.name) + '</h3>' +
    '<div class="mut num">100 г: ' + num(p.kcal) + ' ккал</div>' +
    '<div class="fld" style="margin-top:12px"><label>Сколько граммов</label><input id="f-g" type="number" inputmode="numeric" value="100"></div>' +
    '<div class="fld"><label>Приём пищи</label><div class="pick" id="p-slot">' +
      SLOTS.map((s,i) => '<button data-v="' + s[0] + '" aria-pressed="' + (i===2) + '" onclick="pickOne(this)">' + s[1] + '</button>').join('') +
    '</div></div>' +
    '<button class="btn ok" onclick="saveScan(\'' + code + '\')">Добавить в дневник</button>' +
    '<button class="btn ghost" style="margin-top:8px" onclick="openScan()">Сканировать другой</button>';
}
function scanNew(code){
  document.getElementById('sheet-in').innerHTML =
    '<h3>Новый продукт</h3>' +
    '<div class="mut">Этот код приложениеу пока незнаком. Впишите один раз — дальше он будет узнаваться сам.</div>' +
    fldMic('Название', '<input id="f-name" placeholder="Хлеб «Бородинский»">', 'f-name') +
    '<div class="fld"><label>Калорийность на 100 г — с упаковки</label><input id="f-kcal100" type="number" inputmode="numeric" placeholder="208"></div>' +
    '<button class="btn" onclick="saveProduct(\'' + code + '\')">Запомнить продукт</button>' +
    '<button class="btn ghost" style="margin-top:8px" onclick="openScan()">Отмена</button>';
}
function saveProduct(code){
  const name = val('f-name'), kcal = +val('f-kcal100');
  if (!name){ toast('Впишите название'); return; }
  products()[code] = {name, kcal: kcal || 0};
  save(); toast('Продукт запомнен');
  scanKnown(code, products()[code]);
}
function saveScan(code){
  const p = products()[code], g = +val('f-g') || 100;
  addMeal({title: p.name + ', ' + g + ' г', slot: picked('p-slot','s'), place:'home',
           kcal: p.kcal ? Math.round(p.kcal * g / 100) : null});
  closeSheet(); toast('Добавлено в дневник');
}

/* мои продукты — список в «Ещё» */
function myProducts(){
  const list = Object.entries(products());
  document.getElementById('sheet-in').innerHTML =
    '<h3>Мои продукты</h3>' +
    (list.length ? list.map(([code,p]) =>
      '<div class="item"><div class="ic">🏷</div><div class="txt"><b>' + esc(p.name) + '</b>' +
      '<small>' + num(p.kcal) + ' ккал на 100 г · ' + esc(code) + '</small></div>' +
      '<button class="del" onclick="forgetProduct(\'' + code + '\')">✕</button></div>').join('')
      : '<div class="empty">Пока пусто. Отсканируйте упаковку — продукт запомнится.</div>') +
    '<button class="btn ghost" style="margin-top:12px" onclick="closeSheet()">Закрыть</button>';
  document.getElementById('sheet').classList.add('open');
}
function forgetProduct(code){ delete products()[code]; save(); myProducts(); }

/* ---------- запуск ---------- */
load();
ART_MODE = S.settings.art || 'web';

/* старое значение бюджета по умолчанию (60 000) осталось у тех,
   кто открывал ранние версии — стираем, чтобы не показывать чужую цифру */
if (S.settings.budget){ delete S.settings.budget; saveQuiet(); }

/* разовая починка старых записей: если дата и время остались внутри названия,
   раскладываем их по местам — событие «Парикмахер, 29 сентября 10:00» становится
   событием «Парикмахер» на 29 сентября в 10:00 */
(function fixOldEvents(){
  if (S.settings.fixedEv) return;
  let changed = 0;
  S.ev.forEach(e => {
    const t = String(e.title || '');
    const hasDate = new RegExp('(' + MONTH_GEN.join('|') + ')', 'i').test(t);
    const hasTime = /[0-9]{1,2}[:.][0-9]{2}/.test(t) || /ноль ноль|часов|утра|вечера/i.test(t);
    if (!hasDate && !hasTime) return;
    const d = parseDate(t), tm = parseTime(' ' + t + ' ');
    const nice = clean(t);
    if (nice) e.title = nice;
    if (hasDate && d) e.date = d;
    if (tm) e.time = tm;
    changed++;
  });
  S.settings.fixedEv = 1;
  if (changed) save(); else saveQuiet();
})();
renderAll();
if (!storageOk) toast('Браузер не сохраняет данные — работайте в обычном режиме, не в инкогнито');

</script>
