# Настройки проекта Supabase для «Точки дня».
# Читаются при выкладке функций.

project_id = "dcpthwmuiodrjepifzsd"

[functions.kalendar]
# Календарь айфона не умеет присылать заголовок авторизации Supabase,
# поэтому проверка токена выключена. Доступ защищает ключ в самой ссылке.
verify_jwt = false

[functions.kabinet]
# Проверку токена делает сама функция: она смотрит, кто спрашивает,
# и отвечает только администратору.
verify_jwt = false

[functions.push]
# Auth is checked against /auth/v1/user; cron uses a private random token.
verify_jwt = false

[functions.tochka-assistant-receiver]
# Telegram authenticates webhook calls with its private secret header.
# The receiver validates that header and the linked private chat itself.
verify_jwt = false
