<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Доступ — Точка дня</title>
<style>*{box-sizing:border-box}body{margin:0;padding:24px 16px;background:#f5eff8;color:#382e45;font:17px/1.5 system-ui,sans-serif}main{max-width:480px;margin:5vh auto;background:white;border-radius:24px;padding:28px}h1{font-size:27px}label{display:block;margin:18px 0 6px}input,button{width:100%;font:inherit;padding:13px;border-radius:12px;border:1px solid #cdbbda}button{margin-top:24px;background:#785498;color:white;border:0;cursor:pointer}button:disabled{opacity:.6}#status{overflow-wrap:anywhere}a{color:#70408f}.mut{font-size:14px;color:#665871}</style>
</head><body><main><h1>Добро пожаловать в «Точку дня»</h1><p id="account"></p><p>Придумайте пароль для приложения. Пароль от вашего почтового ящика здесь не нужен.</p>
<form id="activate"><label for="password">Пароль — не менее 8 символов</label><input id="password" type="password" autocomplete="new-password" minlength="8" required><label for="repeat">Повторите пароль</label><input id="repeat" type="password" autocomplete="new-password" minlength="8" required><button id="submit">Сохранить пароль и открыть приложение</button></form><p id="status" role="status" aria-live="polite"></p><p class="mut">После входа добавьте первую запись. В разделе «Ещё» проверьте надпись «Сохранено в облаке».</p><a href="./">Открыть приложение</a></main>
<script src="supabase.js"></script><script>
const params=new URLSearchParams(location.hash.slice(1));
const invitationToken=params.get('token'), invitationEmail=params.get('email');
const status=document.getElementById('status'), button=document.getElementById('submit');
document.getElementById('account').textContent=invitationEmail?'Доступ для '+invitationEmail:'';
const client=window.supabase?.createClient('https://dcpthwmuiodrjepifzsd.supabase.co','sb_publishable_OL_S1GutrvcvpaRaLzKpsQ_ExxamvKt',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let accepted=false,busy=false;
if(!invitationToken||!invitationEmail||!client){button.disabled=true;status.textContent='Приглашение недоступно. Откройте полную персональную ссылку от Инны.';}
document.getElementById('activate').addEventListener('submit',async event=>{
 event.preventDefault();if(busy||button.disabled)return;
 const password=document.getElementById('password').value;
 if(password.length<8||password!==document.getElementById('repeat').value){status.textContent='Введите одинаковый пароль не короче 8 символов в оба поля.';return;}
 busy=true;button.disabled=true;status.textContent='Подключаем доступ…';
 try{
  if(!accepted){
   const {data,error}=await client.auth.getSession();if(error)throw error;
   if(data.session){
    const same=String(data.session.user?.email||'').toLowerCase()===String(invitationEmail).toLowerCase();
    status.textContent=same?'На эту почту уже выполнен вход. Откройте приложение. Если пароль ещё не задан, используйте «Забыли пароль?» в приложении.':'На этом устройстве открыт другой аккаунт. Это не проверка приглашения. Получателю нужно открыть полную ссылку на своём устройстве или в отдельном профиле браузера.';
    return;
   }
   const result=await client.auth.verifyOtp({token_hash:invitationToken,type:'invite'});
   if(result.error){
    const code=result.error.code||'',message=String(result.error.message||'').toLowerCase();
    if(code==='otp_expired'||message==='expired')status.textContent='Ссылка истекла, заменена новой или уже использована. Если вы уже задавали пароль — откройте приложение и войдите. Иначе попросите Инну создать новую ссылку.';
    else if(result.error.status===429||code==='over_request_rate_limit')status.textContent='Слишком много попыток. Подождите немного и повторите с этой же ссылкой.';
    else status.textContent='Не удалось проверить приглашение. Проверьте интернет и повторите с этой же ссылкой. Если ошибка повторяется, сообщите Инне. Срок ссылки по этой ошибке определить нельзя.';
    return;
   }
   accepted=true;history.replaceState(null,'',location.pathname);
  }
  const result=await client.auth.updateUser({password});if(result.error)throw result.error;
  status.textContent='Пароль сохранён. Открываем приложение…';location.replace('./');
 }catch(error){status.textContent=accepted?'Доступ подтверждён, но пароль не сохранён. Проверьте соединение и повторите на этой странице.':'Не удалось подключиться. Проверьте интернет и повторите.';}
 finally{busy=false;button.disabled=false;}
});
</script></body></html>
