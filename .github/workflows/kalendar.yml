name: Выкладка серверных функций

# Файлы могут лежать где угодно — в папках или прямо в корне.
# Перед выкладкой нужная структура собирается здесь сама.

on:
  workflow_run:
    workflows: ["Проверка приложения"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-supabase-functions
      cancel-in-progress: false
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Собрать структуру для Supabase
        run: |
          mkdir -p supabase/functions/kalendar
          # код функции: берём из папки, а если её нет — из корня
          if [ -f supabase/functions/kalendar/index.ts ]; then
            echo "код на месте"
          elif [ -f index.ts ]; then
            cp index.ts supabase/functions/kalendar/index.ts
          else
            echo "Файл index.ts не найден ни в папке, ни в корне"; exit 1
          fi
          # настройки проекта
          if [ ! -f supabase/config.toml ] && [ -f config.toml ]; then
            cp config.toml supabase/config.toml
          fi

          # Telegram receiver is developed and tested in assistant-lab. Assemble
          # the exact production bundle here so every merge really deploys it.
          receiver_dir="supabase/functions/tochka-assistant-receiver"
          mkdir -p "$receiver_dir"
          cp assistant-lab/direct-telegram/index.ts "$receiver_dir/index.ts"
          # semantic-corpus.mjs — только тестовый корпус; runtime receiver его не импортирует.
          find assistant-lab/direct-telegram -maxdepth 1 -type f -name '*.mjs' \
            ! -name '*-test.mjs' ! -name 'semantic-corpus.mjs' -exec cp {} "$receiver_dir/" \;
          sed -i "s/__BUILD_VERSION__/${DEPLOY_SHA}/g" "$receiver_dir/build-info.mjs"
          test -f "$receiver_dir/receiver.mjs"
          test -f "$receiver_dir/build-info.mjs"
          if grep -R '__BUILD_VERSION__' "$receiver_dir"; then
            echo "Версия сборки Telegram-бота не подставлена"; exit 1
          fi

          # Управление ботом раньше выкладывалось вручную.
          control_dir="supabase/functions/tochka-assistant-control"
          mkdir -p "$control_dir"
          cp assistant-lab/pilot/control.mjs assistant-lab/pilot/common.mjs "$control_dir/"
          cp assistant-lab/pilot/control-index.ts "$control_dir/index.ts"

          # Функция напоминаний раньше выкладывалась вручную.
          reminders_dir="supabase/functions/tochka-telegram-reminders"
          mkdir -p "$reminders_dir"
          cp assistant-lab/reminders/index.ts "$reminders_dir/index.ts"
          find assistant-lab/reminders -maxdepth 1 -type f -name '*.mjs' -exec cp {} "$reminders_dir/" \;
          ls -R supabase

      - name: Проверить точный набор функций
        shell: bash
        run: |
          set -euo pipefail
          deploy_functions=(
            kabinet
            kalendar
            push
            tochka-assistant-calendar
            tochka-assistant-control
            tochka-assistant-link
            tochka-assistant-receiver
            tochka-assistant-sandbox
            tochka-assistant-setup
            tochka-telegram-reminders
          )
          mapfile -t actual_functions < <(
            find supabase/functions -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | LC_ALL=C sort
          )
          mapfile -t expected_functions < <(printf '%s\n' "${deploy_functions[@]}" | LC_ALL=C sort)
          if ! diff -u \
            <(printf '%s\n' "${expected_functions[@]}") \
            <(printf '%s\n' "${actual_functions[@]}"); then
            echo "Набор Edge Functions не совпадает с разрешённым списком" >&2
            exit 1
          fi
          for name in "${deploy_functions[@]}"; do
            test -f "supabase/functions/$name/index.ts" || {
              echo "Нет точки входа функции: $name" >&2
              exit 1
            }
          done
          printf '%s\n' "${deploy_functions[@]}" > "$RUNNER_TEMP/tochka-deploy-functions.txt"

      - uses: supabase/setup-cli@b60b5899c73b63a2d2d651b1e90db8d4c9392f51 # v1.6.0
        with:
          version: 2.117.0

      # Supabase CLI выкладывает функции последовательно и не даёт
      # доказанной атомарной транзакции. Вся сборка проверена до первого
      # deploy; при сбое workflow честно показывает уже обновлённые функции,
      # но не имитирует неподтверждённый автоматический откат.
      - name: Последовательно выложить проверенные функции
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          deployed=()
          report_partial_deploy() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              echo "::error::Выкладка не атомарна. Уже обновлены: ${deployed[*]:-ни одна}. Автоматический откат не выполнялся."
            fi
            exit "$status"
          }
          trap report_partial_deploy EXIT
          while IFS= read -r name; do
            echo "выкладываю $name"
            supabase functions deploy "$name" --project-ref dcpthwmuiodrjepifzsd
            deployed+=("$name")
          done < "$RUNNER_TEMP/tochka-deploy-functions.txt"
          trap - EXIT

      - name: Безопасно проверить выложенные функции
        shell: bash
        run: |
          set -euo pipefail
          base="https://dcpthwmuiodrjepifzsd.supabase.co/functions/v1"
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          request_status() {
            local method=$1 name=$2 expected="$3"
            local code
            code=$(curl --silent --show-error --retry 5 --retry-all-errors --retry-delay 2 \
              --request "$method" --output "$body" --write-out '%{http_code}' \
              --header 'Origin: https://innaodincova-finpro.github.io' \
              "$base/$name")
            if [[ " $expected " != *" $code "* ]]; then
              echo "Проверка $name: ожидался HTTP из набора [$expected], получен $code" >&2
              exit 1
            fi
            LAST_STATUS=$code
          }

          request_status GET tochka-assistant-receiver 200
          grep -Fq "\"version\":\"${DEPLOY_SHA}\"" "$body"
          request_status GET kalendar 400
          request_status GET push 405
          request_status GET kabinet "401 503"
          if [ "$LAST_STATUS" = 503 ]; then
            node - "$body" <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (JSON.stringify(body) !== JSON.stringify({error: 'Кабинет временно не настроен'})) process.exit(1);
          NODE
          fi
          request_status OPTIONS tochka-assistant-link "200 401"
          request_status OPTIONS tochka-assistant-setup "200 401"
          # Both functions require JWT at the Supabase gateway. OPTIONS is
          # side-effect free; depending on gateway handling it is answered by
          # the function (200) or rejected before invocation (401).
          request_status OPTIONS tochka-assistant-calendar "200 401"
          request_status OPTIONS tochka-assistant-sandbox "200 401"
          request_status GET tochka-assistant-control 401
          request_status GET tochka-telegram-reminders 405
