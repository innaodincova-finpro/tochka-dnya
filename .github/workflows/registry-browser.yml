name: Проверка реестра в браузере
on:
  pull_request:
    paths:
      - 'index.html'
      - 'finance-category-browser.cjs'
      - 'more-browser.cjs'
      - 'offline-browser.cjs'
      - 'reestr.html'
      - 'registry*.js'
      - 'registry*.cjs'
      - '.github/workflows/registry-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - run: npx playwright install chromium
      - run: node registry-browser.cjs
      - run: node more-browser.cjs
      - run: node finance-category-browser.cjs
      - run: node offline-browser.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: registry-previews
          path: |
            preview-*.png
            more-dark.png
